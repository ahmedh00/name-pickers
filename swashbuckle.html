        const g = grid(Math.max(...rows.map(row => row.length)), rows.length);
        stampMap(g, rows, 0, 0, legend);
        return paintGrid(g);
    };
    const HAND = pixelMap([
        '..XXX.......',
        '.XwwwX......',
        '.XwwwXXXXXX.',
        'XXwwwwwwwwwX',
        'XwXwwwXXXXX.',
        'XwwwwwwgX...',
        'XwwwwwwgX...',
        '.XgwwwwX....',
        '..XXXXX.....',
    ], { X: PAL.black, w: PAL.white, g: PAL.grey });
    const TANKARD = pixelMap([
        '.wwww...',
        'wwwwww..',
        'XyyyyXX.',
        'XyyyyX.X',
        'XyyyyX.X',
        'XyyyyXX.',
        'XyyyyX..',
        '.XXXX...',
    ], { X: PAL.ink, w: PAL.white, y: PAL.lantern });
    // A cutlass spinning through 8 directions (k * 45 degrees, 0 = pointing right), pivot at its centre cell.
    const SWORD_C = 9;
    const SWORD_FRAMES = Array.from({ length: 8 }, (_, k) => {
        const a = k * Math.PI / 4, dx = Math.cos(a), dy = Math.sin(a);
        const g = grid(19, 19);
        for (let s = -1; s <= 7.5; s += 0.5) cell(g, SWORD_C + 0.5 + dx * s, SWORD_C + 0.5 + dy * s, s < 6.5 ? '#9aa2b4' : PAL.white);
        for (let s = -1.5; s <= 1.5; s += 0.5) cell(g, SWORD_C + 0.5 - dx * 2 - dy * s, SWORD_C + 0.5 - dy * 2 + dx * s, PAL.gold);
        for (let s = 2.5; s <= 4.5; s += 0.5) cell(g, SWORD_C + 0.5 - dx * s, SWORD_C + 0.5 - dy * s, '#4a2a16');
        return paintGrid(inkOutline(g));
    });

    // Blits a pre-rendered text sprite (textSprite layout: 1 px margin) with its text's top-left at (x, y).
    // `reveal` < 1 shows only the left part, for ink and typing wipes.
    function blitText(sprite, x, y, { scale = 1, reveal = 1 } = {}) {
        const w = Math.min(sprite.width, Math.ceil(sprite.width * reveal));
        if (w <= 0) return;
        tx.drawImage(sprite, 0, 0, w, sprite.height, Math.round(x) - scale, Math.round(y) - scale, w * scale, sprite.height * scale);
    }

    // Dialogue is drawn at twice the text layer's size so it reads on a screen-share.
    const SPEECH = { scale: 2, chars: 26, top: 4 };
    const SPEECH_LINE = LINE_H * SPEECH.scale;

    // A line of dialogue laid out once: wrapped, each row centred over cx, the block ending at `bottom`
    // and clamped on-screen. If it would run off the top, it wraps wider (fewer, longer rows).
    function speech(str, colour, cx, bottom) {
        const { scale } = SPEECH;
        const maxChars = Math.floor((TEXT_W - 12 + scale) / (ADVANCE * scale));
        let lines;
        for (let chars = SPEECH.chars; ; chars += 6) {
            lines = wrapText(fold(str), chars * ADVANCE - 1);
            if (bottom - lines.length * SPEECH_LINE >= SPEECH.top || chars >= maxChars) break;
        }
        const width = Math.max(...lines.map(textWidth)) * scale;
        const left = clamp(Math.round(cx - width / 2), 6, TEXT_W - 6 - width);
        const top = Math.max(SPEECH.top, bottom - lines.length * SPEECH_LINE);
        let chars = 0;
        const rows = lines.map((line, n) => {
            const row = {
                text: line, sprite: textSprite(line, colour),
                x: left + Math.round((width - textWidth(line) * scale) / 2), y: top + n * SPEECH_LINE, from: chars,
            };
            chars += line.length;
            return row;
        });
        return { rows, chars, top };
    }

    // Draws the first `shown` characters of a laid-out line (monospace, so a prefix is a clipped blit).
    function drawSpeech(sp, shown = Infinity, dy = 0) {
        for (const row of sp.rows) {
            const n = clamp(shown - row.from, 0, row.text.length);
            const reveal = n === row.text.length ? 1 : (n * ADVANCE + 1) / row.sprite.width;
            if (n > 0) blitText(row.sprite, row.x, row.y + dy, { scale: SPEECH.scale, reveal });
        }
    }

    // How long a line takes to type: { dur, step } with step the time per character.
    function typing(chars, t) {
        const dur = clamp(chars * t.perChar, t.minType, t.maxType);
        return { dur, step: dur / Math.max(1, chars) };
    }

    // A blip as each visible character of a laid-out line appears.
    function blips(sp, step, offset = 0) {
        const events = [];
        for (const row of sp.rows) {
            [...row.text].forEach((ch, i) => {
                if (ch !== ' ') events.push({ at: offset + (row.from + i) * step, kind: 'sfx', name: 'blip' });
            });
        }
        return events;
    }

    const optionText = (o) => o.kind === 'pair' ? DuelCore.PAIRS[o.id].comeback : DuelCore.DUDS[o.id];

    // --- The tournament notice ---
    let noticeCanvas = null;

    // The wooden wall and the pinned parchment, on the scene layer.
    function noticeBoard() {
        if (noticeCanvas) return noticeCanvas;
        const [canvas, c] = makeLayer(SCENE_W, SCENE_H);
        const rand = seeded(97);
        for (let x = 0; x < SCENE_W; x += 12) {
            box(c, rand() < 0.4 ? PAL.wood2 : PAL.wood1, x, 0, 12, SCENE_H);
            box(c, PAL.wood0, x, 0, 1, SCENE_H);
            box(c, PAL.wood0, x + 4 + Math.floor(rand() * 5), Math.floor(rand() * SCENE_H), 2, 1);
        }
        const L = 6, T = 5, W = 308, H = 170;
        box(c, PAL.wood0, L + 2, T + 2, W, H);
        box(c, PAL.parchment, L, T, W, H);
        // Age stains, kept to the margins so the bracket stays crisp.
        for (const [cx, cy, r] of [[18, 20, 10], [300, 160, 12], [24, 150, 8], [292, 26, 7], [160, 170, 9]]) {
            for (let y = cy - r; y <= cy + r; y++) {
                for (let x = cx - r; x <= cx + r; x++) {
                    if (x > L && x < L + W - 1 && y > T && y < T + H - 1 && Math.hypot(x - cx, y - cy) < r && bayer(x, y) < 3) box(c, PAL.parchmentDark, x, y);
                }
            }
        }
        frameRect(c, PAL.parchmentDark, L, T, W, H);
        // Ragged edge: nibbles out of the border.
        for (let x = L; x < L + W; x++) {
            if (rand() < 0.18) box(c, PAL.wood1, x, T);
            if (rand() < 0.18) box(c, PAL.wood0, x, T + H - 1);
        }
        for (const [nx, ny] of [[L + 3, T + 3], [L + W - 6, T + 3], [L + 3, T + H - 6], [L + W - 6, T + H - 6]]) {
            box(c, PAL.greyDark, nx, ny, 3, 3);
            box(c, PAL.grey, nx, ny, 2, 2);
            box(c, PAL.white, nx, ny, 1, 1);
        }
        return noticeCanvas = canvas;
    }

    // Bracket geometry on the text layer: two halves meet at the centre, the final in the middle.
    // Round-1 columns always fit this game's longest name (up to 18 characters) and "drinking grog";
    // later columns share what is left and truncate long names with a trailing '.'.
    const BRACKET = { left: 16, width: 608, top: 54, bottom: 342, gap: 6, widest: 116, narrowest: 94 };

    function bracketGeometry(plan) {
        const R = plan.rounds.length, k = R - 1, { left, width, top, bottom, gap } = BRACKET;
        const longest = Math.max(...game.names.map((name, i) => nameSprite(name, plan.textColour[i]).width));
        const full = clamp(longest + 6, BRACKET.narrowest, BRACKET.widest);
        const later = k > 1 ? Math.min(BRACKET.widest, Math.floor((width - 2 * (full + k * gap)) / (2 * (k - 1) + 1))) : full;
        const colW = r => (r === 0 ? full : later);
        const centreW = k === 0 ? full : later;
        let used = centreW;
        for (let r = 0; r < k; r++) used += 2 * (colW(r) + gap);
        const x0 = left + Math.floor((width - used) / 2);
        const colsL = [];
        let x = x0;
        for (let r = 0; r < k; r++) {
            colsL.push({ x, w: colW(r) });
            x += colW(r) + gap;
        }
        const centre = { x, w: centreW };
        const colsR = colsL.map(col => ({ x: 2 * x0 + used - col.x - col.w, w: col.w }));
        const cy = Math.round((top + bottom) / 2);
        const rowH = (bottom - top) / (plan.size / 2);
        const maxChars = w => Math.floor((w - 3) / ADVANCE);

        // slots[r][s]: where round r's entrant s sits. Its name sits on a line at lineY.
        const slots = [];
        for (let r = 0; r < R; r++) {
            const count = plan.size >> r;
            const row = [];
            for (let s = 0; s < count; s++) {
                if (r === k) {
                    row.push({ x: centre.x, w: centre.w, lineY: s === 0 ? cy - 16 : cy + 20, align: 'center', maxChars: maxChars(centre.w) });
                } else {
                    const isLeft = s < count / 2, i = isLeft ? s : s - count / 2, col = (isLeft ? colsL : colsR)[r];
                    row.push({ x: col.x, w: col.w, lineY: Math.round(top + (i + 0.5) * rowH * 2 ** r), align: isLeft ? 'left' : 'right', maxChars: maxChars(col.w) });
                }
            }
            slots.push(row);
        }

        // The empty bracket (lines, joins and the "vs"), drawn once.
        const [skeleton, c] = makeLayer(TEXT_W, TEXT_H);
        const line = (x, y, w, h) => box(c, PAL.ink, Math.round(x), Math.round(y), Math.round(w), Math.round(h));
        line(left + 8, 40, width - 16, 1);
        slots.forEach((row, r) => row.forEach((slot, s) => {
            line(slot.x, slot.lineY, slot.w, 1);
            if (r === k || s % 2) return;
            const next = row[s + 1];
            const barX = slot.align === 'left' ? slot.x + slot.w : slot.x - 1;
            line(barX, slot.lineY, 1, next.lineY - slot.lineY + 1);
            const midY = Math.round((slot.lineY + next.lineY) / 2);
            if (r < k - 1) {
                line(slot.align === 'left' ? barX : barX - gap, midY, gap + 1, 1);
            } else {
                // Into the final: across to the centre column, then up (left half) or down (right half) to its line.
                const target = slots[k][slot.align === 'left' ? 0 : 1];
                const edge = slot.align === 'left' ? target.x : target.x + target.w - 1;
                line(Math.min(barX, edge), midY, Math.abs(edge - barX) + 1, 1);
                line(edge, Math.min(midY, target.lineY), 1, Math.abs(target.lineY - midY) + 1);
            }
        }));
        const vs = textSprite('vs', PAL.ink, false);
        c.drawImage(vs, centre.x + Math.round((centre.w - textWidth('vs')) / 2) - 1, cy - 6);
        return { slots, skeleton };
    }

    // Where a name or label of `width` px sits in a slot: its text's left x and top y.
    function slotText(slot, width) {
        const x = slot.align === 'left' ? slot.x + 2 : slot.align === 'right' ? slot.x + slot.w - 2 - width : slot.x + Math.round((slot.w - width) / 2);
        return { x, y: slot.lineY - 9 };
    }

    // Shortens a name to fit a column, marking the cut with a trailing '.'.
    function fitName(name, maxChars) {
        const chars = [...fold(DuelCore.displayName(name))];
        return chars.length <= maxChars ? chars.join('') : chars.slice(0, maxChars - 1).join('').trimEnd() + '.';
    }

    const GROG = textSprite('drinking grog', PAL.wood1, false);

    // The notice before round r: everything decided so far. On an update notice the previous round's
    // results ink in one match at a time (loser struck through, then the winner written into the next slot).
    function noticeBeat(plan, geo, r) {
        const update = r > 0;
        const items = [];
        const inks = [];
        const decided = plan.rounds[r - 1] ? plan.rounds[r - 1].filter(m => !m.bye).length : 0;
        const stepAt = n => 0.2 + n * Math.min(0.2, 1.1 / Math.max(1, decided));
        const nameItem = (idx, slot, at) => {
            const sprite = nameSprite(fitName(game.names[idx], slot.maxChars), plan.textColour[idx]);
            items.push({ idx, sprite, at, struckAt: null, ...slotText(slot, sprite.width) });
            return items[items.length - 1];
        };
        plan.seeds.forEach((idx, s) => {
            const slot = geo.slots[0][s];
            if (idx < 0) items.push({ grog: true, ...slotText(slot, 10 + textWidth('drinking grog')) });
            else nameItem(idx, slot, null);
        });
        const byIdx = new Map();
        for (const it of items) if (!it.grog) byIdx.set(`0:${it.idx}`, it);
        for (let j = 0; j < plan.rounds.length; j++) {
            let n = 0;
            plan.rounds[j].forEach((m, k) => {
                const isNew = update && j === r - 1 && !m.bye;
                const known = m.bye || j < r;
                if (!m.bye && j < r) {
                    const loser = m.winner === m.a ? m.b : m.a;
                    const struck = byIdx.get(`${j}:${loser}`);
                    struck.struckAt = isNew ? stepAt(n) : 0;
                }
                if (known && j + 1 < plan.rounds.length) {
                    const at = isNew ? stepAt(n) + 0.12 : null;
                    byIdx.set(`${j + 1}:${m.winner}`, nameItem(m.winner, geo.slots[j + 1][k], at));
                    if (isNew) inks.push(at);
                }
                if (isNew) n++;
            });
        }
        const heading = textSprite(NOTICE_HEADINGS[fromEnd(plan, r)], PAL.ink, false);
        return {
            kind: 'notice', dur: update ? TIMING.noticeUpdate : TIMING.notice,
            data: { geo, items, heading },
            // No status line here: it would land at the same instant as the last duel's result and replace it.
            events: inks.map(at => ({ at, kind: 'sfx', name: 'blip' })),
        };
    }

    function drawNotice(beat, u) {
        const { geo, items, heading } = beat.data;
        sx.drawImage(noticeBoard(), 0, 0);
        tx.drawImage(geo.skeleton, 0, 0);
        blitText(heading, TEXT_W / 2 - (heading.width - 2), 16, { scale: 2 });
        for (const it of items) {
            if (it.grog) {
                tx.drawImage(TANKARD, it.x, it.y - 1);
                blitText(GROG, it.x + 10, it.y);
                continue;
            }
            const struck = it.struckAt !== null && u >= it.struckAt;
            const reveal = it.at === null ? 1 : span(u, it.at, it.at + 0.2);
            if (struck) tx.globalAlpha = 0.5;
            blitText(it.sprite.canvas, it.x, it.y, { reveal });
            tx.globalAlpha = 1;
            if (struck) {
                tx.fillStyle = PAL.red;
                tx.fillRect(it.x - 1, it.y + 3, Math.round((it.sprite.width + 2) * span(u, it.struckAt, it.struckAt + 0.15)), 2);
            }
        }
    }

    // --- Duels ---
    const PIRATE_TOP = 40;
    // Names over heads are drawn at dialogue size, so a label is two text rows tall plus a 4 px gap above the head.
    const NAME_SCALE = 2;
    const nameYAt = (y, top = PIRATE_TOP) => (y - top) * 2 - (LINE_H * NAME_SCALE + 4);

    // Everything a duel's beats share, laid out once: who stands where, the typed lines and the menu.
    function buildDuel(plan, m, remaining) {
        const st = STAGE[m.location];
        const side = (idx, isLeft) => {
            const colour = plan.textColour[idx];
            return {
                idx, colour, base: isLeft ? st.leftX : st.rightX, dir: isLeft ? 1 : -1, faceLeft: !isLeft,
                phase: isLeft ? 0 : 0.2, label: nameSprite(game.names[idx], colour),
            };
        };
        const attacker = side(m.attacker, m.attackerLeft);
        const defender = side(m.defender, !m.attackerLeft);
        const winner = m.winner === attacker.idx ? attacker : defender;
        const loser = winner === attacker ? defender : attacker;
        const bottom = nameYAt(st.floorY) - 6;
        const insultText = m.captain ? DuelCore.PAIRS[m.pair].captain : DuelCore.PAIRS[m.pair].insult;
        const landed = m.chosenSlot === m.correctSlot;
        const round = ROUND_NAMES[fromEnd(plan, m.round)];
        const pirates = remaining === 1 ? '1 pirate remains.' : `${remaining} pirates remain.`;
        const d = {
            m, st, loc: m.location, attacker, defender, winner, loser,
            close: Math.max(0, Math.round((st.rightX - st.leftX - 40) / 2)),
            insult: speech(insultText, attacker.colour, attacker.base * 2, bottom),
            comeback: speech(optionText(m.menu[m.chosenSlot]), defender.colour, defender.base * 2, bottom),
            menu: menuLayout(m.menu, defender.colour),
            menuPan: 0,
            // On a dud the defender is the one who goes out.
            status: landed
                ? `${round}: ${game.names[defender.idx]}'s comeback lands! ${game.names[loser.idx]} is out. ${pirates}`
                : `${round}: ${game.names[defender.idx]} fluffs it and is out! ${pirates}`,
        };
        if (m.gag === 'cliff') {
            const away = -loser.dir;
            const edge = away < 0 ? st.edgeLeft : st.edgeRight;
            d.shout = speech("I'll be back!", loser.colour, (edge + away * 10) * 2, nameYAt(st.floorY, 34) - 4);
        }
        // A tall menu would cover the pirates' faces (a head, full beard included, ends 20 px above the
        // floor): the camera tilts up just enough, plus a 4 px margin, while it is open. The panel always
        // covers the strip this uncovers.
        d.menuPan = Math.max(0, Math.ceil(st.floorY - 16 - (SCENE_H - d.menu.height / 2)));
        return d;
    }

    // The comeback menu, laid out once at dialogue size: the number in its own column, the option wrapped
    // beside it, in normal, hovered and picked colours.
    const MENU = { scale: 2, pad: 7, gap: 6, handX: 4, numX: 32, textX: 60, dim: '#7d8cc4' };
    const MENU_LINE = LINE_H * MENU.scale;

    function menuLayout(menu, colour) {
        const maxChars = Math.floor((TEXT_W - MENU.textX - 6 + MENU.scale) / (ADVANCE * MENU.scale));
        const sprites = (line) => ({ normal: textSprite(line, MENU.dim), hover: textSprite(line, colour), pick: textSprite(line, PAL.white) });
        let y = MENU.pad;
        const rows = menu.map((o, i) => {
            const lines = wrapText(fold(optionText(o)), maxChars * ADVANCE - 1);
            const row = {
                y, num: sprites(`${i + 1}.`),
                lines: lines.map((line, n) => ({ dy: n * MENU_LINE, ...sprites(line) })),
            };
            y += lines.length * MENU_LINE + MENU.gap;
            return row;
        });
        return { rows, height: y - MENU.gap + MENU.pad };
    }

    // How far the menu panel is open: sliding up in the menu beat, away in the first 0.15 s of the comeback.
    function menuOpen(u, kind) {
        if (kind === 'menu') return easeOut(span(u, 0, TIMING.menu.slide));
        if (kind === 'comeback') return 1 - span(u, 0, 0.15);
        return 0;
    }

    // Seconds per cursor step: 0.45 s each, but a long dither shares hoverMax. The final takes its time.
    const hoverStep = (m) => (m.captain ? TIMING.finalHover : Math.min(TIMING.menu.hover, TIMING.menu.hoverMax / m.hovers.length));

    // The final's walk-out: a few cautious steps each, and a moment of arm-windmilling at every creak.
    const FINAL_WALK = Object.freeze({ steps: 4, creaks: [0.15, 1.05] });
    // The gangplank (and whoever stands on it) bobs 1 px up and down through the whole final.
    const plankWobble = () => Math.round(Math.sin(run.t * 4.4));

    // Clash timing as fractions of the beat: three sword hits, the last one decides it.
    const CLASH = { close: 0.15, swap: 0.4, decide: 0.62, hits: [0.2, 0.45, 0.66], shake: [0.66, 0.86] };

    function duelBeats(plan, m, remaining) {
        const d = buildDuel(plan, m, remaining);
        const ins = typing(d.insult.chars, TIMING.insult);
        const cb = typing(d.comeback.chars, TIMING.comeback);
        const step = hoverStep(m);
        const { slide, pick } = TIMING.menu;
        Object.assign(d, { insultStep: ins.step, insultDur: ins.dur, comebackStep: cb.step, comebackDur: cb.dur, hoverStep: step });
        const gag = GAG_SCRIPTS[m.gag];
        const walkin = m.captain
            ? { kind: 'final-walk', dur: TIMING.finalWalk, data: d, events: FINAL_WALK.creaks.map(at => ({ at, kind: 'sfx', name: 'creak' })) }
            : { kind: 'walkin', dur: TIMING.walkin, data: d, events: [] };
        return [
            walkin,
            { kind: 'insult', dur: ins.dur + TIMING.insult.hold, data: d, events: blips(d.insult, ins.step) },
            {
                kind: 'menu', dur: slide + m.hovers.length * step + pick, data: d,
                events: [...m.hovers.map((_, k) => ({ at: slide + k * step, kind: 'sfx', name: 'ooh' })), { at: slide + m.hovers.length * step, kind: 'sfx', name: 'blip' }],
            },
            { kind: 'comeback', dur: cb.dur + TIMING.comeback.hold, data: d, events: blips(d.comeback, cb.step) },
            { kind: 'clash', dur: TIMING.clash, data: d, events: CLASH.hits.map(at => ({ at: at * TIMING.clash, kind: 'sfx', name: 'clang' })) },
            {
                kind: 'gag', dur: TIMING.gag, data: d,
                events: [
                    ...gag.sounds.map(([at, name]) => ({ at, kind: 'sfx', name })),
                    { at: TIMING.gag, kind: 'out', idx: d.loser.idx },
                    { at: TIMING.gag, kind: 'status', text: d.status },
                ],
            },
        ];
    }

    const DOCK_DOOR_X = 47;
    // A pirate standing `off` px forward of their mark (forward = towards the opponent).
    const fwd = (p, off) => p.base + p.dir * off;
    const idleFrame = (p) => (Math.floor((run.t + p.phase) / 0.4) % 2 ? 'idle1' : 'idle0');
    const place = (p, x, y, frame, extra = {}) => ({ p, x, y, frame, faceLeft: p.faceLeft, top: PIRATE_TOP, ...extra });

    // The knockout gags. pose(d, u) moves the loser (and props) as a pure function of u; sounds are [at, sfx].
    // Each starts from where the clash left the loser: staggered 10 px back from their closed-in mark.
    const GAG_SCRIPTS = {
        splash: {
            sounds: [[0.62, 'splash']],
            pose(d, u) {
                const { loser: l, st } = d, away = -l.dir, x0 = fwd(l, d.close - 10);
                if (u < 0.12) return { loser: place(l, x0, st.floorY, 'stagger') };
                const k = span(u, 0.12, 0.62), x = x0 + away * 30 * k;
                const y = u < 0.62 ? st.floorY + (st.splashY - st.floorY) * k * k - 16 * Math.sin(Math.PI * k) : st.splashY + 110 * (u - 0.62);
                return {
                    loser: place(l, x, y, 'fall', { clipY: st.splashY + 1, top: 34, hideName: u >= 0.62 }),
                    fx: [{ kind: 'splash', x, y: st.splashY, age: u - 0.62 }],
                };
            },
        },
        // Bolts for the boathouse door (dock x 47) and vanishes inside.
        runaway: {
            sounds: [[0.3, 'creak']],
            pose(d, u) {
                const { loser: l, st } = d, away = -l.dir, x0 = fwd(l, d.close - 10);
                const hat = hats[l.idx];
                const k = span(u, 0.04, 0.5);
                const hx0 = x0 - PIRATE_ANCHOR.x + (l.faceLeft ? PIRATE_W - hat.x - hat.w : hat.x);
                const hy0 = st.floorY - PIRATE_ANCHOR.y + hat.y;
                const fx = [{
                    kind: 'hat', idx: l.idx, faceLeft: l.faceLeft,
                    x: hx0 - away * 10 * k, y: lerp(hy0, st.floorY - hat.h + 1, k * k) - 16 * Math.sin(Math.PI * k),
                }];
                if (u < 0.3) return { loser: place(l, x0, st.floorY, 'bare'), fx };
                const x = x0 - 200 * (u - 0.3);
                const frame = Math.floor(u / 0.08) % 2 ? 'run0' : 'run1';
                return { loser: place(l, x, st.floorY, frame, { faceLeft: true, hidden: x <= DOCK_DOOR_X }), fx };
            },
        },
        facedown: {
            sounds: [[0.6, 'creak'], [0.7, 'squawk']],
            flap: [0.65, 1.1],
            pose(d, u) {
                const { loser: l, st } = d, away = -l.dir, x0 = fwd(l, d.close - 10);
                const table = st.tables[away < 0 ? 0 : 1];
                // The facedown frame's arm and sword hang below the body, over the table's front edge.
                const restY = table.y + 13;
                if (u < 0.1) return { loser: place(l, x0, st.floorY, 'stagger') };
                if (u < 0.6) {
                    const k = span(u, 0.1, 0.6);
                    return { loser: place(l, lerp(x0, table.x, k), lerp(st.floorY, restY, k) - 26 * Math.sin(Math.PI * k), 'fall', { top: 34 }) };
                }
                return {
                    loser: place(l, table.x, restY, 'facedown', { faceLeft: away < 0, top: 32 }),
                    fx: [{ kind: 'zzz', x: table.x + away * 18, y: table.y - 4, age: u - 0.9, colour: l.colour }],
                };
            },
        },
        swordbeam: {
            sounds: [[0.6, 'clang'], [0.8, 'squawk']],
            flap: [0.75, 1.2],
            pose(d, u) {
                const { loser: l, st } = d, away = -l.dir, x0 = fwd(l, d.close - 10);
                const hand = PIRATE_MARKS.stagger.hand;
                const sx0 = x0 - PIRATE_ANCHOR.x + (l.faceLeft ? PIRATE_W - hand.x : hand.x);
                const sy0 = st.floorY - PIRATE_ANCHOR.y + hand.y;
                // Stuck point first (pivot), with the tip in the beam's underside.
                const stuckX = x0 + away * 6, stuckY = st.beamY + 1 + 7;
                const k = span(u, 0, 0.6);
                const quiver = u >= 0.6 && u < 0.9 && !reducedMotion() ? (Math.floor(u / 0.04) % 2 ? 1 : -1) : 0;
                const sword = {
                    kind: 'sword', frame: u < 0.6 ? Math.floor(u * 22) % 8 : 6,
                    x: lerp(sx0, stuckX, k) + quiver, y: lerp(sy0, stuckY, easeOut(k)),
                };
                const flail = u >= 0.45 && u < 1.2;
                const jitter = flail ? (Math.floor(u / 0.06) % 2 ? 1 : 0) : 0;
                return { loser: place(l, x0 + jitter, st.floorY, flail ? 'flail' : 'unarmed'), fx: [sword] };
            },
        },
        cliff: {
            sounds: [[0.6, 'ooh'], [1.25, 'splash']],
            pose(d, u) {
                const { loser: l, st } = d, away = -l.dir, x0 = fwd(l, d.close - 10);
                const edge = (away < 0 ? st.edgeLeft : st.edgeRight) - away * 6;
                const fx = [];
                let p;
                if (u < 0.6) {
                    p = place(l, lerp(x0, edge, easeOut(u / 0.6)), st.floorY - (Math.floor(u / 0.1) % 2), 'stagger');
                } else if (u < 0.85) {
                    p = place(l, edge + Math.round(Math.sin((u - 0.6) * 40) * 1.5), st.floorY, 'wobble');
                } else {
                    const t = u - 0.85;
                    const x = edge + away * 16 * Math.min(1, t / 0.4);
                    p = place(l, x, st.floorY + 225 * t * t, 'fall', { clipY: st.splashY + 1, top: 34, hideName: u >= 1.25 });
                    fx.push({ kind: 'splash', x: edge + away * 16, y: st.splashY, age: u - 1.25 }, { kind: 'shout', dy: (Math.min(p.y, st.splashY) - st.floorY) * 2 });
                }
                return { loser: p, fx };
            },
        },
        plank: {
            sounds: [[0.3, 'creak'], [1.1, 'splash']],
            pose(d, u) {
                const { loser: l, st } = d, away = -l.dir, x0 = fwd(l, d.close - 10);
                const back = x0 + away * 6;
                if (u < 0.3) return { loser: place(l, x0 + away * 6 * easeOut(u / 0.3), st.floorY, 'stagger') };
                if (u < 0.75) return { loser: place(l, back + Math.round(Math.sin((u - 0.3) * 18) * 2), st.floorY, 'wobble') };
                const t = u - 0.75;
                const x = back + away * 4 * Math.min(1, t / 0.35);
                return {
                    loser: place(l, x, st.floorY + 441 * t * t, 'fall', { clipY: st.splashY + 1, top: 34, hideName: u >= 1.1 }),
                    fx: [{ kind: 'splash', x: back + away * 4, y: st.splashY, age: u - 1.1, big: true }],
                };
            },
        },
    };

    // Both pirates (and any props) for a duel beat at local time u.
    function duelPoses(beat, u) {
        const d = beat.data, { attacker: a, defender: f, st } = d;
        const stand = (p, off = 0) => place(p, fwd(p, off), st.floorY, idleFrame(p));
        if (beat.kind === 'walkin') {
            const k = easeOut(u / beat.dur);
            const walk = (p) => {
                // On the gangplank they walk out from the ships' rails; elsewhere they stride in from 80 px back.
                const from = d.loc === 'plank' ? (p.dir > 0 ? st.plankX0 + 8 : st.plankX1 - 8) : fwd(p, -80);
                const frame = u < beat.dur * 0.9 ? (Math.floor(u / 0.12) % 2 ? 'idle1' : 'idle0') : idleFrame(p);
                return place(p, Math.round(lerp(from, p.base, k)), st.floorY, frame);
            };
            return { poses: [walk(a), walk(f)], fx: [] };
        }
        if (beat.kind === 'final-walk') {
            const { steps, creaks } = FINAL_WALK, end = beat.dur * 0.92;
            const k = clamp(u / end, 0, 1) * steps, n = Math.min(steps - 1, Math.floor(k)), frac = k - n;
            const prog = k >= steps ? 1 : (n + easeOut(clamp(frac / 0.55, 0, 1))) / steps;
            const moving = u < end && frac < 0.55;
            const balancing = creaks.some(at => u >= at && u < at + 0.35);
            const walk = (p) => {
                const from = p.dir > 0 ? st.plankX0 + 8 : st.plankX1 - 8;
                const frame = balancing ? 'wobble' : moving ? (Math.floor(u / 0.12) % 2 ? 'idle1' : 'idle0') : idleFrame(p);
                return place(p, Math.round(lerp(from, p.base, prog)), st.floorY, frame);
            };
            return { poses: [walk(a), walk(f)], fx: [] };
        }
        if (beat.kind === 'clash') {
            const T = u / beat.dur;
            const c = d.close * easeOut(span(T, 0, CLASH.close));
            const fx = [];
            let pa, pf, lunger;
            if (T < CLASH.close) {
                const frame = Math.floor(T / 0.05) % 2 ? 'idle1' : 'idle0';
                pa = place(a, fwd(a, c), st.floorY, frame);
                pf = place(f, fwd(f, c), st.floorY, frame);
            } else if (T < CLASH.swap) {
                pa = place(a, fwd(a, c + 8), st.floorY, 'lunge');
                pf = place(f, fwd(f, c), st.floorY, 'parry');
                lunger = pa;
            } else if (T < CLASH.decide) {
                pf = place(f, fwd(f, c + 8), st.floorY, 'lunge');
                pa = place(a, fwd(a, c), st.floorY, 'parry');
                lunger = pf;
            } else {
                const k = easeOut(span(T, CLASH.decide, CLASH.decide + 0.2));
                const win = place(d.winner, fwd(d.winner, c + 8), st.floorY, 'lunge');
                const lose = place(d.loser, fwd(d.loser, c - 10 * k), st.floorY, 'stagger');
                [pa, pf] = d.winner === a ? [win, lose] : [lose, win];
                lunger = win;
            }
            if (lunger && CLASH.hits.some(h => T >= h && T < h + 0.08)) fx.push({ kind: 'spark', x: lunger.x + lunger.p.dir * 22, y: st.floorY - 21 });
            return { poses: [pa, pf], fx };
        }
        if (beat.kind === 'gag') {
            const w = d.winner;
            const back = easeOut(span(u, 0, 0.2));
            const frame = u < 0.2 ? 'lunge' : u >= 1.25 ? 'parry' : idleFrame(w);
            const win = place(w, fwd(w, d.close + 8 * (1 - back)), st.floorY, frame);
            const { loser, fx = [] } = GAG_SCRIPTS[d.m.gag].pose(d, u);
            return { poses: [win, loser], fx };
        }
        return { poses: [stand(a), stand(f)], fx: [] };
    }

    function drawPirate(p) {
        if (p.hidden) return;
        const sprite = pirateFrame(p.p.idx, p.frame, p.faceLeft);
        const x = Math.round(p.x) - PIRATE_ANCHOR.x, y = Math.round(p.y) - PIRATE_ANCHOR.y;
        if (p.clipY === undefined) {
            sx.drawImage(sprite, x, y);
        } else if (y < p.clipY) {
            const h = Math.min(PIRATE_H, p.clipY - y);
            sx.drawImage(sprite, 0, 0, PIRATE_W, h, x, y, PIRATE_W, h);
        }
    }

    // Droplets [vx, vy] for a splash, fixed so every splash looks the same.
    const DROPS = [[-1.1, 0.9], [-0.7, 1.3], [-0.35, 1.65], [-0.1, 1.85], [0.15, 1.75], [0.45, 1.45], [0.8, 1.15], [1.15, 0.8], [-0.9, 0.55], [0.95, 0.5]];

    // A splash `age` seconds after something hits the water at (x, y): a crown of spray, flying drops,
    // then a foam ring that spreads and breaks up.
    function drawSplash({ x, y, age, big }) {
        if (age < 0 || age > 1.0) return;
        const s = big ? 1.6 : 1;
        x = Math.round(x);
        if (age < 0.4) {
            const rise = Math.sin(Math.PI * Math.min(1, age / 0.4));
            const h = Math.round(20 * s * rise);
            box(sx, PAL.white, x - Math.round(2 * s), y - h, Math.round(5 * s), h);
            box(sx, PAL.ice, x - Math.round(5 * s), y - Math.round(h * 0.6), Math.round(3 * s), Math.round(h * 0.6));
            box(sx, PAL.ice, x + Math.round(3 * s), y - Math.round(h * 0.65), Math.round(3 * s), Math.round(h * 0.65));
            box(sx, PAL.white, x - Math.round(8 * s), y - Math.round(h * 0.3), Math.round(2 * s), Math.round(h * 0.3));
            box(sx, PAL.white, x + Math.round(7 * s), y - Math.round(h * 0.35), Math.round(2 * s), Math.round(h * 0.35));
        }
        const size = big ? 2 : 1;
        for (const [n, [vx, vy]] of DROPS.entries()) {
            const dy = vy * 70 * s * age - 150 * age * age;
            if (dy < 0) continue;
            box(sx, n % 2 ? PAL.white : PAL.ice, Math.round(x + vx * 36 * s * age), Math.round(y - dy), size, size + 1);
        }
        const rw = Math.round((14 + 50 * age) * s);
        for (let i = 0; i < rw; i++) {
            if (age > 0.5 && (i + Math.floor(age * 24)) % 3 === 0) continue;
            box(sx, i % 5 ? PAL.white : PAL.ice, x - (rw >> 1) + i, y - (i % 7 === 3 ? 1 : 0), 1, age < 0.6 ? 2 : 1);
        }
    }

    function drawSpark(x, y) {
        x = Math.round(x);
        box(sx, PAL.flame, x - 3, y, 7, 1);
        box(sx, PAL.flame, x, y - 3, 1, 7);
        box(sx, PAL.white, x - 1, y - 1, 3, 3);
        box(sx, PAL.flame, x - 2, y - 2, 1, 1);
        box(sx, PAL.flame, x + 2, y + 2, 1, 1);
        box(sx, PAL.flame, x + 2, y - 2, 1, 1);
        box(sx, PAL.flame, x - 2, y + 2, 1, 1);
    }

    const LABELS = {};
    function label(text, colour, outline = true) {
        const key = `${text}|${colour}|${outline}`;
        return LABELS[key] || (LABELS[key] = textSprite(text, colour, outline));
    }

    // Lettering and the grumpy parrot that belong to a location.
    function drawDressing(loc, flap) {
        if (loc === 'tavern') {
            const { sign, perch } = STAGE.tavern;
            const s = label('The Leaky Abstraction', PAL.gold);
            blitText(s, (sign.x + sign.w / 2) * 2 - Math.round(s.width / 2), (sign.y + sign.h / 2) * 2 - 4);
            const flapping = flap || run.t % 6.5 < 0.3;
            const frame = flapping ? (Math.floor(run.t / 0.07) % 2 ? 'flap0' : 'flap1') : 'perch';
            sx.drawImage(parrotFrame(frame, true), perch.x - PARROT_ANCHOR.x, perch.y - PARROT_ANCHOR.y);
        } else if (loc === 'plank') {
            // The boards are let out 2 px each side so "Legacy Monolith" clears the trim.
            const [monolith, debt] = STAGE.plank.nameBoards;
            for (const [board, text, trim] of [[monolith, 'Legacy Monolith', PAL.gold], [debt, 'Tech Debt', PAL.red]]) {
                box(sx, PAL.wood0, board.x - 2, board.y, board.w + 4, board.h);
                frameRect(sx, trim, board.x - 2, board.y, board.w + 4, board.h);
                blitText(label(text, PAL.parchment, false), (board.x + board.w / 2) * 2 - Math.round(textWidth(text) / 2), board.y * 2 + 7);
            }
        }
    }

    function drawMenu(d, u, kind) {
        const m = d.m, menu = d.menu, step = d.hoverStep, { slide } = TIMING.menu;
        const k = menuOpen(u, kind);
        if (k <= 0) return;
        const top = Math.round(TEXT_H - menu.height * k);
        tx.fillStyle = PAL.night0;
        tx.fillRect(0, top, TEXT_W, TEXT_H - top);
        tx.fillStyle = PAL.navy;
        tx.fillRect(0, top, TEXT_W, 2);
        tx.fillStyle = PAL.night2;
        tx.fillRect(0, top + 2, TEXT_W, 1);
        const pickAt = slide + m.hovers.length * step;
        const picked = kind !== 'menu' || u >= pickAt;
        const hover = kind !== 'menu' ? m.chosenSlot : u < slide ? -1 : picked ? m.chosenSlot : m.hovers[Math.floor((u - slide) / step)];
        menu.rows.forEach((row, i) => {
            let colour = 'normal';
            if (i === hover) colour = 'hover';
            if (picked && i === m.chosenSlot) colour = reducedMotion() || Math.floor((u - pickAt) / 0.08) % 2 === 0 || kind !== 'menu' ? 'pick' : 'hover';
            blitText(row.num[colour], MENU.numX, top + row.y, { scale: MENU.scale });
            for (const line of row.lines) blitText(line[colour], MENU.textX, top + row.y + line.dy, { scale: MENU.scale });
        });
        if (hover < 0) return;
        // The hand glides from the previous hover to this one, then pokes at it.
        let y = menu.rows[hover].y;
        if (kind === 'menu' && !picked) {
            const n = Math.floor((u - slide) / step);
            if (n > 0) y = lerp(menu.rows[m.hovers[n - 1]].y, y, easeOut(span(u - slide - n * step, 0, 0.12)));
        }
        const poke = kind === 'menu' && !reducedMotion() ? Math.round(Math.sin(u * 14)) : 0;
        // Centred on the option's first row (glyphs are the top 7 of its 9 rows).
        const handY = Math.round(top + y + 3.5 * MENU.scale - HAND.height);
        tx.drawImage(HAND, 0, 0, HAND.width, HAND.height, MENU.handX + poke * 2, handY, HAND.width * 2, HAND.height * 2);
    }

    // Names over heads at dialogue size. They extend outward so two names can never collide: the left-hand
    // pirate's name ends just right of their centre (running towards the left edge), the right-hand pirate's
    // starts just left of theirs (running towards the right edge). Each is clamped on-screen.
    const NAME_TUCK = 6, NAME_MARGIN = 6;
    function drawNames(poses) {
        const tags = poses.filter(p => !p.hidden && !p.hideName && p.x > -20 && p.x < SCENE_W + 20)
            .map(p => {
                const w = p.p.label.width * NAME_SCALE, centre = Math.round(p.x * 2), isLeft = p.p.dir > 0;
                return { label: p.p.label, w, isLeft, x: isLeft ? centre + NAME_TUCK - w : centre - NAME_TUCK, y: nameYAt(p.y, p.top) };
            })
            .sort((a, b) => a.x - b.x);
        // Only if the pirates stand almost on top of each other do the inner ends need nudging apart.
        if (tags.length === 2 && tags[0].isLeft !== tags[1].isLeft && Math.abs(tags[0].y - tags[1].y) < LINE_H * NAME_SCALE + 2) {
            const overlap = tags[0].x + tags[0].w + 8 - tags[1].x;
            if (overlap > 0) {
                tags[0].x -= Math.ceil(overlap / 2);
                tags[1].x += Math.ceil(overlap / 2);
            }
        }
        for (const tag of tags) blitText(tag.label.canvas, clamp(tag.x, NAME_MARGIN, TEXT_W - NAME_MARGIN - tag.w), tag.y, { scale: NAME_SCALE });
    }

    function drawDuel(beat, u) {
        const d = beat.data, kind = beat.kind;
        const { poses, fx } = duelPoses(beat, u);
        const T = u / beat.dur;
        const shake = kind === 'clash' && !reducedMotion() && T >= CLASH.shake[0] && T < CLASH.shake[1];
        const pan = Math.round(d.menuPan * menuOpen(u, kind));
        if (shake || pan) {
            sx.fillStyle = PAL.black;
            sx.fillRect(0, 0, SCENE_W, SCENE_H);
            const [dx, dy] = shake ? [Math.floor(u / 0.04) % 2 ? 2 : -2, Math.floor(u / 0.06) % 2 ? 1 : -1] : [0, 0];
            sx.setTransform(1, 0, 0, 1, dx, dy - pan);
            tx.setTransform(1, 0, 0, 1, 0, -2 * pan);
        }
        sx.drawImage(backdrop(d.loc), 0, 0);
        drawWater(d.loc, run.t);
        // On the gangplank the plank, and everyone standing on it, wobbles.
        const wob = d.loc === 'plank' ? plankWobble() : 0;
        if (d.loc === 'plank') sx.drawImage(sceneOf('plank').plank, 0, wob);
        const shown = wob ? poses.map(p => (p.clipY === undefined ? { ...p, y: p.y + wob } : p)) : poses;
        const flapWindow = kind === 'gag' && GAG_SCRIPTS[d.m.gag].flap;
        drawDressing(d.loc, Boolean(flapWindow && u >= flapWindow[0] && u < flapWindow[1]));
        shown.forEach(drawPirate);
        for (const e of fx) {
            if (e.kind === 'splash') drawSplash(e);
            else if (e.kind === 'spark') drawSpark(e.x, e.y + wob);
            else if (e.kind === 'sword') sx.drawImage(SWORD_FRAMES[e.frame], Math.round(e.x) - SWORD_C, Math.round(e.y) - SWORD_C);
            else if (e.kind === 'hat') {
                const hat = hats[e.idx];
                sx.drawImage(e.faceLeft ? hat.left : hat.right, Math.round(e.x), Math.round(e.y));
            }
        }
        sx.setTransform(1, 0, 0, 1, 0, 0);

        drawNames(shown);
        for (const e of fx) {
            if (e.kind === 'shout') drawSpeech(d.shout, Infinity, e.dy);
            else if (e.kind === 'zzz' && e.age >= 0) {
                for (let n = 0; n < 3; n++) {
                    const a = (e.age + n * 0.25) % 0.75;
                    blitText(label('z', e.colour), e.x * 2 + Math.round(a * 10), e.y * 2 - Math.round(a * 24));
                }
            }
        }
        if (kind === 'insult') drawSpeech(d.insult, u < d.insultDur ? Math.floor(u / d.insultStep) + 1 : Infinity);
        else if (kind === 'menu') drawSpeech(d.insult);
        else if (kind === 'comeback') drawSpeech(d.comeback, u < d.comebackDur ? Math.floor(u / d.comebackStep) + 1 : Infinity);
        else if (kind === 'clash' && T < CLASH.hits[1]) drawSpeech(d.comeback);
        tx.setTransform(1, 0, 0, 1, 0, 0);
        if (kind === 'menu' || kind === 'comeback') drawMenu(d, u, kind);
    }

    // --- Story: the intro and the winner's scene ---
    // The intro plays on the first Start after the page loads; Play again (and any later Start) skips it.
    let introSeen = false;
    const DUTY_LINE = "…and runs today's standup.";
    const INTRO_SEA = 'The Sea of Legacy Code. 9:58 am.';
    const INTRO_NOTE = 'Gone on annual leave. Out of office. Back in 2 weeks. The Admiral.';
    const INTRO_PARROT = 'WHO RUNS STANDUP? SQUAWK! WHO RUNS STANDUP?';
    const INTRO_LAW = "By ancient pirate law, there's only one way to settle it… not with swords alone… but with WORDS.";
    const PARROT_COLOUR = PARROT_LEGEND.R;
    const NOTE_INK = '#3a2410';

    // A caption: rows of coloured segments at dialogue size, centred in a dark band along the bottom.
    const CAPTION = { scale: 2, chars: 53, pad: 7, line: LINE_H * 2 + 2 };

    // lines: [[{ text, colour, name? }]]; a `name` segment is a pirate's name (accents stripped, fallbacks drawn).
    function captionLayout(lines) {
        const { scale, pad, line } = CAPTION;
        const height = lines.length * line - 2 + 2 * pad;
        const top = TEXT_H - height;
        let chars = 0;
        const rows = lines.map((segs, n) => {
            const parts = segs.map((seg) => {
                const named = seg.name ? nameSprite(seg.text, seg.colour) : null;
                const text = named ? fold(DuelCore.displayName(seg.text)) : fold(seg.text);
                const sprite = named ? named.canvas : textSprite(text, seg.colour);
                const part = { sprite, w: (named ? named.width : textWidth(text)) * scale, len: [...text].length, from: chars, text };
                chars += part.len;
                return part;
            });
            let x = Math.round((TEXT_W - parts.reduce((sum, part) => sum + part.w, 0)) / 2);
            for (const part of parts) {
                part.x = x;
                x += part.w;
            }
            return { parts, y: top + pad + n * line };
        });
        return { rows, chars, top, height };
    }

    const captionText = (str, colour) => captionLayout(wrapText(fold(str), CAPTION.chars * ADVANCE - 1).map(text => [{ text, colour }]));

    function drawCaption(cap, shown = Infinity) {
        tx.globalAlpha = 0.84;
        tx.fillStyle = PAL.night0;
        tx.fillRect(0, cap.top, TEXT_W, cap.height);
        tx.globalAlpha = 1;
        tx.fillStyle = PAL.navy;
        tx.fillRect(0, cap.top, TEXT_W, 2);
        for (const row of cap.rows) {
            for (const part of row.parts) {
                const n = clamp(shown - part.from, 0, part.len);
                if (n > 0) blitText(part.sprite, part.x, row.y, { scale: CAPTION.scale, reveal: n === part.len ? 1 : (n * ADVANCE + 1) / part.sprite.width });
            }
        }
    }

    // How many characters are showing at u when typing starts at `from` and takes `step` each.
    const typedAt = (u, from, step) => (u < from ? 0 : Math.floor((u - from) / step) + 1);

    function captionBlips(cap, from, step) {
        const events = [];
        for (const row of cap.rows) {
            for (const part of row.parts) {
                [...part.text].forEach((ch, i) => {
                    if (ch !== ' ') events.push({ at: from + (part.from + i) * step, kind: 'sfx', name: 'blip' });
                });
            }
        }
        return events;
    }

    // The note, close up: four lines of the Admiral's hand on a big parchment pinned by a dagger.
    const NOTE_CLOSE = { x: 64, y: 30, w: 192, h: 116, textX: 152, textY: 104, lineGap: 26, signX: 482 };
    let noteCanvas = null;

    function noteCloseUp() {
        if (noteCanvas) return noteCanvas;
        const [canvas, c] = makeLayer(SCENE_W, SCENE_H);
        const rand = seeded(83);
        // The door, magnified: broad planks, dark seams and an iron band with rivets.
        for (let x = 0; x < SCENE_W; x += 24) {
            box(c, (x / 24) % 2 ? PAL.wood1 : PAL.wood2, x, 0, 24, SCENE_H);
            box(c, PAL.wood0, x, 0, 2, SCENE_H);
            for (let k = 0; k < 6; k++) box(c, PAL.wood0, x + 4 + Math.floor(rand() * 16), Math.floor(rand() * SCENE_H), 6 + Math.floor(rand() * 8), 1);
        }
        box(c, PAL.greyDark, 0, 156, SCENE_W, 9);
        box(c, PAL.grey, 0, 156, SCENE_W, 1);
        for (let x = 10; x < SCENE_W; x += 24) {
            box(c, PAL.grey, x, 159, 3, 3);
            box(c, PAL.white, x, 159, 1, 1);
        }
        // Candlelight falling off towards the corners.
        for (let y = 0; y < SCENE_H; y++) {
            for (let x = 0; x < SCENE_W; x++) {
                const d = Math.hypot((x - 160) / 1.6, y - 90);
                if (d > 70 && bayer(x, y) < Math.min(15, (d - 70) / 4)) box(c, PAL.wood0, x, y);
            }
        }
        const { x, y, w, h } = NOTE_CLOSE;
        box(c, PAL.ink, x + 4, y + 4, w, h);
        box(c, PAL.parchment, x, y, w, h);
        frameRect(c, PAL.parchmentDark, x, y, w, h, 2);
        for (let k = 0; k < w; k += 1 + Math.floor(rand() * 3)) {
            if (rand() < 0.5) box(c, PAL.wood1, x + k, y + h - 1, 1 + Math.floor(rand() * 2), 1);
        }
        // A folded-over corner and a few stains.
        for (let k = 0; k < 14; k++) {
            box(c, PAL.wood0, x + w - 14 + k, y + h - 14 + (13 - k), 14 - k, 1);
            box(c, PAL.parchmentDark, x + w - 14, y + h - 14 + k, k + 1, 1);
        }
        for (const [cx, cy, r] of [[x + 26, y + h - 22, 9], [x + w - 34, y + 20, 7]]) {
            for (let yy = cy - r; yy <= cy + r; yy++) {
                for (let xx = cx - r; xx <= cx + r; xx++) {
                    if (Math.hypot(xx - cx, yy - cy) < r && bayer(xx, yy) < 3) box(c, PAL.parchmentDark, xx, yy);
                }
            }
        }
        // The dagger: pommel, grip, guard, and the blade driven through the parchment into the door.
        const dx = 160;
        box(c, PAL.ink, dx - 4, 2, 9, 6);
        box(c, PAL.gold, dx - 3, 3, 7, 4);
        box(c, PAL.goldDark, dx - 3, 6, 7, 1);
        box(c, PAL.ink, dx - 3, 8, 7, 14);
        box(c, PAL.wood2, dx - 2, 8, 5, 14);
        for (let yy = 10; yy < 22; yy += 3) box(c, PAL.wood0, dx - 2, yy, 5, 1);
        box(c, PAL.ink, dx - 12, 22, 25, 5);
        box(c, PAL.gold, dx - 11, 23, 23, 3);
        box(c, PAL.goldDark, dx - 11, 25, 23, 1);
        box(c, PAL.ink, dx - 4, 27, 9, 12);
        box(c, PAL.grey, dx - 3, 27, 7, 11);
        box(c, PAL.white, dx - 1, 27, 2, 11);
        box(c, PAL.greyDark, dx - 3, 37, 7, 1);
        box(c, PAL.parchmentDark, dx - 6, 38, 13, 2);
        box(c, PAL.wood1, dx - 2, 38, 5, 1);
        return noteCanvas = canvas;
    }

    // The cabin now, optionally zoomed in towards (cx, cy) by `zoom` (nearest-neighbour, so it stays pixelated).
    const [zoomBuf, zx] = makeLayer(SCENE_W, SCENE_H);
    function drawCabin(zoom = 1, cx = SCENE_W / 2, cy = SCENE_H / 2) {
        const s = sceneOf('cabin');
        if (zoom === 1) {
            sx.drawImage(s.back, 0, 0);
            paintScene(sx, s, run.t);
            return;
        }
        zx.drawImage(s.back, 0, 0);
        paintScene(zx, s, run.t);
        const w = SCENE_W / zoom, h = SCENE_H / zoom;
        sx.drawImage(zoomBuf, clamp(cx - w / 2, 0, SCENE_W - w), clamp(cy - h / 2, 0, SCENE_H - h), w, h, 0, 0, SCENE_W, SCENE_H);
    }

    // A crowd in one or two rows. The back row's names sit above their heads and the front (or only) row's
    // under their feet, so every name is next to its owner. Names alternate between up to three lines when
    // neighbours would touch, and are drawn at dialogue size when they fit on one line.
    // people: [{ idx, x, floorY, row (0 back, 1 front), below }]; lift = how far they hop.
    function withLabels(people, plan, lift = 0) {
        for (const r of new Set(people.map(p => p.row))) {
            const row = people.filter(p => p.row === r).sort((a, b) => a.x - b.x);
            const gap = row.length > 1 ? Math.min(...row.slice(1).map((p, i) => p.x - row[i].x)) * 2 : TEXT_W;
            const widest = Math.max(...row.map(p => nameSprite(game.names[p.idx], plan.textColour[p.idx]).width));
            const scale = widest * 2 + 8 <= gap ? 2 : 1;
            const tiers = clamp(Math.ceil((widest * scale + 8) / gap), 1, 3);
            const lineH = LINE_H * scale + 1;
            row.forEach((p, i) => {
                const tier = i % tiers;
                p.label = nameSprite(game.names[p.idx], plan.textColour[p.idx]);
                p.labelScale = scale;
                p.labelY = p.below ? p.floorY * 2 + 2 + tier * lineH : (p.floorY - PIRATE_TOP - lift) * 2 - 2 - lineH * (tier + 1);
            });
        }
        return people;
    }

    function drawLabels(people, xOf, dy = 0) {
        for (const p of people) {
            const x = xOf(p);
            if (x < -10 || x > SCENE_W + 10) continue;
            const w = p.label.width * p.labelScale;
            blitText(p.label.canvas, clamp(Math.round(x * 2 - w / 2), NAME_MARGIN, TEXT_W - NAME_MARGIN - w), p.labelY + dy * 2, { scale: p.labelScale });
        }
    }

    // Spreads a list evenly across [x0, x1] at one floor height.
    function spreadRow(people, list, x0, x1, floorY, row, below) {
        const gap = (x1 - x0) / list.length;
        list.forEach((idx, i) => people.push({ idx, x: Math.round(x0 + (i + 0.5) * gap), floorY, row, below }));
    }

    // The tavern crowd: everyone in this game, placed in plan.introOrder (a fair shuffle). They stride in
    // from the nearer side and glare across at the other half.
    const CROWD = { x0: 24, x1: 296, single: 140, back: 122, front: 142 };
    function crowdLayout(plan) {
        const order = plan.introOrder, n = order.length, people = [];
        if (n <= 6) {
            const gap = Math.min(54, (CROWD.x1 - CROWD.x0) / n);
            spreadRow(people, order, 160 - gap * n / 2, 160 + gap * n / 2, CROWD.single, 1, true);
        } else {
            const back = Math.ceil(n / 2);
            spreadRow(people, order.slice(0, back), CROWD.x0, CROWD.x1, CROWD.back, 0, false);
            spreadRow(people, order.slice(back), CROWD.x0 + 8, CROWD.x1 + 8, CROWD.front, 1, true);
        }
        people.forEach((p, k) => Object.assign(p, { faceLeft: p.x > 160, delay: k * 0.05, phase: (k * 0.29) % 0.8 }));
        return withLabels(people, plan);
    }

    function introBeats(plan) {
        const T = TIMING.intro;
        const sea = captionText(INTRO_SEA, PAL.parchment);
        const squawk = captionText(INTRO_PARROT, PARROT_COLOUR);
        const law = captionText(INTRO_LAW, PAL.parchment);
        const note = INTRO_NOTE.match(/[^.]+\./g).map(line => line.trim());
        let from = 0;
        const noteRows = note.map((text, n) => {
            const row = { text, sprite: textSprite(text, NOTE_INK, false), from, signature: n === note.length - 1 };
            from += text.length;
            return row;
        });
        const typed = { sea: [0.3, 0.035], note: [1.35, 0.022], squawk: [0.05, 0.02], law: [0.25, 0.024] };
        const noteBlips = [];
        noteRows.forEach(row => [...row.text].forEach((ch, i) => {
            if (ch !== ' ') noteBlips.push({ at: typed.note[0] + (row.from + i) * typed.note[1], kind: 'sfx', name: 'blip' });
        }));
        return [
            {
                kind: 'intro', dur: T.sea, data: { scene: 'sea', cap: sea, typed: typed.sea },
                events: [{ at: 0, kind: 'theme', name: 'playIntro' }, ...captionBlips(sea, ...typed.sea)],
            },
            { kind: 'intro', dur: T.cabin, data: { scene: 'cabin', noteRows, typed: typed.note }, events: noteBlips },
            {
                kind: 'intro', dur: T.parrot, data: { scene: 'parrot', cap: squawk, typed: typed.squawk },
                events: [...[0.05, 0.6, 1.15].map(at => ({ at, kind: 'sfx', name: 'squawk' })), ...captionBlips(squawk, ...typed.squawk)],
            },
            { kind: 'intro', dur: T.tavern, data: { scene: 'tavern', cap: law, typed: typed.law, crowd: crowdLayout(plan) }, events: captionBlips(law, ...typed.law) },
            { kind: 'intro', dur: T.title, data: { scene: 'title' }, events: [{ at: T.title, kind: 'introSeen' }] },
        ];
    }

    // Where the Admiral's parrot is as it flaps round the cabin in a panic (it starts on its perch).
    function panicFlight(u) {
        const { perch } = STAGE.cabin;
        const fly = { x: 160 + 118 * Math.sin(1.9 * u - 1.2), y: 64 + 24 * Math.sin(3.3 * u + 0.4) };
        const k = easeOut(span(u, 0, 0.35));
        return { x: lerp(perch.x, fly.x, k), y: lerp(perch.y, fly.y, k), faceLeft: Math.cos(1.9 * u - 1.2) < 0 };
    }
    // Feathers shed as it panics: [when, colour]. They drift down and settle on the floor.
    const FEATHERS = [[0.3, PARROT_LEGEND.Y], [0.55, PARROT_LEGEND.R], [0.8, PARROT_LEGEND.U], [1.05, PARROT_LEGEND.R], [1.3, PARROT_LEGEND.Y], [1.55, PARROT_LEGEND.U]];

    function drawIntro(beat, u) {
        const d = beat.data;
        u = Math.max(0, u);
        if (d.scene === 'sea') {
            sx.drawImage(introBackdrop('sea'), 0, 0);
            drawWater('sea', run.t);
            const x = Math.round(lerp(128, 192, u / beat.dur));
            const y = 146 + Math.round(Math.sin(run.t * 2.2));
            sx.drawImage(shipSprite(), x - SHIP_ANCHOR.x, y - SHIP_ANCHOR.y);
            // A wake trailing off the stern.
            for (let k = 0; k < 6; k++) box(sx, k % 2 ? PAL.ice : PAL.white, x - 44 - k * 7 - (Math.floor(run.t * 6) + k) % 3, 146 + (k % 2), 4 - (k >> 1), 1);
            drawCaption(d.cap, typedAt(u, ...d.typed));
        } else if (d.scene === 'cabin') {
            // The cabin, a push in on the door, then the note close up as the Admiral's words write out.
            const { note } = STAGE.cabin;
            if (u < 1.3) {
                const k = span(u, 0.8, 1.3) ** 2;
                drawCabin(1 + 4 * k, lerp(160, note.x + note.w / 2, k), lerp(90, note.y + note.h / 2, k));
            } else {
                sx.drawImage(noteCloseUp(), 0, 0);
                const shown = typedAt(u, ...d.typed);
                const { textX, textY, lineGap, signX } = NOTE_CLOSE;
                d.noteRows.forEach((row, n) => {
                    const left = row.signature ? signX - textWidth(row.text) * 2 : textX;
                    const c = clamp(shown - row.from, 0, row.text.length);
                    if (c > 0) blitText(row.sprite, left, textY + n * lineGap + (row.signature ? 12 : 0), { scale: 2, reveal: c === row.text.length ? 1 : (c * ADVANCE + 1) / row.sprite.width });
                });
                // Signed with a flourish.
                const last = d.noteRows[d.noteRows.length - 1];
                if (shown >= last.from + last.text.length) {
                    rope(sx, NOTE_INK, 166, 113, 226, 111, 3);
                    rope(sx, NOTE_INK, 226, 111, 232, 106);
                }
            }
        } else if (d.scene === 'parrot') {
            drawCabin();
            const { floorY } = STAGE.cabin;
            for (const [at, colour] of FEATHERS) {
                if (u < at) continue;
                const from = panicFlight(at), t = u - at;
                const fy = Math.min(floorY - 4, from.y - 6 + 18 * t);
                box(sx, colour, Math.round(from.x + 3 * Math.sin(t * 7)), Math.round(fy), 2, 1);
            }
            // Drawn at twice size: this is the parrot's big moment.
            const p = panicFlight(u);
            const frame = u < 0.12 ? 'perch' : Math.floor(u / 0.06) % 2 ? 'flap0' : 'flap1';
            sx.drawImage(parrotFrame(frame, p.faceLeft), Math.round(p.x) - PARROT_ANCHOR.x * 2, Math.round(p.y) - PARROT_ANCHOR.y * 2, PARROT_W * 2, PARROT_H * 2);
            drawCaption(d.cap, typedAt(u, ...d.typed));
        } else if (d.scene === 'tavern') {
            sx.drawImage(backdrop('tavern'), 0, 0);
            drawWater('tavern', run.t);
            drawDressing('tavern', false);
            const at = (p) => {
                const k = easeOut(span(u, p.delay, p.delay + 1.0));
                return Math.round(lerp(p.faceLeft ? SCENE_W + 26 : -26, p.x, k));
            };
            for (const p of beat.data.crowd) {
                const arrived = u >= p.delay + 1.0;
                // Once they are in, a ripple of raised cutlasses runs through the crowd.
                const menace = arrived && u >= 1.9 + p.phase && u < 2.5 + p.phase;
                const frame = !arrived ? (Math.floor(u / 0.12) % 2 ? 'idle1' : 'idle0') : menace ? 'parry' : (Math.floor((run.t + p.phase) / 0.4) % 2 ? 'idle1' : 'idle0');
                sx.drawImage(pirateFrame(p.idx, frame, p.faceLeft), at(p) - PIRATE_ANCHOR.x, p.floorY - PIRATE_ANCHOR.y);
            }
            drawLabels(beat.data.crowd, at);
            drawCaption(d.cap, typedAt(u, ...d.typed));
        } else {
            drawTitleSmash(beat, u);
        }
    }

    // The title smash. A sword-flash wipe slashes the title in from black and a wipe takes it out to the
    // notice; with prefers-reduced-motion both are plain cuts and the title doesn't jolt.
    const SLASH = { in: [0, 0.3], out: [2.2, 2.5], slope: 0.5 };
    function slashEdge(k) {
        return lerp(-TEXT_H * SLASH.slope - 30, TEXT_W + 30, k);
    }
    function fillBeyond(edge, left) {
        // Everything left (or right) of a line leaning at SLASH.slope through (edge, 0)..(edge - slope*H, H).
        const lean = TEXT_H * SLASH.slope;
        tx.beginPath();
        if (left) {
            tx.moveTo(-1, 0); tx.lineTo(edge, 0); tx.lineTo(edge - lean, TEXT_H); tx.lineTo(-1, TEXT_H);
        } else {
            tx.moveTo(edge, 0); tx.lineTo(TEXT_W + 1, 0); tx.lineTo(TEXT_W + 1, TEXT_H); tx.lineTo(edge - lean, TEXT_H);
        }
        tx.closePath();
        tx.fill();
    }
    function drawTitleSmash(beat, u) {
        const calm = reducedMotion();
        drawHarbour(run.t);
        const cx = TEXT_W / 2;
        const landed = calm || u >= 0.3;
        const jolt = !calm && u >= 0.3 && u < 0.4 ? (Math.floor(u / 0.03) % 2 ? 2 : -2) : 0;
        if (u >= 0.12 || calm) drawTitleWord(cx + jolt, landed ? 70 : 62, landed ? 4 : 5);
        if (u >= 0.7 || calm) {
            const sub = textSprite('The Tournament of Insults', PAL.parchment);
            blitText(sub, cx - textWidth('The Tournament of Insults'), 140, { scale: 2, reveal: calm ? 1 : span(u, 0.7, 1.2) });
        }
        if (calm) return;
        tx.fillStyle = PAL.black;
        if (u < SLASH.in[1]) {
            // Black still ahead of the blade; a white-hot streak along its edge.
            const edge = slashEdge(span(u, ...SLASH.in));
            fillBeyond(edge, false);
            tx.fillStyle = PAL.white;
            fillBand(edge, 6);
            tx.fillStyle = PAL.ice;
            fillBand(edge - 8, 3);
        } else if (u < 0.45) {
            // The streak fades where the blade passed.
            tx.globalAlpha = 1 - span(u, 0.3, 0.45);
            tx.fillStyle = PAL.white;
            fillBand(TEXT_W / 2 + TEXT_H * SLASH.slope / 2, 4);
            tx.globalAlpha = 1;
        }
        if (u >= SLASH.out[0]) fillBeyond(slashEdge(span(u, ...SLASH.out)), true);
    }
    function fillBand(edge, w) {
        const lean = TEXT_H * SLASH.slope;
        tx.beginPath();
        tx.moveTo(edge - w, 0); tx.lineTo(edge, 0); tx.lineTo(edge - lean, TEXT_H); tx.lineTo(edge - lean - w, TEXT_H);
        tx.closePath();
        tx.fill();
    }

    // --- The winner's scene ---
    // Fireworks over the masts: a fixed show (scenery, not the draw), then one every LOOP_EVERY seconds while it holds.
    const FIREWORK_COLOURS = [
        [PAL.flame, PAL.gold, PAL.ember], ['#ff6a78', PAL.red, '#5e0f1e'], [PAL.ice, PAL.sky, PAL.blue],
        ['#8ee08e', PAL.leaf, PAL.green], ['#d8a8f8', '#9a68c0', PAL.purple],
    ];
    const FIREWORKS = [
        [0.9, 160, 22], [1.5, 84, 34], [2.1, 236, 26], [2.9, 120, 14], [3.7, 206, 44],
        [4.4, 66, 22], [5.1, 258, 16], [5.9, 146, 36], [6.7, 96, 52], [7.4, 222, 22],
    ].map(([at, x, y], n) => ({ at, x, y, colours: FIREWORK_COLOURS[n % FIREWORK_COLOURS.length] }));
    const FIREWORK = { rise: 0.55, life: 1.5, sparks: 24, speed: 42, loopEvery: 2.3 };
    const PARROT_FLIGHT = Object.freeze({ from: 1.6, land: 3.4, sayFor: 3.2 });
    const CREW_HOP = 5;
    // The new Admiral's name, big, across the top of the sky like a banner.
    const WINNER_NAME_Y = 22;

    function fireworksAt(u) {
        const shows = FIREWORKS.filter(fw => u >= fw.at - FIREWORK.rise && u < fw.at + FIREWORK.life);
        if (u >= TIMING.winner - FIREWORK.life) {
            const n = Math.floor((u - TIMING.winner) / FIREWORK.loopEvery);
            for (const k of [n - 1, n]) {
                if (k < 0) continue;
                const fw = FIREWORKS[(k * 3) % FIREWORKS.length];
                const at = TIMING.winner + k * FIREWORK.loopEvery + FIREWORK.rise;
                if (u >= at - FIREWORK.rise && u < at + FIREWORK.life) shows.push({ ...fw, at });
            }
        }
        return shows;
    }

    function drawFirework(fw, u) {
        const age = u - fw.at;
        if (age < 0) {
            // The rocket climbing from behind the rail, with a short spark trail.
            const k = 1 + age / FIREWORK.rise;
            const x = Math.round(lerp(fw.x + 8, fw.x, k)), y = Math.round(lerp(100, fw.y, easeOut(k)));
            box(sx, PAL.white, x, y, 1, 1);
            box(sx, PAL.flame, x, y + 1, 1, 2);
            box(sx, PAL.ember, x + (k > 0.5 ? 0 : 1), y + 3, 1, 2);
            return;
        }
        const [hot, mid, dim] = fw.colours;
        if (age < 0.08) {
            sx.fillStyle = PAL.white;
            disc(sx, fw.x, fw.y, 2);
        }
        // An outer ring of sparks and a slower inner ring, slowing as they spread and drooping as they fall.
        for (let n = 0; n < FIREWORK.sparks * 1.5; n++) {
            const inner = n >= FIREWORK.sparks;
            const a = (inner ? (n - FIREWORK.sparks + 0.5) * 2 : n) / FIREWORK.sparks * Math.PI * 2 + fw.at;
            const v = FIREWORK.speed * (inner ? 0.5 : [1, 0.86, 1.1][n % 3]);
            const spread = (t) => v * t * (1 - 0.3 * t);
            const at = (t) => [Math.round(fw.x + Math.cos(a) * spread(t)), Math.round(fw.y + Math.sin(a) * spread(t) + 10 * t * t)];
            const [x, y] = at(age);
            if (age > 1.05 && (n + Math.floor(age * 20)) % 3) continue;
            const [x1, y1] = at(Math.max(0, age - 0.05)), [x2, y2] = at(Math.max(0, age - 0.1));
            box(sx, dim, x2, y2, 1, 1);
            box(sx, mid, x1, y1, 1, 1);
            box(sx, age < 0.15 ? PAL.white : age < 0.75 ? hot : mid, x, y, age < 0.5 && !inner ? 2 : 1, 1);
        }
    }

    // The crew: everyone else in this game, in plan.introOrder, on the main deck: one row, or a back row of
    // up to six split either side of the helm (so nobody hides the winner) behind a front row.
    function crewLayout(plan) {
        const st = STAGE.deck, rows = st.rows;
        const crew = plan.introOrder.filter(i => i !== plan.winnerIndex), n = crew.length, people = [];
        if (n <= 6) {
            const gap = Math.min(52, (st.crewR - st.crewL) / n);
            spreadRow(people, crew, 160 - gap * n / 2, 160 + gap * n / 2, rows.single, 1, true);
        } else {
            const back = crew.slice(0, Math.min(6, Math.floor(n / 2))), half = Math.ceil(back.length / 2);
            spreadRow(people, back.slice(0, half), st.crewL, st.gapL, rows.back, 0, false);
            spreadRow(people, back.slice(half), st.gapR, st.crewR, rows.back, 0, false);
            spreadRow(people, crew.slice(back.length), st.crewL, st.crewR, rows.front, 1, true);
        }
        people.forEach((p, k) => Object.assign(p, { faceLeft: p.x > st.helmX + 10, phase: (k * 0.37) % 1, period: 0.62 + (k % 3) * 0.09 }));
        return withLabels(people, plan, CREW_HOP);
    }

    function winnerBeat(plan) {
        const w = plan.winnerIndex, name = game.names[w], colour = plan.textColour[w];
        const cap = captionLayout([
            [{ text: name, colour, name: true }, { text: ' is Grand Admiral of Standup!', colour: PAL.gold }],
            [{ text: DUTY_LINE, colour: PAL.parchment }],
        ]);
        const { land } = PARROT_FLIGHT;
        return {
            kind: 'winner', dur: TIMING.winner, hold: true,
            data: { w, banner: bannerSprite(name, colour), cap, crew: crewLayout(plan), say: textSprite('ADMIRAL! ADMIRAL!', PARROT_COLOUR) },
            events: [
                { at: 0, kind: 'finish' },
                { at: 0.25, kind: 'theme', name: 'playWinner' },
                ...FIREWORKS.map(fw => ({ at: fw.at, kind: 'sfx', name: 'boom' })),
                { at: land, kind: 'sfx', name: 'squawk' },
                { at: land + 0.55, kind: 'sfx', name: 'squawk' },
                { at: TIMING.winnerStatus, kind: 'status', text: `${name} is Grand Admiral of Standup! ${DUTY_LINE}` },
            ],
        };
    }

    // The quadratic path the parrot swoops along from the top right to the winner's shoulder.
    function parrotSwoop(k, shoulder) {
        const p0 = { x: SCENE_W + 16, y: 8 }, p1 = { x: 236, y: 112 };
        const a = (1 - k) ** 2, b = 2 * k * (1 - k), c = k * k;
        return { x: a * p0.x + b * p1.x + c * shoulder.x, y: a * p0.y + b * p1.y + c * shoulder.y };
    }

    function drawWinner(beat, u) {
        const d = beat.data, st = STAGE.deck, s = sceneOf('deck');
        const holding = u >= TIMING.winner;
        // The ship rocks as one; the sky and the sea beyond the rail stay put.
        const rock = Math.round(Math.sin(run.t * 1.7));
        sx.drawImage(s.back, 0, 0);
        paintBack(sx, s, run.t);
        for (const fw of fireworksAt(u)) drawFirework(fw, u);
        paintFront(sx, s, run.t, rock);

        // The wheel sways to and fro under the winner's hands.
        const turn = 0.65 * Math.sin(u * 0.85);
        const frames = wheelFrames();
        const f = ((Math.round(turn / (Math.PI / 4) * WHEEL_STEPS) % WHEEL_STEPS) + WHEEL_STEPS) % WHEEL_STEPS;
        sx.drawImage(frames[f], st.wheel.x - WHEEL_C, st.wheel.y + rock - WHEEL_C);
        const floor = st.floorY + rock;
        sx.drawImage(pirateFrame(d.w, 'helm', false), st.helmX - PIRATE_ANCHOR.x, floor - PIRATE_ANCHOR.y);

        // The Admiral's parrot swoops in and settles on the new Admiral's shoulder.
        const { from, land, sayFor } = PARROT_FLIGHT;
        const shoulder = { x: st.helmX - 10, y: floor - 19 };
        if (u >= from) {
            const k = span(u, from, land);
            const flapping = k < 1 || u < land + 0.3 || (u >= land + 0.55 && u < land + 0.75) || (holding && u % 4.5 < 0.3);
            const p = k < 1 ? parrotSwoop(easeOut(k), shoulder) : shoulder;
            const frame = flapping ? (Math.floor(u / 0.07) % 2 ? 'flap0' : 'flap1') : 'perch';
            sx.drawImage(parrotFrame(frame, true), Math.round(p.x) - PARROT_ANCHOR.x, Math.round(p.y) - PARROT_ANCHOR.y);
        }

        // The crew cheer on the deck below, each hopping on their own beat.
        const amp = holding ? 3 : CREW_HOP;
        const hop = (p) => {
            const start = 0.35 + p.phase * 0.5;
            if (u < start) return 0;
            const v = Math.sin(2 * Math.PI * ((u - start) / p.period));
            return v > 0 ? -Math.round(amp * v) : 0;
        };
        for (const p of d.crew) {
            const dy = hop(p);
            sx.drawImage(pirateFrame(p.idx, dy < 0 ? 'cheer' : 'idle0', p.faceLeft), p.x - PIRATE_ANCHOR.x, p.floorY + rock + dy - PIRATE_ANCHOR.y);
        }

        // The first big burst lights up the whole sky for a moment (not with prefers-reduced-motion).
        if (!reducedMotion() && u >= FIREWORKS[0].at && u < FIREWORKS[0].at + 0.08) {
            sx.globalAlpha = 0.16;
            box(sx, PAL.ice, 0, 0, SCENE_W, SCENE_H);
            sx.globalAlpha = 1;
        }

        // Lettering: the crew's names, the new Admiral's name big, and the squawk.
        drawLabels(d.crew, p => p.x, rock);
        tx.drawImage(d.banner.canvas, Math.max(NAME_MARGIN, Math.round(TEXT_W / 2 - d.banner.width / 2)) - BANNER_SCALE, WINNER_NAME_Y - BANNER_SCALE);
        // The squawk, just above the parrot's head.
        if (u >= land && u < land + sayFor) {
            const sw = textWidth('ADMIRAL! ADMIRAL!') * 2;
            blitText(d.say, clamp(shoulder.x * 2 - sw / 2, NAME_MARGIN, TEXT_W - NAME_MARGIN - sw), (floor - PIRATE_TOP) * 2 - LINE_H * 2 - 8, { scale: 2 });
        }
        // The caption types out a line at a time: the title from 0.5 s, the duty from 2.0 s.
        const line1 = d.cap.rows[0].parts.reduce((sum, part) => sum + part.len, 0);
        drawCaption(d.cap, Math.min(line1, typedAt(u, 0.5, 0.03)) + typedAt(u, 2.0, 0.03));
    }

    // Beat kind -> renderer.
    const BEAT_DRAW = {
        notice: drawNotice, walkin: drawDuel, insult: drawDuel, menu: drawDuel, comeback: drawDuel, clash: drawDuel, gag: drawDuel,
        intro: drawIntro, 'final-walk': drawDuel, winner: drawWinner,
    };

    // The whole show for a plan: the intro (if asked for), a notice before each round, every duel, then
    // the winner's scene. The shanty starts with the first notice.
    function buildTimeline(plan, { intro = false } = {}) {
        const beats = intro ? introBeats(plan) : [];
        const geo = bracketGeometry(plan);
        let remaining = plan.textColour.length;
        plan.rounds.forEach((round, r) => {
            const notice = noticeBeat(plan, geo, r);
            if (r === 0) notice.events.push({ at: 0, kind: 'music' }, { at: 0, kind: 'mode', mode: 'duel' });
            beats.push(notice);
            for (const m of round) {
                if (m.bye) continue;
                remaining--;
                beats.push(...duelBeats(plan, m, remaining));
            }
        });
        beats.push(winnerBeat(plan));
        return beats;
    }

    // Lays beats end to end on the run clock and flattens their events into one time-sorted queue
    // (stable, so same-time events keep beat order). Each event remembers its beat, for skip().
    function startRun(beats) {
        let t = 0;
        const events = [];
        beats.forEach((beat, i) => {
            beat.start = t;
            for (const e of beat.events) events.push({ ...e, t: t + e.at, beat: i });
            t += beat.dur;
        });
        events.sort((a, b) => a.t - b.t);
        Object.assign(run, { t: 0, speed: 1, beats, beatIdx: 0, events, eventIdx: 0, total: t });
    }

    function fireEvent(e) {
        if (e.kind === 'sfx') sfx[e.name]();
        else if (e.kind === 'out') markOut(e.idx);
        else if (e.kind === 'status') setStatus(e.text);
        else if (e.kind === 'music') music.start();
        else if (e.kind === 'theme') theme[e.name]();
        else if (e.kind === 'mode') setControls(e.mode);
        else if (e.kind === 'introSeen') introSeen = true;
        else if (e.kind === 'finish') finishGame();
    }

    // Fires every event the clock has reached, in order; called only from advanceRun.
    function runEvents() {
        while (run.eventIdx < run.events.length && run.events[run.eventIdx].t <= run.t) fireEvent(run.events[run.eventIdx++]);
        while (run.beatIdx < run.beats.length - 1 && run.t >= run.beats[run.beatIdx + 1].start) run.beatIdx++;
    }

    // The beat showing at time t (the last one, held, once the show is over).
    function beatAt(t) {
        const beats = run.beats;
        let lo = 0, hi = beats.length - 1;
        while (lo < hi) {
            const mid = (lo + hi + 1) >> 1;
            if (beats[mid].start <= t) lo = mid; else hi = mid - 1;
        }
        return beats[lo];
    }

    // Skip and Play again share one spot in the sidebar, and Start sits just above: a double-click or a
    // repeated Enter must never carry from one into the next (a second press landing on Play again would
    // re-roll the result the room just saw). So after a game starts, a skip, or the winner's scene
    // appearing, Start, Skip and Play again ignore presses for PRESS_GUARD ms.
    const PRESS_GUARD = 800;
    let pressGuardUntil = 0;
    const guarded = () => performance.now() < pressGuardUntil;
    const armPressGuard = () => { pressGuardUntil = performance.now() + PRESS_GUARD; };

    // Which buttons show: 'idle' (title card), 'intro', 'duel', or 'winner'. If the focused button is
    // hidden, focus goes to the stage itself, never onto the button that takes its place.
    function setControls(mode) {
        const focused = document.activeElement;
        skipBtn.hidden = mode !== 'intro' && mode !== 'duel';
        skipBtn.textContent = mode === 'intro' ? 'Skip intro' : 'Skip to result';
        playAgainBtn.hidden = mode !== 'winner';
        if ((focused === skipBtn && skipBtn.hidden) || (focused === playAgainBtn && playAgainBtn.hidden)) {
            gameCanvas.focus({ preventScroll: true });
        }
    }

    // Start and Play again both come here: a fresh draw for the roster as it is now. The story intro plays
    // only on the first game after the page loads. A press while a game is playing, or within the press
    // guard, does nothing.
    function startGame() {
        if (game.playing || participants.length < 2 || guarded()) return;
        game.playing = true;
        armPressGuard();
        try {
            sfx.unlock();
            // Whatever the last game's winner scene still had in flight (the reprise's tail, a squawk).
            sfx.stopAll();
            run.beats = null;
            const names = [...participants];
            const plan = DuelCore.planGame(names);
            Object.assign(game, { plan, names });
            prewarm(plan);
            noticeBoard();
            noteCloseUp();
            swatchColours = plan.textColour;
            resetRoster();
            setLocked(true);
            setStatus('');
            const intro = !introSeen;
            startRun(buildTimeline(plan, { intro }));
            setControls(intro ? 'intro' : 'duel');
        } catch (err) {
            // Never leave Start dead: back to the title card with the roster unlocked.
            console.error(err);
            sfx.stopAll();
            run.beats = null;
            game.playing = false;
            swatchColours = null;
            setLocked(false);
            setControls('idle');
            setStatus('Something went wrong starting the duel.');
        }
    }

    function playAgain() {
        if (playAgainBtn.hidden) return;
        startGame();
    }

    // Fired as the winner's scene begins: the shanty stops (the reprise plays), and the roster unlocks so
    // names can be changed before Play again or Start.
    function finishGame() {
        armPressGuard();
        music.stop();
        game.playing = false;
        swatchColours = null;
        setLocked(false);
        setControls('winner');
    }

    // During the intro, Skip jumps to the first notice; otherwise to the winner's scene. Skipped strike-outs
    // and status lines are applied at once, skipped sounds are dropped, and whatever is playing is silenced
    // (the winner's reprise then plays from its own beat). The press guard means a double-click on
    // "Skip intro" can't also skip the whole tournament.
    function skip() {
        if (!game.playing || !run.beats || guarded()) return;
        const inIntro = run.beats[run.beatIdx].kind === 'intro';
        const target = run.beats.findIndex(inIntro ? (b => b.kind !== 'intro') : (b => b.kind === 'winner'));
        if (target <= run.beatIdx) return;
        armPressGuard();
        while (run.eventIdx < run.events.length && run.events[run.eventIdx].beat < target) {
            const e = run.events[run.eventIdx++];
            if (e.kind !== 'sfx' && e.kind !== 'music' && e.kind !== 'theme') fireEvent(e);
        }
        run.t = run.beats[target].start;
        run.beatIdx = target;
        sfx.stopAll();
        if (inIntro) {
            setControls('duel');
        } else {
            setStatus('Skipped to the result.');
        }
    }

    startBtn.addEventListener('click', startGame);
    skipBtn.addEventListener('click', skip);
    playAgainBtn.addEventListener('click', playAgain);

    // --- Frame ---
    function draw() {
        sx.setTransform(1, 0, 0, 1, 0, 0);
        tx.setTransform(1, 0, 0, 1, 0, 0);
        tx.clearRect(0, 0, TEXT_W, TEXT_H);
        if (run.beats) {
            // A beat draws from its local time; one that holds (the winner's scene) keeps its clock running.
            const beat = beatAt(run.t), u = run.t - beat.start;
            BEAT_DRAW[beat.kind](beat, beat.hold ? Math.max(0, u) : clamp(u, 0, beat.dur));
        } else {
            drawTitleCard(run.t);
        }
    }

    let frameErrorLogged = false;

    function frame(now) {
        try {
            const dt = lastFrameAt === null ? 0 : (now - lastFrameAt) / 1000;
            lastFrameAt = now;
            advanceRun(dt);
            draw();
            composite();
        } catch (err) {
            if (!frameErrorLogged) {
                frameErrorLogged = true;
                console.error(err);
            }
        } finally {
            requestAnimationFrame(frame);
        }
    }

    // --- Start up ---
    if (new URLSearchParams(location.search).has('selftest')) {
        showSelfTest();
    } else {
        participants = loadNames();
        updateList();
        requestAnimationFrame(frame);
    }
</script>
</body>
</html>
