<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swashbuckle!</title>
    <style>
        :root {
            --bg-color: #120d16;
            --wood: #3b2617;
            --wood-dark: #24150b;
            --parchment: #e8d5a3;
            --parchment-edge: #c9b27a;
            --ink: #2a1a0e;
            --gold: #f2c14e;
            --gold-dark: #b4862a;
            --muted: #7a5f38;
            --error-color: #a3162f;
            --pass-color: #2a7a2e;
        }
        [hidden] { display: none !important; }
        body {
            font-family: 'Courier New', Courier, monospace;
            background:
                radial-gradient(circle at 50% -10%, #2b1d34 0%, transparent 60%),
                var(--bg-color);
            background-color: var(--bg-color);
            color: var(--ink);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: 700;
            font-size: 44px;
            letter-spacing: 4px;
            margin: 0 0 16px;
            text-align: center;
            line-height: 1.1;
            color: var(--gold);
            text-shadow: 0 3px 0 var(--wood-dark), 0 0 18px rgba(242, 193, 78, 0.25);
        }
        .container {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            max-width: 1300px;
            width: 100%;
        }
        .sidebar {
            flex: 1;
            min-width: 230px;
            max-width: 300px;
            background: var(--parchment);
            padding: 20px;
            border: 4px solid var(--wood);
            border-radius: 6px;
            box-shadow: 0 6px 0 var(--wood-dark), inset 0 0 30px rgba(120, 80, 30, 0.25);
        }
        .sidebar h2 {
            margin: 0 0 12px;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 22px;
            letter-spacing: 1px;
            color: var(--ink);
        }
        .game-area {
            flex: 4;
            position: relative;
            min-width: 0;
        }
        canvas {
            background: var(--wood-dark);
            border: 4px solid var(--wood);
            border-radius: 6px;
            box-shadow: 0 6px 0 var(--wood-dark);
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            image-rendering: pixelated;
            box-sizing: border-box;
        }
        #gameCanvas:focus { outline: none; }
        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-bottom: 10px;
            background: #f8edcf;
            color: var(--ink);
            border: 2px solid var(--parchment-edge);
            border-radius: 4px;
            font-family: inherit;
            font-size: 16px;
        }
        input[type="text"]:focus { outline: none; border-color: var(--wood); box-shadow: 0 0 0 2px var(--gold); }
        button {
            width: 100%;
            padding: 10px;
            background: var(--wood);
            color: var(--parchment);
            border: none;
            border-radius: 4px;
            box-shadow: 0 4px 0 var(--wood-dark);
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin-bottom: 12px;
            transition: background 0.15s, transform 0.05s, box-shadow 0.05s;
        }
        button:hover:not(:disabled) { background: #55371f; }
        button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--wood-dark); }
        button:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
        button:disabled, input:disabled { opacity: 0.45; cursor: not-allowed; }
        #startBtn, #playAgainBtn { background: var(--gold); color: var(--ink); box-shadow: 0 4px 0 var(--gold-dark); }
        #startBtn:hover:not(:disabled), #playAgainBtn:hover:not(:disabled) { background: #f7d273; }
        #startBtn:active:not(:disabled), #playAgainBtn:active:not(:disabled) { box-shadow: 0 1px 0 var(--gold-dark); }
        #muteBtn { background: transparent; color: var(--ink); border: 2px solid var(--parchment-edge); box-shadow: none; font-size: 13px; }
        #muteBtn:hover:not(:disabled) { background: #dcc78f; }
        #nameError {
            min-height: 1.2em;
            margin: -4px 0 8px;
            color: var(--error-color);
            font-size: 13px;
            font-weight: bold;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0 0 4px;
            max-height: 320px;
            overflow-y: auto;
        }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            background: #f8edcf;
            margin-bottom: 5px;
            border: 1px solid var(--parchment-edge);
            border-left: 8px solid var(--swatch, #888);
            border-radius: 3px;
        }
        li .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold; }
        li.out .name { text-decoration: line-through; opacity: 0.5; }
        .count { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
        .remove-btn {
            width: auto;
            margin: 0;
            padding: 4px 8px;
            background: #8a2b1e;
            color: #fff;
            font-size: 12px;
            box-shadow: none;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .remove-btn:hover:not(:disabled) { background: #a63a2b; }
        hr { border: none; border-top: 2px dashed var(--parchment-edge); margin: 16px 0; }
        .fair-note { font-size: 12px; line-height: 1.5; color: var(--muted); margin: 6px 0 0; }
        .fair-note a, #selftestPanel a { color: #7a3b0c; }
        /* Read out by screen readers; shown as text under the board on small screens. */
        #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        #selftestPanel {
            max-width: 820px;
            width: 100%;
            background: var(--parchment);
            color: var(--ink);
            border: 4px solid var(--wood);
            border-radius: 6px;
            padding: 20px 24px;
            box-sizing: border-box;
        }
        .check { padding: 10px 0; border-bottom: 1px solid var(--parchment-edge); }
        .check .title { font-weight: bold; }
        .check .detail { font-size: 13px; color: var(--muted); margin-top: 4px; }
        .check.pass .title::before { content: '\2714 '; color: var(--pass-color); }
        .check.fail .title::before { content: '\2716 '; color: var(--error-color); }
        .summary { font-size: 22px; font-weight: bold; margin: 16px 0 8px; }
        .summary.pass { color: var(--pass-color); }
        .summary.fail { color: var(--error-color); }
        @media (max-width: 900px) {
            body { padding: 12px; }
            h1 { font-size: 30px; letter-spacing: 2px; }
            .container { flex-direction: column-reverse; align-items: stretch; }
            .sidebar { max-width: none; }
            #status {
                position: static; width: auto; height: auto; overflow: visible; clip: auto; white-space: normal;
                margin-top: 8px; padding: 6px 10px; background: var(--parchment); border: 2px solid var(--wood);
                border-radius: 4px; text-align: center; font-weight: bold; font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <h1>SWASHBUCKLE!</h1>

    <div class="container" id="gameView">
        <div class="sidebar">
            <h2>Crew roster</h2>
            <input type="text" id="nameInput" placeholder="Enter pirate name..." autocomplete="off" maxlength="18" aria-label="Pirate name">
            <div id="nameError" role="alert" aria-live="polite"></div>
            <button id="addBtn">Add Pirate</button>
            <div class="count" id="nameCount"></div>
            <ul id="nameList"></ul>
            <hr>
            <button id="startBtn" disabled>Start Duel</button>
            <button id="skipBtn" hidden>Skip to result</button>
            <button id="playAgainBtn" hidden>Play again</button>
            <button id="muteBtn">Sound: on</button>
            <p class="fair-note">
                Every duel is decided with your browser's secure random generator before any sword is drawn,
                so every name has exactly the same chance. <a href="?selftest">Run the fairness self-test</a>
            </p>
        </div>

        <div class="game-area">
            <canvas id="gameCanvas" width="1280" height="720" tabindex="-1" aria-label="Swashbuckle duel stage"></canvas>
            <div id="status" aria-live="polite"></div>
        </div>
    </div>

    <div id="selftestPanel" hidden>
        <h2>Fairness self-test</h2>
        <div id="selftestResults">Running…</div>
        <p><a id="backLink" href="?">Back to the game</a></p>
    </div>

            { insult: 'You code in light mode like a sun-blind landlubber!', comeback: 'I like to see my bugs. You keep yours in the dark.',

            { insult: 'Pairing with you is like rowing with one oar!', comeback: 'Only because you keep rowing the other way.',
                captain: 'Pair with you and we go round in circles for three hours!' },
            { insult: 'Your code is full of magic numbers!', comeback: 'And yours runs on magic. Nobody knows how.',
                captain: 'You hard-coded 42 in seventeen places with no comment!' },
            { insult: 'Your app only runs on localhost:3000!', comeback: 'Still more users than your app in production.',
                captain: "Your grand launch is a URL that starts with 'localhost'!" },
            { insult: "You couldn't reverse a linked list with a crew of ten!", comeback: "I'd reverse it, then use it to tie you to the mast.",
                captain: "Hand you a whiteboard and a linked list and you'd sink!" },
            { insult: 'Your algorithm runs in O(n squared) on a good day!', comeback: "And yours runs in O(never). It's still going.",
                captain: 'Your nested loops would outlast a voyage round the world!' },
            { insult: "You close every bug as 'cannot reproduce'!", comeback: "Can't reproduce. Unlike your bugs, which breed.",
                captain: "You'd mark a burning ship 'cannot reproduce'!" },
            { insult: "Your error messages just say 'Oops!'", comeback: 'At least they apologise. Your code never does.',
                captain: "Every crash of yours says 'Oops' and nothing else!" },
            { insult: 'Your app falls over when two users log in!', comeback: "Two users? That's double your entire user base.",
                captain: 'Your service sinks the moment a second sailor clicks!' },
            { insult: 'You ran DELETE without a WHERE clause!', comeback: "I was clearing out your old tables. You're welcome.",
                captain: 'You wiped the whole customers table with one careless query!' },
            { insult: 'You sneak in changes during the code freeze!', comeback: 'Someone had to thaw out your broken release.',
                captain: 'The whole fleet froze changes, and you shipped anyway!' },
            { insult: 'You build servers by clicking buttons in a console!', comeback: 'Better than yours: a plan nobody dares to apply.',
                captain: 'Your infrastructure is hand-clicked until something works!' },
        ];

        // Wrong replies that lose the exchange.
        const DUDS = [
            'Oh yeah?', 'Works on my machine!', 'Have you tried turning it off and on again?', 'Er… no u.',
            "Let's take that offline.", "I'll circle back on that.", "That's… a feature?", 'Sorry, you were on mute.',
            'Per my last email…', "I'm rubber, you're glue… in prod.", 'Can we put a pin in that?', 'Who approved this meeting?',
            'Let me check with the team.', 'Can you share your screen?', "That's out of scope.", "I'll raise a ticket.",
            "It's on the roadmap.", "Hang on, I'm just reconnecting…", 'Good question. Next slide.', 'Can you raise that in the channel?',
            'Let me just grab a coffee.', "That's a known issue.", 'Can we time-box this?', "I'm blocked on that, sorry.",
            'Er… ship it?', 'Can I get back to you on that?', 'Sorry, can you repeat the question?', "That's above my pay grade.",
            "I'll add it to the backlog.", 'Wait, is this being recorded?',
        ];

        // Indexed by rounds-from-the-end, so the setting never depends on who wins.
        const LOCATIONS = ['plank', 'cliff', 'tavern', 'dock'];
        const GAGS = { plank: ['plank'], cliff: ['cliff'], tavern: ['facedown', 'swordbeam'], dock: ['splash', 'runaway'] };

        const LOOK_OPTIONS = {
            hat: ['tricorn', 'bandana', 'captain'],
            coat: ['crimson', 'navy', 'forest', 'plum', 'ochre', 'teal', 'slate', 'rust'],
            beard: ['none', 'stubble', 'full'],
            patch: [false, true],
            peg: [false, true],
            skin: ['pale', 'fair', 'tan', 'brown', 'dark'],
        };

        // Bright enough to read on the dark dialogue outline.
        const TEXT_COLOURS = ['#ffd84a', '#ff8a5c', '#7dffa0', '#6ec6ff', '#ff8ad8', '#c3a6ff', '#ffb347', '#8cf0ff',
            '#e8ff7a', '#ff7b7b', '#9db8ff', '#f2e6c9', '#8fe06a', '#f5a3ff', '#7fe3d0', '#ffc8a2'];

        const pool = new Uint32Array(1024);
        let poolPos = pool.length;
        function cryptoU32() {
            if (poolPos === pool.length) {
                crypto.getRandomValues(pool);
                poolPos = 0;
            }
            return pool[poolPos++];
        }

        // Uniform integer in [0, n). Draws from the top of the 2^32 range that would
        // make some results more likely (modulo bias) are thrown away and redrawn.
        function secureInt(n, nextU32 = cryptoU32) {
            if (!Number.isInteger(n) || n < 1) throw new RangeError(`secureInt needs a positive integer, got ${n}`);
            const limit = 2 ** 32 - (2 ** 32 % n);
            let x;
            do { x = nextU32(); } while (x >= limit);
            return x % n;
        }

        // Fisher-Yates on a copy.
        function shuffle(items, rng = secureInt) {
            const out = [...items];
            for (let i = out.length - 1; i > 0; i--) {
                const j = rng(i + 1);
                [out[i], out[j]] = [out[j], out[i]];
            }
            return out;
        }

        function chiSquare(observed, expected) {
            return observed.reduce((sum, o, i) => sum + (o - expected[i]) ** 2 / expected[i], 0);
        }

        function criticalValue(df) {
            if (!(df in CHI_CRITICAL) || df < 1) throw new RangeError(`No critical value for df=${df}`);
            return CHI_CRITICAL[df];
        }

        // Names that look the same on screen must count as the same person, or one
        // person could fight twice: unify accents, drop zero-width characters, collapse spaces.
        function normalizeName(raw) {
            return String(raw).normalize('NFC').replace(/[\u200B-\u200D\u2060\uFEFF]/g, '').replace(/\s+/g, ' ').trim();
        }

        function validateName(raw, existing) {
            const name = normalizeName(raw);
            if (!name) return { error: 'Type a name first.' };
            if (name.length > MAX_NAME_LENGTH) return { error: `Names can be up to ${MAX_NAME_LENGTH} characters.` };
            const lower = name.toLowerCase();
            if (existing.some(e => normalizeName(e).toLowerCase() === lower)) return { error: `${name} is already in the crew.` };
            if (existing.length >= MAX_NAMES) return { error: `The crew holds ${MAX_NAMES} pirates at most.` };
            return { name };
        }

        function parseSavedNames(json) {
            let data;
            try { data = JSON.parse(json); } catch { return []; }
            if (!Array.isArray(data)) return [];
            const names = [];
            for (const item of data) {
                if (typeof item !== 'string') continue;
                const result = validateName(item, names);
                if (result.name) names.push(result.name);
            }
            return names;
        }

        // The bitmap font has no accents: strip them. The renderer decides what to do with the rest.
        function displayName(name) {
            return name.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        const range = n => [...Array(n).keys()];

        function bracketSize(n) {
            let size = 2;
            while (size < n) size *= 2;
            return size;
        }

        // A deck is shuffled and dealt from, then reshuffled when empty, so every card
        // shows before any repeats. A card in `avoid` goes to the bottom and the next is dealt.
        function makeDeck(items, rng) {
            let deck = [];
            return (avoid = []) => {
                for (;;) {
                    if (!deck.length) deck = shuffle(items, rng);
                    const card = deck.pop();
                    if (!avoid.includes(card)) return card;
                    deck.unshift(card);
                }
            };
        }

        // Slots 2k and 2k+1 form first-round match k. Byes go in distinct matches.
        function seedBracket(n, size, rng) {
            const byeMatches = new Set(shuffle(range(size / 2), rng).slice(0, size - n));
            const order = shuffle(range(n), rng);
            const seeds = [];
            for (let k = 0; k < size / 2; k++) {
                if (byeMatches.has(k)) seeds.push(...(rng(2) === 0 ? [order.pop(), -1] : [-1, order.pop()]));
                else seeds.push(order.pop(), order.pop());
            }
            return seeds;
        }

        // Cursor path ending on `chosenSlot`; every entry is a move, so neighbours differ.
        function dealHovers(length, chosenSlot, rng) {
            const hovers = [chosenSlot];
            while (hovers.length < length) {
                const others = [0, 1, 2].filter(s => s !== hovers[0]);
                hovers.unshift(others[rng(2)]);
            }
            return hovers;
        }

        // The winner is one uniform draw, made first. Everything else is dealt from fair
        // coins and shuffled decks that never look at who wins, except the outcome that has
        // to follow from it: the right comeback lands exactly when the defender is the winner.
        function planGame(names, rng = secureInt) {
            const n = names.length;
            if (n < 2 || n > MAX_NAMES) throw new RangeError(`planGame needs 2 to ${MAX_NAMES} names, got ${n}`);
            const winnerIndex = rng(n);
            const size = bracketSize(n);
            const seeds = seedBracket(n, size, rng);
            const roundCount = Math.log2(size);

            const pairDeck = shuffle(range(PAIRS.length), rng);
            const dudDeck = makeDeck(range(DUDS.length), rng);
            const gagDecks = Object.fromEntries(LOCATIONS.map(l => [l, makeDeck(GAGS[l], rng)]));
            const heard = new Set();

            function playMatch(round, a, b) {
                const location = LOCATIONS[roundCount - 1 - round];
                if (a < 0 || b < 0) return { round, location, a, b, bye: true, winner: a < 0 ? b : a };
                const winner = a === winnerIndex || b === winnerIndex ? winnerIndex : [a, b][rng(2)];
                const attacker = [a, b][rng(2)];
                const defender = attacker === a ? b : a;
                const attackerLeft = rng(2) === 0;
                const captain = round === roundCount - 1;
                const pair = captain && heard.size ? [...heard][rng(heard.size)] : pairDeck.shift();
                const correctSlot = rng(3);
                const chosenSlot = defender === winner ? correctSlot : [0, 1, 2].filter(s => s !== correctSlot)[rng(2)];

                const wrong = [];
                for (let i = 0; i < 2; i++) {
                    if (rng(3) === 0) {
                        const taken = [pair, ...wrong.filter(o => o.kind === 'pair').map(o => o.id)];
                        const choices = range(PAIRS.length).filter(id => !taken.includes(id));
                        wrong.push({ kind: 'pair', id: choices[rng(choices.length)] });
                    } else {
                        wrong.push({ kind: 'dud', id: dudDeck(wrong.filter(o => o.kind === 'dud').map(o => o.id)) });
                    }
                }
                const menu = [...wrong];
                menu.splice(correctSlot, 0, { kind: 'pair', id: pair });
                if (!captain) for (const o of menu) if (o.kind === 'pair') heard.add(o.id);

                const hovers = dealHovers(captain ? 3 + rng(4) : 1 + rng(4), chosenSlot, rng);
                const gag = gagDecks[location]();
                return { round, location, a, b, bye: false, winner, attacker, defender, attackerLeft, pair, captain,
                    menu, correctSlot, chosenSlot, hovers, gag };
            }

            const rounds = [];
            let slots = seeds;
            for (let r = 0; r < roundCount; r++) {
                const round = [];
                for (let k = 0; k < slots.length / 2; k++) round.push(playMatch(r, slots[2 * k], slots[2 * k + 1]));
                rounds.push(round);
                slots = round.map(m => m.winner);
            }

            const pick = list => list[rng(list.length)];
            const looks = names.map(() => Object.fromEntries(Object.entries(LOOK_OPTIONS).map(([field, options]) => [field, pick(options)])));
            const textColour = shuffle(TEXT_COLOURS, rng).slice(0, n);
            const introOrder = shuffle(range(n), rng);
            return { winnerIndex, size, seeds, rounds, looks, textColour, introOrder };
        }

        const isIndex = (x, count) => Number.isInteger(x) && x >= 0 && x < count;
        const optionKey = o => `${o.kind}:${o.id}`;

        function menuIsValid(m) {
            if (!Array.isArray(m.menu) || m.menu.length !== 3) return false;
            if (!m.menu.every(o => isIndex(o.id, o.kind === 'pair' ? PAIRS.length : o.kind === 'dud' ? DUDS.length : 0))) return false;
            if (new Set(m.menu.map(optionKey)).size !== 3) return false;
            return isIndex(m.correctSlot, 3) && optionKey(m.menu[m.correctSlot]) === optionKey({ kind: 'pair', id: m.pair });
        }

        function hoversAreValid(m) {
            const min = m.captain ? 3 : 1;
            const { hovers } = m;
            if (!Array.isArray(hovers) || hovers.length < min || hovers.length > min + 3) return false;
            return hovers.every((h, i) => isIndex(h, 3) && (i === 0 || h !== hovers[i - 1])) && hovers.at(-1) === m.chosenSlot;
        }

        // Re-checks a plan against every rule in planGame.
        function planIsValid(plan, names) {
            const n = names.length;
            const { winnerIndex, size, seeds, rounds, looks, textColour, introOrder } = plan;
            if (n < 2 || n > MAX_NAMES || !isIndex(winnerIndex, n)) return false;
            if (size !== bracketSize(n) || seeds.length !== size || rounds.length !== Math.log2(size)) return false;
            if (!seeds.every(s => s === -1 || isIndex(s, n)) || seeds.filter(s => s === -1).length !== size - n) return false;
            if (new Set(seeds.filter(s => s >= 0)).size !== n) return false;

            const normalPairs = new Set();
            const heard = new Set();
            let slots = seeds;
            for (let r = 0; r < rounds.length; r++) {
                if (rounds[r].length !== slots.length / 2) return false;
                for (let k = 0; k < rounds[r].length; k++) {
                    const m = rounds[r][k];
                    const [a, b] = [slots[2 * k], slots[2 * k + 1]];
                    if (m.round !== r || m.location !== LOCATIONS[rounds.length - 1 - r] || m.a !== a || m.b !== b) return false;
                    if (m.bye !== (a < 0 || b < 0) || (a < 0 && b < 0)) return false;
                    if (m.bye) {
                        if (m.winner !== (a < 0 ? b : a)) return false;
                        continue;
                    }
                    const expectedWinner = a === winnerIndex || b === winnerIndex ? winnerIndex : m.winner;
                    if ((m.winner !== a && m.winner !== b) || m.winner !== expectedWinner) return false;
                    if (m.attacker !== a && m.attacker !== b) return false;
                    if (m.defender !== (m.attacker === a ? b : a) || typeof m.attackerLeft !== 'boolean') return false;
                    const isFinal = r === rounds.length - 1;
                    if (m.captain !== isFinal || !isIndex(m.pair, PAIRS.length)) return false;
                    if (!menuIsValid(m) || !isIndex(m.chosenSlot, 3)) return false;
                    if ((m.chosenSlot === m.correctSlot) !== (m.defender === m.winner)) return false;
                    if (!hoversAreValid(m) || !GAGS[m.location].includes(m.gag)) return false;
                    if (isFinal) {
                        if (heard.size && !heard.has(m.pair)) return false;
                    } else {
                        if (normalPairs.has(m.pair)) return false;
                        normalPairs.add(m.pair);
                        for (const o of m.menu) if (o.kind === 'pair') heard.add(o.id);
                    }
                }
                slots = rounds[r].map(m => m.winner);
            }
            if (slots.length !== 1 || slots[0] !== winnerIndex) return false;

            if (looks.length !== n || !looks.every(look => Object.entries(LOOK_OPTIONS).every(([f, options]) => options.includes(look[f])))) return false;
            if (textColour.length !== n || new Set(textColour).size !== n || !textColour.every(c => TEXT_COLOURS.includes(c))) return false;
            return introOrder.length === n && new Set(introOrder).size === n && introOrder.every(i => isIndex(i, n));
        }

        const pct = x => (x * 100).toFixed(1) + '%';
        const NO_TELL_SIZE = 8;

        // Plans `trials` games for each size and checks them. Runs in slices (step plans at
        // most `budget` games) so a page can show progress; runSelfTest does it all at once.
        function startSelfTest({ trials = 4000, plan = planGame, sizes = [2, 3, 5, 8, 16] } = {}) {
            const checks = [];
            const total = trials * sizes.length;
            let sizeIdx = 0, t = 0, wins = null;
            let broken = 0, plans = 0;
            // Size-8 plans only: what the eventual winner's duels look like against everyone else's.
            const winnerDuels = { count: 0, attacks: 0, onLeft: 0, slots: [0, 0, 0] };
            const hoverLengths = { winner: [0, 0, 0, 0], other: [0, 0, 0, 0] };

            function finishSize(n) {
                const chi = chiSquare(wins, new Array(n).fill(trials / n));
                const limit = criticalValue(n - 1);
                checks.push({
                    name: `Every pirate equally likely to win (${n} names)`,
                    passed: chi < limit,
                    detail: `lowest ${pct(Math.min(...wins) / trials)} · highest ${pct(Math.max(...wins) / trials)} · ` +
                        `target ${pct(1 / n)} · χ² ${chi.toFixed(1)} (limit ${limit})`,
                });
            }

            function tally(p) {
                for (const m of p.rounds.flat()) {
                    if (m.bye) continue;
                    const winnerFights = m.a === p.winnerIndex || m.b === p.winnerIndex;
                    if (winnerFights) {
                        winnerDuels.count++;
                        if (m.attacker === p.winnerIndex) winnerDuels.attacks++;
                        const leftPirate = m.attackerLeft ? m.attacker : m.defender;
                        if (leftPirate === p.winnerIndex) winnerDuels.onLeft++;
                        winnerDuels.slots[m.correctSlot]++;
                    }
                    // The final is always a longer hover, so only the earlier duels compare like for like.
                    if (!m.captain) hoverLengths[winnerFights ? 'winner' : 'other'][m.hovers.length - 1]++;
                }
            }

            function step(budget) {
                while (budget-- > 0 && sizeIdx < sizes.length) {
                    const n = sizes[sizeIdx];
                    if (t === 0) wins = new Array(n).fill(0);
                    const names = Array.from({ length: n }, (_, i) => `P${i}`);
                    const p = plan(names);
                    plans++;
                    wins[p.winnerIndex]++;
                    if (!planIsValid(p, names)) broken++;
                    if (n === NO_TELL_SIZE) tally(p);
                    if (++t === trials) {
                        finishSize(n);
                        sizeIdx++;
                        t = 0;
                    }
                }
                return sizeIdx === sizes.length;
            }

            function noTellChecks() {
                const { count, attacks, onLeft, slots } = winnerDuels;
                const rate = (name, hits) => {
                    const limit = 4 * Math.sqrt(0.25 / count);
                    return {
                        name,
                        passed: Math.abs(hits / count - 0.5) <= limit,
                        detail: `${pct(hits / count)} of ${count.toLocaleString()} duels · target 50.0% ± ${pct(limit)}`,
                    };
                };
                const slotChi = chiSquare(slots, new Array(3).fill(count / 3));
                const { winner, other } = hoverLengths;
                const rowTotals = [winner, other].map(row => row.reduce((a, b) => a + b, 0));
                const cells = [...winner, ...other];
                const expected = [winner, other].flatMap((row, r) => row.map((_, i) => rowTotals[r] * (winner[i] + other[i]) / (rowTotals[0] + rowTotals[1])));
                const hoverChi = chiSquare(cells, expected);
                return [
                    rate('The winner attacks as often as anyone else', attacks),
                    rate('The winner stands on the left as often as anyone else', onLeft),
                    {
                        name: 'The right answer sits in each menu slot equally often in the winner’s duels',
                        passed: slotChi < criticalValue(2),
                        detail: `slots ${slots.join(' / ')} · χ² ${slotChi.toFixed(1)} (limit ${criticalValue(2)})`,
                    },
                    {
                        name: 'The winner’s early duels show the same cursor hover lengths as everyone else’s',
                        passed: hoverChi < criticalValue(3),
                        detail: `winner ${winner.join(' / ')} · others ${other.join(' / ')} · χ² ${hoverChi.toFixed(1)} (limit ${criticalValue(3)})`,
                    },
                ];
            }

            function result() {
                const all = [...checks];
                all.push({
                    name: 'Every plan follows the bracket and duel rules',
                    passed: broken === 0,
                    detail: `${broken} broken out of ${plans.toLocaleString()} plans, each re-checked rule by rule`,
                });
                if (winnerDuels.count) all.push(...noTellChecks());
                return { passed: all.every(c => c.passed), checks: all, plans };
            }

            return { step, result, progress: () => ({ done: plans, total }) };
        }

        function runSelfTest(options) {
            const test = startSelfTest(options);
            while (!test.step(Infinity));
            return test.result();
        }

        return {
            MAX_NAMES, MAX_NAME_LENGTH, PAIRS, DUDS, LOCATIONS, GAGS, LOOK_OPTIONS, TEXT_COLOURS,
            secureInt, shuffle, chiSquare, criticalValue, normalizeName,
            validateName, parseSavedNames, displayName, planGame, planIsValid, startSelfTest, runSelfTest,
        };
    })();
</script>

<script id="duel-ui">
    const STORAGE_KEY = 'swashbuckleNames';

    const nameInput = document.getElementById('nameInput');
    const nameError = document.getElementById('nameError');
    const addBtn = document.getElementById('addBtn');
    const nameCount = document.getElementById('nameCount');
    const nameList = document.getElementById('nameList');
    const startBtn = document.getElementById('startBtn');
    const skipBtn = document.getElementById('skipBtn');
    const playAgainBtn = document.getElementById('playAgainBtn');
    const muteBtn = document.getElementById('muteBtn');

    let participants = [];
    let locked = false;
    // Pirates struck through during a game, by index into participants.
    const outIdx = new Set();
    // During a game the swatches show each pirate's on-stage text colour (plan.textColour), else null.
    let swatchColours = null;

    // --- Crew roster ---
    function saveNames() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(participants)); } catch { /* storage unavailable */ }
    }

    function loadNames() {
        try { return DuelCore.parseSavedNames(localStorage.getItem(STORAGE_KEY)); } catch { return []; }
    }

    function hueFor(index) {
        return Math.round((index * 137.508) % 360);
    }

    function updateList() {
        nameList.innerHTML = '';
        participants.forEach((name, index) => {
            const li = document.createElement('li');
            li.style.setProperty('--swatch', swatchColours ? swatchColours[index] : `hsl(${hueFor(index)}, 60%, 45%)`);
            li.classList.toggle('out', outIdx.has(index));
            const span = document.createElement('span');
            span.className = 'name';
            span.textContent = name;
            const rmBtn = document.createElement('button');
            rmBtn.textContent = 'X';
            rmBtn.className = 'remove-btn';
            rmBtn.setAttribute('aria-label', `Remove ${name}`);
            rmBtn.disabled = locked;
            rmBtn.onclick = () => {
                participants.splice(index, 1);
                namesChanged();
            };
            li.append(span, rmBtn);
            nameList.appendChild(li);
        });
        nameCount.textContent = `${participants.length} / ${DuelCore.MAX_NAMES} pirates`;
        nameInput.disabled = locked;
        addBtn.disabled = locked;
        startBtn.disabled = locked || participants.length < 2;
        playAgainBtn.disabled = locked || participants.length < 2;
    }

    // Locks the roster while a duel plays out.
    function setLocked(value) {
        locked = Boolean(value);
        updateList();
    }

    // Strikes a pirate's row through once they are knocked out.
    function markOut(nameIdx) {
        outIdx.add(nameIdx);
        const li = nameList.children[nameIdx];
        if (li) li.classList.add('out');
    }

    function resetRoster() {
        outIdx.clear();
        for (const li of nameList.children) li.classList.remove('out');
    }

    function namesChanged() {
        outIdx.clear();
        saveNames();
        updateList();
    }

    function addName() {
        const result = DuelCore.validateName(nameInput.value, participants);
        if (result.error) {
            nameError.textContent = result.error;
            return;
        }
        nameError.textContent = '';
        participants.push(result.name);
        nameInput.value = '';
        namesChanged();
    }

    addBtn.addEventListener('click', addName);
    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addName(); });

    // --- Sound ---
    // Everything is synthesised with oscillators and filtered noise. The AudioContext is only
    // created by sfx.unlock(), which the Start click calls, so nothing touches audio on load.
    const MUTE_KEY = 'swashbuckleMuted';
    const MASTER_LEVEL = 0.9;
    let audioCtx = null;
    let master = null;
    let noiseBuffer = null;
    let muted = false;
    let lastBlipAt = -Infinity;
    // Every scheduled source still playing; each entry can be silenced with killVoice().
    const voices = new Set();
    const musicVoices = new Set();
    const themeVoices = new Set();

    // Fades a voice out without a pop. One that has not started yet is just cancelled; a playing one
    // holds its current gain and ramps from there. Safe to call twice on the same voice.
    function killVoice(v) {
        if (v.killed) return;
        v.killed = true;
        voices.delete(v);
        musicVoices.delete(v);
        themeVoices.delete(v);
        const now = audioCtx.currentTime;
        if (v.t0 > now) {
            try { v.src.stop(now); } catch { /* already stopped */ }
            v.env.disconnect();
            return;
        }
        const g = v.env.gain;
        if (g.cancelAndHoldAtTime) {
            g.cancelAndHoldAtTime(now);
        } else {
            const level = g.value;
            g.cancelScheduledValues(now);
            g.setValueAtTime(level, now);
        }
        g.setTargetAtTime(0, now, 0.01);
        // Never push the voice's own stop time later than it already is.
        if (v.t1 > now + 0.06) {
            try { v.src.stop(now + 0.06); } catch { /* already stopped */ }
        }
    }

    // Wires src -> [filter] -> env -> master, tracks it, and releases it when it ends.
    function launch({ src, env, filter, t0, t1, set = voices }) {
        const v = { src, env, t0, t1, killed: false };
        if (filter) {
            src.connect(filter);
            filter.connect(env);
        } else {
            src.connect(env);
        }
        env.connect(master);
        voices.add(v);
        if (set !== voices) set.add(v);
        src.onended = () => {
            voices.delete(v);
            musicVoices.delete(v);
            src.disconnect();
            env.disconnect();
        };
        src.start(t0);
        src.stop(t1);
        return v;
    }

    // Peak volume with a linear attack and an exponential release over dur seconds.
    function shape(env, t0, dur, vol, attack = 0.005) {
        env.gain.setValueAtTime(0.0001, t0);
        env.gain.linearRampToValueAtTime(vol, t0 + attack);
        env.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    }

    function makeFilter(spec, t0, dur) {
        const f = audioCtx.createBiquadFilter();
        f.type = spec.type;
        f.Q.value = spec.q ?? 1;
        f.frequency.setValueAtTime(spec.from, t0);
        if (spec.to) f.frequency.exponentialRampToValueAtTime(spec.to, t0 + dur);
        return f;
    }

    function tone({ type = 'square', from, to = from, dur, vol = 0.1, delay = 0, attack = 0.005, filter = null, set = voices }) {
        if (!audioCtx) return;
        const t0 = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator();
        const env = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(from, t0);
        if (to !== from) osc.frequency.exponentialRampToValueAtTime(to, t0 + dur);
        shape(env, t0, dur, vol, attack);
        launch({ src: osc, env, filter: filter && makeFilter(filter, t0, dur), t0, t1: t0 + dur + 0.02, set });
    }

    function noise({ dur, vol = 0.1, delay = 0, attack = 0.005, filter }) {
        if (!audioCtx) return;
        const t0 = audioCtx.currentTime + delay;
        const src = audioCtx.createBufferSource();
        const env = audioCtx.createGain();
        src.buffer = noiseBuffer;
        src.loop = true;
        shape(env, t0, dur, vol, attack);
        launch({ src, env, filter: makeFilter(filter, t0, dur), t0, t1: t0 + dur + 0.02 });
    }

    // Leaves audioCtx null if audio is unavailable or setup throws, so every voice stays a no-op.
    function createContext() {
        let ctx = null;
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            ctx = new AC();
            const gain = ctx.createGain();
            gain.gain.value = muted ? 0 : MASTER_LEVEL;
            gain.connect(ctx.destination);
            // One second of white noise, looped by every noise voice.
            const buffer = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            master = gain;
            noiseBuffer = buffer;
            audioCtx = ctx;
        } catch {
            if (ctx) ctx.close().catch(() => {});
        }
    }

    const sfx = {
        // Idempotent; must be called from a user gesture.
        unlock() {
            if (!audioCtx) createContext();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        },
        // Blades meeting: a noisy strike over bright inharmonic ringing partials.
        clang() {
            noise({ dur: 0.09, vol: 0.14, filter: { type: 'highpass', from: 2500, q: 0.7 } });
            [1180, 1763, 2637, 3520].forEach((f, i) => {
                tone({ type: 'square', from: f, dur: 0.45 - i * 0.07, vol: 0.05 / (i + 1) + 0.015 });
            });
        },
        // Dialogue typewriter tick; at most one per 40 ms.
        blip() {
            const now = performance.now();
            if (now - lastBlipAt < 40) return;
            lastBlipAt = now;
            tone({ type: 'square', from: 760, to: 700, dur: 0.035, vol: 0.05 });
        },
        // Crowd "oooh": two detuned triangles gliding down under a low-pass, swelling then fading.
        ooh() {
            [300, 305, 450].forEach((f, i) => {
                tone({
                    type: 'triangle', from: f * 1.15, to: f * 0.85, dur: 0.9, vol: i === 2 ? 0.05 : 0.09, attack: 0.25,
                    filter: { type: 'lowpass', from: 900, q: 2 },
                });
            });
        },
        // Body hitting water: a downward plop and a hissing band-passed noise sweep.
        splash() {
            tone({ type: 'sine', from: 420, to: 90, dur: 0.18, vol: 0.2 });
            noise({ dur: 0.8, vol: 0.2, attack: 0.02, filter: { type: 'bandpass', from: 2400, to: 500, q: 0.8 } });
            noise({ dur: 0.35, vol: 0.12, delay: 0.12, filter: { type: 'bandpass', from: 1400, to: 400, q: 1.2 } });
        },
        // Plank groaning: low sawtooth wobbling in pitch through a narrow band-pass.
        creak() {
            const filter = { type: 'bandpass', from: 650, to: 480, q: 7 };
            [[110, 180, 0], [180, 120, 0.22], [120, 200, 0.4]].forEach(([from, to, delay]) => {
                tone({ type: 'sawtooth', from, to, dur: 0.24, vol: 0.12, delay, attack: 0.04, filter });
            });
        },
        // Parrot: two fast up-and-down chirps.
        squawk() {
            [0, 0.2].forEach((delay) => {
                tone({ type: 'square', from: 900, to: 1900, dur: 0.1, vol: 0.07, delay });
                tone({ type: 'square', from: 1900, to: 700, dur: 0.1, vol: 0.07, delay: delay + 0.1 });
            });
        },
        // A firework bursting far off: a soft low thump, then a crackle of high noise.
        boom() {
            tone({ type: 'sine', from: 140, to: 45, dur: 0.3, vol: 0.12 });
            noise({ dur: 0.25, vol: 0.05, filter: { type: 'lowpass', from: 900, to: 200, q: 0.7 } });
            noise({ dur: 0.5, vol: 0.035, delay: 0.12, attack: 0.05, filter: { type: 'highpass', from: 4000, q: 0.8 } });
        },
        // Silences the music and every voice still in flight.
        stopAll() {
            music.stop();
            if (audioCtx) [...voices].forEach(killVoice);
        },
    };

    // --- Shanty ---
    // Original 8-bar tune in A minor, 6/8: six eighth notes a bar, lead then bass, as
    // [MIDI note, length in eighths]. The last bar ends on the leading tone to pull back to bar 1.
    const SHANTY_LEAD = [
        [69, 2], [72, 1], [76, 3],
        [74, 2], [72, 1], [71, 3],
        [69, 1], [72, 1], [76, 1], [81, 2], [79, 1],
        [77, 2], [76, 1], [74, 3],
        [72, 2], [74, 1], [76, 2], [72, 1],
        [71, 2], [68, 1], [71, 1], [74, 2],
        [76, 2], [74, 1], [72, 1], [71, 1], [69, 1],
        [69, 1], [68, 1], [69, 1], [71, 1], [68, 2],
    ];
    // Two dotted-quarter bass notes a bar: root then fifth of Am, G, Am, Dm, C, E, Am, E7.
    const SHANTY_BASS = [45, 52, 43, 50, 45, 52, 38, 45, 48, 43, 40, 47, 45, 52, 40, 44];
    const SHANTY_EIGHTHS = 48;
    const EIGHTH = 0.19;
    const LOOKAHEAD = 0.3;
    const midiHz = (n) => 440 * 2 ** ((n - 69) / 12);

    // Flatten both parts into one time-ordered list of [start in eighths, MIDI note, length, voice].
    const shantyEvents = (() => {
        const events = [];
        let at = 0;
        SHANTY_LEAD.forEach(([note, len]) => {
            events.push([at, note, len, 'lead']);
            at += len;
        });
        SHANTY_BASS.forEach((note, i) => events.push([i * 3, note, 3, 'bass']));
        return events.sort((a, b) => a[0] - b[0]);
    })();

    let musicTimer = null;
    let musicCursor = 0;
    let loopStart = 0;

    function scheduleShanty() {
        while (loopStart + shantyEvents[musicCursor][0] * EIGHTH < audioCtx.currentTime + LOOKAHEAD) {
            const [at, note, len, voice] = shantyEvents[musicCursor];
            const delay = loopStart + at * EIGHTH - audioCtx.currentTime;
            const dur = len * EIGHTH * (voice === 'lead' ? 0.92 : 0.8);
            // After a throttled background tab wakes, skip notes already past rather than burst them out.
            if (delay > -0.05) {
                tone({
                    type: voice === 'lead' ? 'square' : 'triangle', from: midiHz(note), dur,
                    vol: voice === 'lead' ? 0.045 : 0.075, delay: Math.max(0, delay), attack: 0.01, set: musicVoices,
                });
            }
            musicCursor++;
            if (musicCursor === shantyEvents.length) {
                musicCursor = 0;
                loopStart += SHANTY_EIGHTHS * EIGHTH;
            }
        }
        musicTimer = setTimeout(scheduleShanty, 50);
    }

    const music = {
        start() {
            if (!audioCtx || musicTimer !== null) return;
            musicCursor = 0;
            loopStart = audioCtx.currentTime + 0.08;
            scheduleShanty();
        },
        stop() {
            clearTimeout(musicTimer);
            musicTimer = null;
            if (audioCtx) [...musicVoices].forEach(killVoice);
            theme.stop();
        },
    };
