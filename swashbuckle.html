                n.connect(hp); hp.connect(ng); ng.connect(env);
                launchNote([n], env, t0, t0 + dur + 0.02);
            }
        },
    };

    // Per-voice levels, in THEME_VOICES order.
    const THEME_GAIN = [0.55, 0.18, 0.42, 0.5, 0.12, 0.45];

    // Plays one score row at audio time t0. Notes whose beat ends in .5 are pushed late by the swing.
    function playThemeNote([voice, beat, beats, pitch, vel], t0) {
        const peak = THEME_GAIN[voice] * vel;
        THEME_SYNTH[THEME_VOICES[voice]](t0, voice === 5 ? pitch : midiHz(pitch), beats * BEAT_S, peak, beats);
    }
    const themeTime = (beat) => (beat + (beat % 1 === 0.5 ? THEME_SWING : 0)) * BEAT_S;

    function scheduleTheme() {
        while (themeCursor < themeNotes.length) {
            const row = themeNotes[themeCursor];
            const at = themeStart + themeTime(row[1]);
            if (at >= audioCtx.currentTime + LOOKAHEAD) break;
            // After a throttled background tab wakes, skip notes already past rather than burst them out.
            if (at > audioCtx.currentTime - 0.05) playThemeNote(row, Math.max(at, audioCtx.currentTime));
            themeCursor++;
        }
        themeTimer = themeCursor < themeNotes.length ? setTimeout(scheduleTheme, 50) : null;
    }

    // While the intro theme plays, the run clock follows the audio clock, so the title smash lands on the
    // brass hit however the frames pace. A small error is nudged away a little each frame; a big one (a
    // background tab, an AudioContext that resumes late) snaps the clock in one step, never past the end of
    // the intro. Called from advanceRun just before runEvents, so a forward snap fires every event it crosses,
    // in order. The clock never goes back before the start of the beat showing. Off for the reprise, when the
    // clock is suspended or runs fast, and once the run leaves the intro.
    let themeSync = false;
    function followTheme() {
        if (!themeSync || run.speed !== 1 || audioCtx.state !== 'running') return;
        const now = run.beats[run.beatIdx];
        if (now.kind !== 'intro') {
            themeSync = false;
            return;
        }
        const err = audioCtx.currentTime - themeStart - run.t;
        let next = run.t + clamp(err * 0.25, -0.02, 0.02);
        if (Math.abs(err) >= 0.25) {
            const introEnd = run.beats.find(b => b.kind !== 'intro').start;
            next = err > 0 ? Math.max(run.t, Math.min(run.t + err, introEnd - 0.01)) : run.t + err;
        }
        run.t = Math.max(next, now.start);
    }

    const theme = {
        play(section) {
            theme.stop();
            if (!audioCtx) return;
            themeNotes = THEME_SCORE[section];
            themeCursor = 0;
            themeStart = audioCtx.currentTime + 0.03;
            themeSync = section === 'intro';
            scheduleTheme();
        },
        playIntro() { theme.play('intro'); },
        playWinner() { theme.play('winner'); },
        stop() {
            clearTimeout(themeTimer);
            themeTimer = null;
            themeSync = false;
            if (audioCtx) [...themeVoices].forEach(killVoice);
        },
    };


    function setMuted(value) {
        muted = Boolean(value);
        if (master) {
            master.gain.cancelScheduledValues(audioCtx.currentTime);
            master.gain.setValueAtTime(muted ? 0 : MASTER_LEVEL, audioCtx.currentTime);
        }
        muteBtn.textContent = muted ? 'Sound: off' : 'Sound: on';
        try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch { /* storage unavailable */ }
    }

    muteBtn.addEventListener('click', () => setMuted(!muted));
    try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch { muted = false; }
    muteBtn.textContent = muted ? 'Sound: off' : 'Sound: on';

    // --- Self-test view (?selftest) ---
    function showSelfTest() {
        document.getElementById('gameView').hidden = true;
        document.getElementById('selftestPanel').hidden = false;
        document.getElementById('backLink').href = location.pathname;
        const out = document.getElementById('selftestResults');
        const test = DuelCore.startSelfTest();
        const tick = () => {
            if (!test.step(400)) {
                const { done, total } = test.progress();
                out.textContent = `Planning duels… ${done.toLocaleString()} of ${total.toLocaleString()}`;
                requestAnimationFrame(tick);
                return;
            }
            const result = test.result();
            out.innerHTML = '';
            const summary = document.createElement('div');
            summary.className = `summary ${result.passed ? 'pass' : 'fail'}`;
            summary.textContent = result.passed ? 'ALL CHECKS PASSED' : 'CHECK FAILED';
            out.appendChild(summary);
            const intro = document.createElement('p');
            intro.textContent = `Planned ${result.plans.toLocaleString()} games without playing them, using the same code as the real game. ` +
                'Each check compares the results with what perfect fairness would give.';
            out.appendChild(intro);
            for (const c of result.checks) {
                const row = document.createElement('div');
                row.className = `check ${c.passed ? 'pass' : 'fail'}`;
                const title = document.createElement('div');
                title.className = 'title';
                title.textContent = c.name;
                const detail = document.createElement('div');
                detail.className = 'detail';
                detail.textContent = c.detail;
                row.append(title, detail);
                out.appendChild(row);
            }
        };
        out.textContent = 'Planning duels…';
        requestAnimationFrame(tick);
    }

    // --- Pixel renderer ---
    const SCENE_W = 320;
    const SCENE_H = 180;
    const TEXT_W = 640;
    const TEXT_H = 360;
    const HORIZON = 104;

    const makeLayer = (w, h) => {
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        return [canvas, ctx];
    };

    // The scene is drawn at 320x180 and the text at 640x360, both scaled up onto the visible canvas.
    const [scene, sx] = makeLayer(SCENE_W, SCENE_H);
    const [textLayer, tx] = makeLayer(TEXT_W, TEXT_H);
    const gameCanvas = document.getElementById('gameCanvas');
    const gameCtx = gameCanvas.getContext('2d');
    gameCtx.imageSmoothingEnabled = false;

    function composite() {
        gameCtx.drawImage(scene, 0, 0, gameCanvas.width, gameCanvas.height);
        gameCtx.drawImage(textLayer, 0, 0, gameCanvas.width, gameCanvas.height);
    }

    // --- Palette ---
    const PAL = Object.freeze({
        black: '#000000', ink: '#1a1018', night0: '#0b0e1f', night1: '#141a38', night2: '#1e2850',
        navy: '#2a3b6e', blue: '#3d5a9a', sky: '#5e84c4', ice: '#9cc4e8', moon: '#f4efd0',
        moonShade: '#d4cfa0', star: '#ffffff', white: '#f4f4f4', grey: '#8a8f9c', greyDark: '#4a4f5c',
        wood0: '#24150b', wood1: '#3b2617', wood2: '#5c3a20', wood3: '#8a5a2e', lantern: '#f2a03a',
        flame: '#ffd36a', ember: '#d4561e', red: '#a3162f', parchment: '#e8d5a3',
        parchmentDark: '#c9b27a', gold: '#f2c14e', goldDark: '#b4862a', skin: '#e3a77c',
        skinDark: '#b87a54', green: '#2a7a2e', leaf: '#4aa04a', purple: '#5a3a78',
    });

    // Water colours step round a ramp: the "palette cycling" that makes the sea shimmer.
    const WATER = [PAL.navy, PAL.blue, PAL.sky, PAL.ice, PAL.sky, PAL.blue];
    const MOONLIT = [PAL.moonShade, PAL.moon, PAL.ice, PAL.moon, PAL.moonShade, PAL.sky];
    const WATER_STEP = 1.2;

    function waterColour(i, t, ramp = WATER) {
        return ramp[(i + Math.floor(t / WATER_STEP)) % ramp.length];
    }

    // --- Bitmap font (5x7 glyphs, 6 px advance, 9 px line height) ---
    const GLYPH_W = 5;
    const GLYPH_H = 7;
    const ADVANCE = 6;
    const LINE_H = 9;
    // These letters hang below the baseline, so their stored rows are drawn two pixels lower.
    const DESCENDERS = new Set('gpqy');

    const FONT = Object.fromEntries([
        '  00000 00000 00000 00000 00000 00000 00000',
        '! 00100 00100 00100 00100 00100 00000 00100',
        '" 01010 01010 01010 00000 00000 00000 00000',
        '# 01010 01010 11111 01010 11111 01010 01010',
        '$ 00100 01111 10100 01110 00101 11110 00100',
        '% 11000 11001 00010 00100 01000 10011 00011',
        '& 01100 10010 10100 01000 10101 10010 01101',
        '\' 00100 00100 01000 00000 00000 00000 00000',
        '( 00010 00100 01000 01000 01000 00100 00010',
        ') 01000 00100 00010 00010 00010 00100 01000',
        '* 00000 00100 10101 01110 10101 00100 00000',
        '+ 00000 00100 00100 11111 00100 00100 00000',
        ', 00000 00000 00000 00000 01100 00100 01000',
        '- 00000 00000 00000 11111 00000 00000 00000',
        '. 00000 00000 00000 00000 00000 01100 01100',
        '/ 00000 00001 00010 00100 01000 10000 00000',
        '0 01110 10001 10011 10101 11001 10001 01110',
        '1 00100 01100 00100 00100 00100 00100 01110',
        '2 01110 10001 00001 00010 00100 01000 11111',
        '3 11111 00010 00100 00010 00001 10001 01110',
        '4 00010 00110 01010 10010 11111 00010 00010',
        '5 11111 10000 11110 00001 00001 10001 01110',
        '6 00110 01000 10000 11110 10001 10001 01110',
        '7 11111 00001 00010 00100 01000 01000 01000',
        '8 01110 10001 10001 01110 10001 10001 01110',
        '9 01110 10001 10001 01111 00001 00010 01100',
        ': 00000 01100 01100 00000 01100 01100 00000',
        '; 00000 01100 01100 00000 01100 00100 01000',
        '< 00010 00100 01000 10000 01000 00100 00010',
        '= 00000 00000 11111 00000 11111 00000 00000',
        '> 01000 00100 00010 00001 00010 00100 01000',
        '? 01110 10001 00001 00010 00100 00000 00100',
        '@ 01110 10001 10111 10101 10111 10000 01110',
        'A 01110 10001 10001 11111 10001 10001 10001',
        'B 11110 10001 10001 11110 10001 10001 11110',
        'C 01110 10001 10000 10000 10000 10001 01110',
        'D 11110 10001 10001 10001 10001 10001 11110',
        'E 11111 10000 10000 11110 10000 10000 11111',
        'F 11111 10000 10000 11110 10000 10000 10000',
        'G 01110 10001 10000 10111 10001 10001 01111',
        'H 10001 10001 10001 11111 10001 10001 10001',
        'I 01110 00100 00100 00100 00100 00100 01110',
        'J 00111 00010 00010 00010 00010 10010 01100',
        'K 10001 10010 10100 11000 10100 10010 10001',
        'L 10000 10000 10000 10000 10000 10000 11111',
        'M 10001 11011 10101 10101 10001 10001 10001',
        'N 10001 10001 11001 10101 10011 10001 10001',
        'O 01110 10001 10001 10001 10001 10001 01110',
        'P 11110 10001 10001 11110 10000 10000 10000',
        'Q 01110 10001 10001 10001 10101 10010 01101',
        'R 11110 10001 10001 11110 10100 10010 10001',
        'S 01111 10000 10000 01110 00001 00001 11110',
        'T 11111 00100 00100 00100 00100 00100 00100',
        'U 10001 10001 10001 10001 10001 10001 01110',
        'V 10001 10001 10001 10001 10001 01010 00100',
        'W 10001 10001 10001 10101 10101 11011 10001',
        'X 10001 10001 01010 00100 01010 10001 10001',
        'Y 10001 10001 01010 00100 00100 00100 00100',
        'Z 11111 00001 00010 00100 01000 10000 11111',
        '[ 01110 01000 01000 01000 01000 01000 01110',
        '\\ 00000 10000 01000 00100 00010 00001 00000',
        '] 01110 00010 00010 00010 00010 00010 01110',
        '^ 00100 01010 10001 00000 00000 00000 00000',
        '_ 00000 00000 00000 00000 00000 00000 11111',
        '` 01000 00100 00010 00000 00000 00000 00000',
        'a 00000 00000 01110 00001 01111 10001 01111',
        'b 10000 10000 10110 11001 10001 10001 11110',
        'c 00000 00000 01110 10000 10000 10001 01110',
        'd 00001 00001 01101 10011 10001 10001 01111',
        'e 00000 00000 01110 10001 11111 10000 01110',
        'f 00110 01001 01000 11100 01000 01000 01000',
        'g 01111 10001 10001 10001 01111 00001 01110',
        'h 10000 10000 10110 11001 10001 10001 10001',
        'i 00100 00000 01100 00100 00100 00100 01110',
        'j 00010 00000 00110 00010 00010 10010 01100',
        'k 10000 10000 10010 10100 11000 10100 10010',
        'l 01100 00100 00100 00100 00100 00100 01110',
        'm 00000 00000 11010 10101 10101 10001 10001',
        'n 00000 00000 10110 11001 10001 10001 10001',
        'o 00000 00000 01110 10001 10001 10001 01110',
        'p 11110 10001 10001 10001 11110 10000 10000',
        'q 01111 10001 10001 10001 01111 00001 00001',
        'r 00000 00000 10110 11001 10000 10000 10000',
        's 00000 00000 01111 10000 01110 00001 11110',
        't 01000 01000 11100 01000 01000 01001 00110',
        'u 00000 00000 10001 10001 10001 10011 01101',
        'v 00000 00000 10001 10001 10001 01010 00100',
        'w 00000 00000 10001 10001 10101 10101 01010',
        'x 00000 00000 10001 01010 00100 01010 10001',
        'y 10001 10001 10001 10001 01111 00001 01110',
        'z 00000 00000 11111 00010 00100 01000 11111',
        '{ 00110 00100 00100 01000 00100 00100 00110',
        '| 00100 00100 00100 00100 00100 00100 00100',
        '} 01100 00100 00100 00010 00100 00100 01100',
        '~ 00000 00000 01000 10101 00010 00000 00000',
    ].map(line => [line[0], line.slice(2).split(' ')]));

    // Dialogue uses a few typographic characters; map them onto ASCII before glyph lookup.
    const FOLD = { '…': '...', '’': "'", '‘': "'", '“': '"', '”': '"', '–': '-', '—': '-' };
    const fold = (str) => String(str).replace(/[…’‘“”–—]/g, ch => FOLD[ch]);

    const textWidth = (str) => Math.max(0, str.length * ADVANCE - 1);

    const spriteCache = new Map();

    // Pre-renders a line of text with its 1 px black outline; the outline is only ever drawn here.
    function textSprite(str, colour, outline = true) {
        const key = outline ? `${str}|${colour}` : `${str}|${colour}|plain`;
        let sprite = spriteCache.get(key);
        if (sprite) return sprite;
        if (spriteCache.size > 1500) spriteCache.clear();
        const [canvas, ctx] = makeLayer(textWidth(str) + 2, LINE_H + 2);
        const pixels = [];
        [...str].forEach((ch, n) => {
            const rows = FONT[ch] || FONT['?'];
            const drop = DESCENDERS.has(ch) ? 2 : 0;
            rows.forEach((row, ry) => {
                for (let rx = 0; rx < GLYPH_W; rx++) {
                    if (row[rx] === '1') pixels.push([1 + n * ADVANCE + rx, 1 + drop + ry]);
                }
            });
        });
        if (outline) {
            ctx.fillStyle = PAL.black;
            for (const [px, py] of pixels) ctx.fillRect(px - 1, py - 1, 3, 3);
        }
        ctx.fillStyle = colour;
        for (const [px, py] of pixels) ctx.fillRect(px, py, 1, 1);
        spriteCache.set(key, canvas);
        return canvas;
    }

    // Greedy word wrap to a pixel width; a word longer than the width is split.
    function wrapText(str, maxWidth) {
        const maxChars = Math.max(1, Math.floor((maxWidth + 1) / ADVANCE));
        const lines = [];
        for (const para of str.split('\n')) {
            let line = '';
            for (let word of para.split(' ')) {
                while (word.length > maxChars) {
                    if (line) { lines.push(line); line = ''; }
                    lines.push(word.slice(0, maxChars));
                    word = word.slice(maxChars);
                }
                if (!line) line = word;
                else if (line.length + 1 + word.length <= maxChars) line += ` ${word}`;
                else { lines.push(line); line = word; }
            }
            lines.push(line);
        }
        return lines;
    }

    // Draws wrapped text on the text layer and returns the number of lines.
    function drawText(str, x, y, colour, { align = 'left', maxWidth = Infinity, scale = 1, outline = true } = {}) {
        const lines = wrapText(fold(str), maxWidth / scale);
        lines.forEach((line, n) => {
            if (!line) return;
            const sprite = textSprite(line, colour, outline);
            const width = textWidth(line) * scale;
            const left = align === 'center' ? x - Math.round(width / 2) : align === 'right' ? x - width : x;
            tx.drawImage(sprite, Math.round(left) - scale, Math.round(y + n * LINE_H * scale) - scale,
                sprite.width * scale, sprite.height * scale);
        });
        return lines.length;
    }

    const nameCache = new Map();
    const [, measureCtx] = makeLayer(1, 1);
    measureCtx.font = '9px monospace';

    // A name split into runs: consecutive bitmap-font characters in one run, every other character on its own.
    function nameRuns(name) {
        const runs = [];
        for (const ch of fold(DuelCore.displayName(name))) {
            const last = runs[runs.length - 1];
            if (FONT[ch]) {
                if (last && last.glyphs) last.text += ch; else runs.push({ glyphs: true, text: ch });
            } else {
                runs.push({ glyphs: false, text: ch });
            }
        }
        return runs;
    }

    // A pirate's name as one cached sprite ({ canvas, width }), laid out like textSprite (1 px margin).
    // Accents are stripped; any other character without a glyph is drawn with fillText on the sprite's
    // own context, so the text layer's state is never touched.
    function nameSprite(name, colour, outline = true) {
        const key = `${name}|${colour}|${outline}`;
        let entry = nameCache.get(key);
        if (entry) return entry;
        if (nameCache.size > 400) nameCache.clear();
        const parts = nameRuns(name).map(run => run.glyphs
            ? { ...run, width: run.text.length * ADVANCE }
            : { ...run, width: Math.ceil(measureCtx.measureText(run.text).width) + 1 });
        const width = Math.max(0, parts.reduce((sum, part) => sum + part.width, 0) - (parts.length && parts[parts.length - 1].glyphs ? 1 : 0));
        const [canvas, c] = makeLayer(width + 2, LINE_H + 4);
        let cursor = 0;
        for (const part of parts) {
            if (part.glyphs) {
                c.drawImage(textSprite(part.text, colour, outline), cursor, 0);
            } else {
                c.font = '9px monospace';
                c.textBaseline = 'top';
                if (outline) {
                    c.lineJoin = 'round';
                    c.lineWidth = 2;
                    c.strokeStyle = PAL.black;
                    c.strokeText(part.text, cursor + 1, 1);
                }
                c.fillStyle = colour;
                c.fillText(part.text, cursor + 1, 1);
            }
            cursor += part.width;
        }
        entry = { canvas, width };
        nameCache.set(key, entry);
        return entry;
    }

    // The winner's banner: the name at BANNER_SCALE, built once. Bitmap glyphs are the usual sprite scaled up
    // with hard edges; any other character is drawn with fillText at banner size (not a 9 px glyph stretched),
    // so it stays crisp. Same margin as nameSprite, scaled: the canvas is content + 2 * BANNER_SCALE wide.
    const BANNER_SCALE = 3;
    const [, bannerMeasure] = makeLayer(1, 1);
    bannerMeasure.font = `${9 * BANNER_SCALE}px monospace`;
    function bannerSprite(name, colour) {
        const k = BANNER_SCALE;
        const parts = nameRuns(name).map(run => run.glyphs
            ? { ...run, width: run.text.length * ADVANCE * k }
            : { ...run, width: Math.ceil(bannerMeasure.measureText(run.text).width) + k });
        const last = parts[parts.length - 1];
        const width = Math.max(0, parts.reduce((sum, part) => sum + part.width, 0) - (last && last.glyphs ? k : 0));
        const [canvas, c] = makeLayer(width + 2 * k, (LINE_H + 4) * k);
        let cursor = 0;
        for (const part of parts) {
            if (part.glyphs) {
                const sprite = textSprite(part.text, colour, true);
                c.drawImage(sprite, cursor, 0, sprite.width * k, sprite.height * k);
            } else {
                c.font = `${9 * k}px monospace`;
                c.textBaseline = 'top';
                c.lineJoin = 'round';
                c.lineWidth = 2 * k;
                c.strokeStyle = PAL.black;
                c.strokeText(part.text, cursor + k, k);
                c.fillStyle = colour;
                c.fillText(part.text, cursor + k, k);
            }
            cursor += part.width;
        }
        return { canvas, width };
    }

    // Draws a pirate name on the text layer and returns its width.
    function drawName(name, x, y, colour, align = 'left', outline = true) {
        const { canvas, width } = nameSprite(name, colour, outline);
        const left = Math.round(align === 'center' ? x - width / 2 : align === 'right' ? x - width : x);
        tx.drawImage(canvas, left - 1, Math.round(y) - 1);
        return width;
    }

    // --- Game clock ---
    // `run` is the single clock the whole show hangs off. The director (startRun) lays the beats on it,
    // plus a time-sorted list of side-effect events that only this time-advance path ever fires.
    const run = { t: 0, speed: 1, beats: null, beatIdx: 0, events: [], eventIdx: 0 };
    let lastFrameAt = null;

    function advanceRun(dt) {
        run.t += Math.min(dt, 0.05) * run.speed;
        if (run.beats) {
            followTheme();
            runEvents();
        }
    }

    // --- Title card ---
    const seeded = (seed) => () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
    const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
    const bayer = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];
    const disc = (ctx, cx, cy, r) => {
        for (let dy = -r; dy <= r; dy++) {
            const dx = Math.floor(Math.sqrt(r * r + r - dy * dy));
            ctx.fillRect(cx - dx, cy + dy, dx * 2 + 1, 1);
        }
    };

    const harbour = { back: null, front: null, water: null, twinkle: [] };

    function buildHarbour() {
        const [back, b] = makeLayer(SCENE_W, SCENE_H);
        const rand = seeded(7);
        const px = (x, y, colour) => { b.fillStyle = colour; b.fillRect(x, y, 1, 1); };

        // Sky: bands that blend into each other through an ordered dither.
        const bands = [PAL.night0, PAL.night1, PAL.night2, PAL.navy, PAL.blue, PAL.sky];
        const bandH = HORIZON / bands.length;
        for (let y = 0; y <= HORIZON; y++) {
            const k = Math.min(bands.length - 1, Math.floor(y / bandH));
            b.fillStyle = bands[k];
            b.fillRect(0, y, SCENE_W, 1);
            const step = Math.floor(y - (k + 1) * bandH + 4);
            if (step >= 0 && k + 1 < bands.length) {
                for (let x = 0; x < SCENE_W; x++) if (bayer(x, y) < (step + 1) * 3) px(x, y, bands[k + 1]);
            }
        }

        // Moon, with a dithered halo.
        const moon = { x: 246, y: 34, r: 13 };
        for (let y = moon.y - 24; y <= moon.y + 24; y++) {
            for (let x = moon.x - 24; x <= moon.x + 24; x++) {
                const d = Math.hypot(x - moon.x, y - moon.y);
                if (d > moon.r && d < 22 && bayer(x, y) < (d < 17 ? 7 : 3)) px(x, y, PAL.navy);
            }
        }
        b.fillStyle = PAL.moon;
        disc(b, moon.x, moon.y, moon.r);
        for (let y = -moon.r; y <= moon.r; y++) {
            for (let x = -moon.r; x <= moon.r; x++) {
                if (Math.hypot(x, y) <= moon.r && Math.hypot(x + 3, y + 3) > 11.5) px(moon.x + x, moon.y + y, PAL.moonShade);
            }
        }
        b.fillStyle = PAL.moonShade;
        b.fillRect(moon.x + 4, moon.y - 5, 3, 2);
        b.fillRect(moon.x - 6, moon.y + 2, 2, 2);
        b.fillRect(moon.x + 1, moon.y + 6, 3, 1);
        b.fillRect(moon.x - 3, moon.y - 7, 2, 1);

        // Stars; a handful of them twinkle every frame.
        for (let n = 0; n < 80; n++) {
            const x = Math.floor(rand() * SCENE_W);
            const y = Math.floor(rand() * 78);
            if (Math.hypot(x - moon.x, y - moon.y) < 26) continue;
            const colour = [PAL.star, PAL.ice, PAL.sky][Math.floor(rand() * 3)];
            px(x, y, colour);
            if (n % 11 === 0) {
                b.fillStyle = PAL.ice;
                b.fillRect(x - 1, y, 3, 1);
                b.fillRect(x, y - 1, 1, 3);
                px(x, y, PAL.star);
            } else if (n % 5 === 0) {
                harbour.twinkle.push([x, y]);
            }
        }

        // Clouds drifting across the moon.
        const cloud = (x, y, w) => {
            b.fillStyle = PAL.navy;
            b.fillRect(x + 3, y, w - 6, 1);
            b.fillStyle = PAL.night2;
            b.fillRect(x, y + 1, w, 1);
            b.fillStyle = PAL.night1;
            b.fillRect(x + 4, y + 2, w - 8, 1);
        };
        cloud(222, 40, 44);
        cloud(40, 30, 36);
        cloud(120, 56, 30);

        // The Isle of Legacy Code: a hill with a crumbling watchtower, and a small islet.
        const hill = (x) => Math.max(0, Math.round(34 * Math.cos(((x - 262) / 72) * Math.PI / 2)));
        const islet = (x) => Math.max(0, Math.round(9 * Math.cos(((x - 70) / 34) * Math.PI / 2)));
        for (let x = 0; x < SCENE_W; x++) {
            const h = Math.abs(x - 262) < 72 ? hill(x) : Math.abs(x - 70) < 34 ? islet(x) : 0;
            if (!h) continue;
            b.fillStyle = PAL.ink;
            b.fillRect(x, HORIZON - h, 1, h + 1);
            px(x, HORIZON - h, PAL.night2);
        }
        b.fillStyle = PAL.ink;
        b.fillRect(255, 46, 14, 26);
        for (let x = 255; x < 269; x += 4) b.fillRect(x, 43, 3, 3);
        b.fillRect(262, 40, 2, 4);
        b.fillRect(270, 56, 8, 16);
        b.fillRect(270, 53, 3, 3);
        b.fillRect(249, 60, 6, 12);
        px(258, 54, PAL.lantern);
        px(258, 55, PAL.lantern);
        px(264, 62, PAL.flame);
        px(264, 63, PAL.lantern);
        px(272, 62, PAL.lantern);
        for (const [x, lean] of [[214, -1], [221, 1], [304, -1]]) {
            const top = HORIZON - hill(x) - 9;
            b.fillStyle = PAL.ink;
            b.fillRect(x, top + 1, 1, 9);
            b.fillRect(x + lean, top - 1, 1, 2);
            for (const [dx, dy] of [[-3, 1], [-2, 0], [2, 0], [3, 1], [-1, -1], [1, -1], [0, -2]]) b.fillRect(x + dx, top + dy, 1, 1);
        }

        // A far-off ship riding at anchor.
        const ship = (x, y, w, h) => b.fillRect(150 + x, y, w, h);
        b.fillStyle = PAL.ink;
        ship(0, 98, 26, 3);
        ship(3, 101, 20, 2);
        ship(23, 95, 4, 3);
        ship(8, 74, 1, 24);
        ship(17, 80, 1, 18);
        ship(3, 78, 11, 14);
        ship(12, 83, 9, 11);
        px(174, 99, PAL.lantern);
        px(175, 99, PAL.flame);

        // Foreground: the dock, with a barrel and a lantern post.
        const [front, f] = makeLayer(SCENE_W, SCENE_H);
        const fpx = (x, y, colour) => { f.fillStyle = colour; f.fillRect(x, y, 1, 1); };
        for (const x of [6, 38, 70, 102]) {
            f.fillStyle = PAL.wood0;
            f.fillRect(x, 150, 5, 30);
            f.fillStyle = PAL.wood1;
            f.fillRect(x, 150, 1, 30);
        }
        f.fillStyle = PAL.wood2;
        f.fillRect(0, 142, 128, 6);
        f.fillStyle = PAL.wood3;
        f.fillRect(0, 142, 128, 1);
        f.fillStyle = PAL.wood1;
        for (let x = 6; x < 128; x += 11) f.fillRect(x, 143, 1, 5);
        f.fillRect(0, 148, 128, 5);
        f.fillStyle = PAL.wood0;
        f.fillRect(0, 153, 128, 2);
        for (let x = 4; x < 128; x += 16) fpx(x, 150, PAL.wood2);
        // Barrel.
        f.fillStyle = PAL.wood2;
        f.fillRect(18, 126, 15, 16);
        f.fillRect(19, 124, 13, 2);
        f.fillStyle = PAL.wood3;
        f.fillRect(20, 126, 2, 16);
        f.fillStyle = PAL.greyDark;
        f.fillRect(18, 129, 15, 1);
        f.fillRect(18, 137, 15, 1);
        f.fillStyle = PAL.wood0;
        f.fillRect(32, 126, 1, 16);
        f.fillRect(19, 124, 13, 1);
        // Lantern post and its glow.
        const lamp = { x: 118, y: 109 };
        for (let y = lamp.y - 20; y <= lamp.y + 20; y++) {
            for (let x = lamp.x - 20; x <= lamp.x + 20; x++) {
                const d = Math.hypot(x - lamp.x, y - lamp.y);
                if (d > 4 && d < 19 && bayer(x, y) < (d < 10 ? 6 : d < 15 ? 3 : 1)) fpx(x, y, PAL.ember);
            }
        }
        f.fillStyle = PAL.wood0;
        f.fillRect(lamp.x, 104, 2, 39);
        f.fillRect(lamp.x - 6, 101, 8, 1);
        f.fillRect(lamp.x - 5, 102, 1, 2);
        f.fillStyle = PAL.black;
        f.fillRect(lamp.x - 7, 104, 8, 9);
        f.fillStyle = PAL.lantern;
        f.fillRect(lamp.x - 6, 105, 6, 7);

        // Water: runs of 1 px strips, grouped by ramp position so each group is a single Path2D.
        const water = [WATER, MOONLIT].map(ramp => ramp.map(() => new Path2D()));
        for (let y = HORIZON + 1; y < SCENE_H; y++) {
            const depth = (y - HORIZON) / (SCENE_H - HORIZON);
            let x = Math.floor(rand() * 6);
            while (x < SCENE_W) {
                const w = 2 + Math.floor(rand() * (4 + depth * 14));
                const mid = x + w / 2;
                const lit = Math.abs(mid - moon.x) < 5 + depth * 18 && rand() < 0.8;
                const i = (Math.floor(y / 2) + Math.floor(rand() * 3)) % WATER.length;
                water[lit ? 1 : 0][i].rect(x, y, w, 1);
                x += w + 1 + Math.floor(rand() * (3 + depth * 5));
            }
        }

        Object.assign(harbour, { back, front, water });
    }

    function drawTitleCard(t) {
        drawHarbour(t);
        const cx = TEXT_W / 2;
        drawTitleWord(cx, 52, 4);
        drawText('The Tournament of Insults', cx, 112, PAL.parchment, { align: 'center', scale: 2 });
        drawText('Isle of Legacy Code', cx, 136, PAL.ice, { align: 'center', scale: 2 });
    }

    // "SWASHBUCKLE!" with a chunky outline and a lower edge built from plain sprites; y is its top.
    function drawTitleWord(cx, y, scale) {
        const o = scale / 2;
        for (const [ox, oy] of [[-o, 0], [o, 0], [0, -o], [0, o], [-o, -o], [o, -o], [-o, o], [o, o]]) {
            drawText('SWASHBUCKLE!', cx + ox, y + oy, PAL.black, { align: 'center', scale, outline: false });
        }
        drawText('SWASHBUCKLE!', cx, y + o, PAL.ember, { align: 'center', scale, outline: false });
        drawText('SWASHBUCKLE!', cx, y, PAL.gold, { align: 'center', scale, outline: false });
    }

    // The moonlit harbour behind the title, on the scene layer.
    function drawHarbour(t) {
        if (!harbour.back) buildHarbour();
        sx.drawImage(harbour.back, 0, 0);
        for (const [n, [x, y]] of harbour.twinkle.entries()) {
            sx.fillStyle = Math.sin(t * 2.4 + n * 1.7) > 0.3 ? PAL.star : PAL.sky;
            sx.fillRect(x, y, 1, 1);
        }
        sx.fillStyle = PAL.night2;
        sx.fillRect(0, HORIZON + 1, SCENE_W, SCENE_H - HORIZON - 1);
        [WATER, MOONLIT].forEach((ramp, r) => {
            ramp.forEach((_, i) => {
                sx.fillStyle = waterColour(i, t, ramp);
                sx.fill(harbour.water[r][i]);
            });
        });
        sx.drawImage(harbour.front, 0, 0);
        // The lantern flame flickers.
        const flicker = Math.floor(t * 9) % 3;
        sx.fillStyle = [PAL.flame, PAL.lantern, PAL.flame][flicker];
        sx.fillRect(114, 107 + (flicker === 1 ? 1 : 0), 2, 4 - (flicker === 1 ? 1 : 0));
        sx.fillStyle = PAL.white;
        sx.fillRect(114, 109, 1, 1);
    }

    // --- Sprite helpers ---
    // All of this is static art, built once at prewarm and then only blitted. Scenery randomness comes
    // from `seeded`, never from the game's RNG, so the art is stable and says nothing about the draw.
    const ROPE = '#a08a5a';

    const box = (c, colour, x, y, w = 1, h = 1) => {
        c.fillStyle = colour;
        c.fillRect(x, y, w, h);
    };

    const rope = (c, colour, x0, y0, x1, y1, sag = 0) => {
        const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
        c.fillStyle = colour;
        for (let k = 0; k <= n; k++) {
            const u = k / n;
            c.fillRect(Math.round(x0 + (x1 - x0) * u), Math.round(y0 + (y1 - y0) * u + sag * 4 * u * (1 - u)), 1, 1);
        }
    };

    const frameRect = (c, colour, x, y, w, h, t = 1) => {
        box(c, colour, x, y, w, t);
        box(c, colour, x, y + h - t, w, t);
        box(c, colour, x, y, t, h);
        box(c, colour, x + w - t, y, t, h);
    };

    const glow = (c, cx, cy, r, colour, keep = () => true) => {
        for (let y = cy - r; y <= cy + r; y++) {
            for (let x = cx - r; x <= cx + r; x++) {
                const d = Math.hypot(x - cx, y - cy);
                if (d > 2 && d < r && bayer(x, y) < (d < r * 0.5 ? 6 : d < r * 0.8 ? 3 : 1) && keep(x, y)) box(c, colour, x, y);
            }
        }
    };

    // A 5x8 lantern; returns where its flame flickers.
    const lantern = (c, x, y) => {
        box(c, PAL.black, x + 1, y, 3, 1);
        box(c, PAL.black, x, y + 1, 5, 6);
        box(c, PAL.lantern, x + 1, y + 2, 3, 4);
        box(c, PAL.flame, x + 2, y + 3, 1, 2);
        box(c, PAL.black, x + 1, y + 7, 3, 1);
        return [x + 2, y + 3];
    };

    const barrel = (c, x, y, w, h) => {
        box(c, PAL.wood2, x, y + 1, w, h - 1);
        box(c, PAL.wood2, x - 1, y + 3, w + 2, h - 6);
        box(c, PAL.wood1, x + 1, y, w - 2, 1);
        box(c, PAL.wood3, x + 2, y + 1, 2, h - 2);
        box(c, PAL.wood0, x + w - 2, y + 1, 1, h - 1);
        box(c, PAL.greyDark, x - 1, y + 3, w + 2, 1);
        box(c, PAL.greyDark, x - 1, y + h - 4, w + 2, 1);
        box(c, PAL.wood0, x, y + h - 1, w, 1);
    };

    const crate = (c, x, y, s) => {
        box(c, PAL.wood1, x, y, s, s);
        box(c, PAL.wood3, x + 1, y + 1, s - 2, s - 2);
        frameRect(c, PAL.wood2, x + 1, y + 1, s - 2, s - 2);
        rope(c, PAL.wood2, x + 1, y + 1, x + s - 2, y + s - 2);
        rope(c, PAL.wood2, x + 1, y + s - 2, x + s - 2, y + 1);
        box(c, PAL.wood0, x, y + s - 1, s, 1);
    };

    function drawMoon(c, mx, my, r) {
        const halo = Math.round(r * 1.7);
        for (let y = my - halo; y <= my + halo; y++) {
            for (let x = mx - halo; x <= mx + halo; x++) {
                const d = Math.hypot(x - mx, y - my);
                if (d > r && d < halo && bayer(x, y) < (d < r * 1.3 ? 7 : 3)) box(c, PAL.navy, x, y);
            }
        }
        c.fillStyle = PAL.moon;
        disc(c, mx, my, r);
        for (let dy = -r; dy <= r; dy++) {
            for (let dx = -r; dx <= r; dx++) {
                if (dx * dx + dy * dy <= r * r + r && Math.hypot(dx + r * 0.25, dy + r * 0.25) > r * 0.9) box(c, PAL.moonShade, mx + dx, my + dy);
            }
        }
        const k = r / 13;
        for (const [x, y, w, h] of [[4, -5, 3, 2], [-6, 2, 2, 2], [1, 6, 3, 1], [-3, -7, 2, 1], [7, 3, 2, 2], [-8, -3, 1, 1]]) {
            box(c, PAL.moonShade, Math.round(mx + x * k), Math.round(my + y * k), Math.max(1, Math.round(w * k)), Math.max(1, Math.round(h * k)));
        }
    }

    // Dithered night sky down to the horizon, a moon and stars; returns the stars that twinkle.
    function nightSky(c, rand, horizon, moon, count = 70) {
        const bands = [PAL.night0, PAL.night1, PAL.night2, PAL.navy, PAL.blue, PAL.sky];
        const bandH = horizon / bands.length;
        for (let y = 0; y <= horizon; y++) {
            const k = Math.min(bands.length - 1, Math.floor(y / bandH));
            box(c, bands[k], 0, y, SCENE_W, 1);
            const step = Math.floor(y - (k + 1) * bandH + 4);
            if (step >= 0 && k + 1 < bands.length) {
                for (let x = 0; x < SCENE_W; x++) if (bayer(x, y) < (step + 1) * 3) box(c, bands[k + 1], x, y);
            }
        }
        if (moon) drawMoon(c, moon.x, moon.y, moon.r);
        const twinkle = [];
        for (let n = 0; n < count; n++) {
            const x = Math.floor(rand() * SCENE_W);
            const y = Math.floor(rand() * horizon * 0.72);
            if (moon && Math.hypot(x - moon.x, y - moon.y) < moon.r * 1.8 + 3) continue;
            box(c, [PAL.star, PAL.ice, PAL.sky][Math.floor(rand() * 3)], x, y);
            if (n % 11 === 0) {
                box(c, PAL.ice, x - 1, y, 3, 1);
                box(c, PAL.ice, x, y - 1, 1, 3);
                box(c, PAL.star, x, y);
            } else if (n % 5 === 0) {
                twinkle.push([x, y]);
            }
        }
        return twinkle;
    }

    const cloud = (c, x, y, w) => {
        box(c, PAL.navy, x + 3, y, w - 6, 1);
        box(c, PAL.night2, x, y + 1, w, 1);

    };

    // Water as 1 px strips grouped by ramp position (one Path2D each), like the title card; strips near
    // moonX use the moonlit ramp. The foreground layer is drawn over them, so they can run under it.
    const RAMPS = [WATER, MOONLIT];
    function waterPaths(rand, top, bottom, x0, x1, moonX = null, spread = 18) {
        const paths = RAMPS.map(ramp => ramp.map(() => new Path2D()));
        for (let y = top; y < bottom; y++) {
            const depth = (y - top) / Math.max(1, bottom - top);
            let x = x0 + Math.floor(rand() * 6);
            while (x < x1) {
                const w = Math.min(2 + Math.floor(rand() * (4 + depth * 14)), x1 - x);
                const lit = moonX !== null && Math.abs(x + w / 2 - moonX) < 5 + depth * spread && rand() < 0.8;
                const i = (Math.floor(y / 2) + Math.floor(rand() * 3)) % WATER.length;
                paths[lit ? 1 : 0][i].rect(x, y, w, 1);
                x += w + 1 + Math.floor(rand() * (3 + depth * 5));
            }
        }
        return paths;
    }

            torso: [17, 17], head: [16, 8], face: 'shout', sword: -2.2,
            legs: [[[19, 27], [16, 31], [14, 35]], [[23, 27], [27, 31], [29, 35]]],
            back: [[18, 19], [14, 17], [11, 14]], arm: [[25, 19], [28, 15], [29, 11]],
        },
        wobble: {

            legs: [[[21, 26], [21, 31], [21, 35]], [[25, 26], [29, 29], [29, 32]]],
            back: [[20, 18], [16, 15], [13, 11]], arm: [[27, 18], [31, 16], [34, 18]],
        },
        falling: {
            torso: [19, 16], head: [19, 7], face: 'shout', sword: 0.5,
            legs: [[[21, 26], [19, 31], [18, 35]], [[25, 26], [28, 30], [31, 33]]],
            back: [[20, 18], [17, 13], [16, 8]], arm: [[27, 18], [30, 13], [31, 8]],
        },
        limp: {
            torso: [19, 16], head: [21, 7], face: 'head', sword: 0.5,
            legs: [[[21, 26], [21, 31], [21, 35]], [[24, 26], [24, 31], [24, 35]]],
            back: [[20, 18], [23, 21], [26, 23]], arm: [[27, 18], [30, 21], [33, 22]],
        },
        // At the ship's wheel: both hands forward on its spokes (the sword is put away).
        helm: {
            torso: [19, 16], head: [21, 7], face: 'head', sword: 0, unarmed: true,
            legs: [[[21, 26], [20, 31], [19, 35]], [[25, 26], [26, 31], [27, 35]]],
            back: [[20, 18], [26, 21], [32, 20]], arm: [[27, 18], [31, 18], [35, 15]],
        },
        // Cheering: both arms up, mouth open, the cutlass raised high.
        cheer: {
            torso: [19, 16], head: [21, 7], face: 'shout', sword: -1.15,
            legs: [[[21, 26], [19, 31], [18, 35]], [[25, 26], [27, 31], [28, 35]]],
            back: [[20, 18], [17, 13], [15, 8]], arm: [[27, 18], [31, 14], [33, 10]],
        },
    };
    // fall: tipping over backwards; facedown: flat out, face to the floor (or table).
    const ROTATED = { fall: ['falling', -0.7], facedown: ['limp', Math.PI / 2] };
    const SWORD_LEN = 11;
    const PEG = ['#a8703a', '#e0b070'];

    const grid = (w, h) => ({ w, h, px: new Array(w * h).fill(null) });
    const cell = (g, x, y, colour) => {
        x = Math.round(x);
        y = Math.round(y);
        if (colour && x >= 0 && y >= 0 && x < g.w && y < g.h) g.px[y * g.w + x] = colour;
    };
    const stampMap = (g, rows, ox, oy, legend) => rows.forEach((row, y) => {
        for (let x = 0; x < row.length; x++) cell(g, ox + x, oy + y, legend[row[x]]);
    });
    const brush = (g, x, y, w, colour) => {
        const o = (w - 1) >> 1;
        for (let dy = 0; dy < w; dy++) for (let dx = 0; dx < w; dx++) cell(g, x - o + dx, y - o + dy, colour);
    };
    const stroke = (g, pts, w, colour) => {
        for (let i = 1; i < pts.length; i++) {
            const [ax, ay] = pts[i - 1];
            const [bx, by] = pts[i];
            const n = Math.max(Math.abs(bx - ax), Math.abs(by - ay), 1);
            for (let k = 0; k <= n; k++) brush(g, Math.round(ax + (bx - ax) * k / n), Math.round(ay + (by - ay) * k / n), w, colour);
        }
    };
    const inkOutline = (g) => {
        const out = g.px.slice();
        const filled = (x, y) => x >= 0 && y >= 0 && x < g.w && y < g.h && g.px[y * g.w + x];
        for (let y = 0; y < g.h; y++) {
            for (let x = 0; x < g.w; x++) {
                if (!g.px[y * g.w + x] && (filled(x - 1, y) || filled(x + 1, y) || filled(x, y - 1) || filled(x, y + 1))) out[y * g.w + x] = PAL.ink;
            }
        }
        g.px = out;
        return g;
    };
    const paintGrid = (g) => {
        const [canvas, c] = makeLayer(g.w, g.h);
        g.px.forEach((colour, i) => { if (colour) box(c, colour, i % g.w, Math.floor(i / g.w)); });
        return canvas;
    };

    // Returns the grid plus marks (continuous cell coords): the sword hand, the blade tip and the hat top.
    function composePirate(look, pose, legend) {
        if (pose.unarmed) look = { ...look, unarmed: true };
        const g = grid(PIRATE_W, PIRATE_H);
        const limb = (pts) => {
            stroke(g, pts, 3, legend.c);
            stroke(g, pts, 2, legend.C);
        };
        pose.legs.forEach(([hip, knee, ankle], i) => {
            const legPts = look.peg && i === 1 ? [hip, knee] : [hip, knee, ankle];
            stroke(g, legPts, 3, legend.l);
            stroke(g, legPts, 2, legend.L);
            if (look.peg && i === 1) {
                brush(g, knee[0], knee[1] + 1, 3, legend.b);
                stroke(g, [[knee[0], knee[1] + 2], [ankle[0], ankle[1] + 3]], 2, PEG[0]);
                stroke(g, [[knee[0] + 1, knee[1] + 2], [ankle[0] + 1, ankle[1] + 3]], 1, PEG[1]);
                brush(g, ankle[0], ankle[1] + 4, 2, PAL.grey);
            } else {
                stampMap(g, PIRATE_MAPS.boot, ankle[0] - 2, ankle[1], legend);
            }
        });
        limb(pose.back);
        brush(g, pose.back[2][0], pose.back[2][1], 2, legend.S);

        const [hx0, hy0] = pose.head;
        stampMap(g, PIRATE_MAPS.torso, pose.torso[0], pose.torso[1], legend);
        stampMap(g, PIRATE_MAPS[pose.face], hx0, hy0, legend);
        stampMap(g, PIRATE_MAPS.beard[look.beard], hx0, hy0, legend);
        if (look.patch) stampMap(g, PIRATE_MAPS.patch, hx0, hy0, legend);
        const hat = PIRATE_MAPS.hat[look.hat];
        stampMap(g, hat.rows, hx0 + hat.dx, hy0 + hat.dy, legend);

        limb(pose.arm);
        const [, [ex, ey], [hx, hy]] = pose.arm;
        const len = Math.hypot(hx - ex, hy - ey) || 1;
        brush(g, Math.round(hx - (hx - ex) / len * 1.5), Math.round(hy - (hy - ey) / len * 1.5), 2, legend.w);
        // The cutlass: a two-tone blade curving back towards its spine, a gold guard and pommel.
        // (look.unarmed leaves it out, once a gag has sent it flying.)
        const cx = hx + 0.5, cy = hy + 0.5;
        const dx = Math.cos(pose.sword), dy = Math.sin(pose.sword);
        const nx = dy, ny = -dx;
        let tip = { x: cx, y: cy };
        for (let s = 1.5; s <= SWORD_LEN; s += 0.5) {
            const bend = (s / SWORD_LEN) ** 2 * 2;
            const x = cx + dx * s + nx * bend, y = cy + dy * s + ny * bend;
            if (!look.unarmed) cell(g, x, y, legend.X);
            if (!look.unarmed && s < SWORD_LEN - 1.5) cell(g, x + nx, y + ny, legend.x);
            tip = { x, y };
        }
        if (!look.unarmed) {
            for (let k = -1.5; k <= 1.5; k += 0.5) cell(g, cx + dx * 1.5 + nx * k, cy + dy * 1.5 + ny * k, legend.g);
            cell(g, cx - dx * 1.5, cy - dy * 1.5, legend.G);
        }
        brush(g, hx, hy, 2, legend.S);
        cell(g, hx, hy + 1, legend.s);
        return { g, marks: { hand: { x: cx, y: cy }, tip, top: hy0 - 7 } };
    }

    // Nearest-neighbour rotation about the grid centre, then re-seated: centred on the anchor, resting on the floor.
    function rotatePirate({ g, marks }, angle) {
        const big = grid(96, 96);
        const cos = Math.cos(angle), sin = Math.sin(angle);
        for (let y = 0; y < big.h; y++) {
            for (let x = 0; x < big.w; x++) {
                const rx = x + 0.5 - 48, ry = y + 0.5 - 48;
                const sx0 = Math.floor(rx * cos + ry * sin + g.w / 2), sy0 = Math.floor(-rx * sin + ry * cos + g.h / 2);
                if (sx0 >= 0 && sy0 >= 0 && sx0 < g.w && sy0 < g.h) big.px[y * big.w + x] = g.px[sy0 * g.w + sx0];
            }
        }
        let minX = big.w, maxX = -1, maxY = -1, minY = big.h;
        big.px.forEach((colour, i) => {
            if (!colour) return;
            const x = i % big.w, y = Math.floor(i / big.w);
            minX = Math.min(minX, x);
            maxX = Math.max(maxX, x);
            minY = Math.min(minY, y);
            maxY = Math.max(maxY, y);
        });
        const ox = Math.round(PIRATE_W / 2 - (minX + maxX + 1) / 2), oy = PIRATE_H - 1 - maxY;
        const out = grid(PIRATE_W, PIRATE_H);
        big.px.forEach((colour, i) => cell(out, i % big.w + ox, Math.floor(i / big.w) + oy, colour));
        const turn = ({ x, y }) => {
            const rx = x - g.w / 2, ry = y - g.h / 2;
            return { x: rx * cos - ry * sin + 48 + ox, y: rx * sin + ry * cos + 48 + oy };
        };
        return { g: out, marks: { hand: turn(marks.hand), tip: turn(marks.tip), top: minY + oy } };
    }

    function poseGrid(look, frame, legend = pirateLegend(look)) {
        const [base, angle] = ROTATED[frame] || [frame, 0];
        const posed = composePirate(look, POSES[base], legend);
        return angle ? rotatePirate(posed, angle) : posed;
    }

    // Right-facing frames for one look: { idle0: canvas, ... }.
    function buildPirate(look) {

    const mirrored = (src) => {

    // --- Parrot (the Admiral's; grumpy) ---

    // --- The Legacy Monolith (intro ship sprite, sailing right) ---
    const SHIP_W = 96;
    const SHIP_H = 72;
    // The bottom row is the waterline: blit at (x - SHIP_ANCHOR.x, waterY - SHIP_ANCHOR.y).
    const SHIP_ANCHOR = Object.freeze({ x: 48, y: 72 });
    let shipCanvas = null;

    function shipSprite() {
        if (shipCanvas) return shipCanvas;
        const [canvas, c] = makeLayer(SHIP_W, SHIP_H);
        const SAIL = ['#6a6858', '#a8a48c', '#d4ceb0'];
        for (const [x0, y0, x1, y1] of [[46, 3, 8, 44], [46, 3, 69, 9], [69, 9, 95, 41], [47, 3, 84, 50], [23, 15, 6, 42], [69, 9, 80, 50]]) {

        }
        rope(c, PAL.wood1, 82, 49, 95, 41);
        rope(c, PAL.wood1, 82, 50, 95, 42);
        // Jib, between the forestay and the bowsprit.
        for (let y = 13; y < 44; y++) {
            const right = Math.floor(69 + (y - 9) * 26 / 32) - 1;
            box(c, SAIL[2], 72, y, Math.max(0, right - 72), 1);
            box(c, SAIL[0], 72, y, 1, 1);
        }
        for (const [x, top, bottom] of [[23, 14, 44], [46, 2, 54], [69, 8, 50]]) {
            box(c, PAL.wood0, x, top, 2, bottom - top);
            box(c, PAL.wood2, x, top, 1, bottom - top);
        }
        // Square sails bellied by a following wind, each hung from a yard.
        const sail = (x, y, w, h) => {
            box(c, PAL.wood0, x - 2, y - 1, w + 4, 1);
            for (let k = 0; k < w; k++) {
                const belly = Math.round(2 * Math.sin(Math.PI * (k + 0.5) / w));
                box(c, k < w * 0.25 ? SAIL[0] : k > w * 0.75 ? SAIL[2] : SAIL[1], x + k, y, 1, h + belly);
                box(c, PAL.ink, x + k, y + h + belly, 1, 1);
            }
            box(c, SAIL[0], x, y + Math.floor(h / 2), w, 1);
            box(c, PAL.ink, x - 1, y, 1, h);
            box(c, PAL.ink, x + w, y, 1, h);
        };
        sail(36, 7, 21, 14);
        sail(33, 25, 27, 19);
        sail(61, 13, 17, 12);
        sail(59, 29, 21, 15);
        // Spanker on the mizzen.
        for (let y = 17; y < 42; y++) {
            const w = Math.round((y - 17) * 0.6);
            box(c, SAIL[1], 22 - w, y, w, 1);
            box(c, PAL.ink, 21 - w, y, 1, 1);
        }
        // Flag: black, with a skull.
        box(c, PAL.ink, 48, 0, 9, 6);
        box(c, PAL.white, 51, 1, 3, 2);
        box(c, PAL.white, 51, 3, 1, 1);
        box(c, PAL.white, 53, 3, 1, 1);
        box(c, PAL.ink, 57, 1, 2, 2);
        // Hull: high stern on the left, raised bow on the right.
        const top = (x) => x < 26 ? 42 : x < 72 ? 52 : 48;
        const left = (y) => 6 + Math.round((y - 42) * 0.35);
        const right = (y) => 86 - Math.round(((Math.max(y, 48) - 48) / 24) ** 2 * 12);
        for (let y = 42; y < SHIP_H; y++) {
            for (let x = left(y); x <= right(y); x++) {
                if (y < top(x)) continue;
                const strake = Math.floor((y - 42) / 3) % 2;
                box(c, y === top(x) ? PAL.wood3 : strake ? PAL.wood1 : PAL.wood0, x, y);
            }
        }
        for (let x = left(56); x <= right(56); x++) box(c, PAL.goldDark, x, 56);
        for (let x = left(57); x <= right(57); x++) box(c, PAL.gold, x, 57);
        for (let x = 30; x < 70; x += 9) {
            box(c, PAL.ink, x, 60, 4, 3);
            box(c, PAL.lantern, x + 1, 61, 2, 1);
        }
        box(c, PAL.goldDark, 8, 44, 16, 7);
        for (let k = 0; k < 4; k++) box(c, k % 2 ? PAL.lantern : PAL.flame, 9 + k * 4, 45, 2, 4);
        // Rail posts along the waist, and a stern lantern.
        for (let x = 28; x < 72; x += 4) box(c, PAL.wood0, x, 49, 1, 3);
        box(c, PAL.wood3, 27, 49, 45, 1);
        box(c, PAL.wood0, 6, 33, 1, 9);
        box(c, PAL.black, 3, 29, 5, 5);
        box(c, PAL.flame, 4, 30, 3, 3);
        return shipCanvas = canvas;
    }

    // --- Scenes ---
    // Each scene caches a back layer (sky, far scenery), water strips and a front layer drawn over the water.
    // backdrop(location) / introBackdrop(which) return the composed static 320x180 canvas (water at t = 0);
    // per frame, blit it and then call drawWater(key, t) to twinkle stars, cycle the water and flicker flames.
    const SCENES = {};
    const SCENE_SEEDS = { dock: 11, tavern: 23, cliff: 37, plank: 41, sea: 53, cabin: 67, deck: 79 };

    // Where things stand: pirates' boots rest on floorY - 1 (blit with PIRATE_ANCHOR) at leftX / rightX.
    // splashY is the water surface for splashes; the other fields locate props for the gags and intro.
    const STAGE = Object.freeze({

            perch: { x: 44, y: 100 },
        },
        // The winner stands at helmX on the quarterdeck (floorY), facing the wheel; the crew stand on the main

        deck: {

    function sceneDock(b, f, rand, s) {
        const horizon = 96;
        s.twinkle = nightSky(b, rand, horizon, { x: 156, y: 34, r: 11 });
        cloud(b, 130, 44, 40);
        cloud(b, 250, 24, 34);
        // The far shore: a hilly town with lit windows on the right, an old fort on the left.
        for (let x = 0; x < SCENE_W; x++) {
            const town = x > 196 ? 8 + Math.round(5 * Math.sin(x / 17) + 2 * Math.sin(x / 6.1)) : 0;
            const fort = Math.abs(x - 40) < 34 ? Math.round(7 * Math.cos(((x - 40) / 34) * Math.PI / 2)) : 0;
            const h = Math.max(town, fort);
            if (!h) continue;
            box(b, PAL.ink, x, horizon - h, 1, h + 1);
            box(b, PAL.night2, x, horizon - h, 1, 1);
        }
        for (let x = 204; x < SCENE_W - 6; x += 10 + Math.floor(rand() * 6)) {
            const w = 5 + Math.floor(rand() * 4), h = 6 + Math.floor(rand() * 8);
            const top = horizon - 9 - h + Math.floor(rand() * 4);
            box(b, PAL.ink, x, top, w, horizon - top);
            for (let r = 1; r <= w >> 1; r++) box(b, PAL.ink, x + r, top - r, w - 2 * r, 1);
            for (let k = 0; k < 2; k++) {
                if (rand() < 0.7) box(b, rand() < 0.5 ? PAL.lantern : PAL.flame, x + 1 + Math.floor(rand() * (w - 2)), top + 2 + Math.floor(rand() * (h - 3)));
            }
        }
        box(b, PAL.ink, 32, horizon - 22, 12, 16);
        for (let x = 32; x < 44; x += 3) box(b, PAL.ink, x, horizon - 24, 2, 2);
        box(b, PAL.ink, 44, horizon - 14, 8, 8);
        box(b, PAL.lantern, 37, horizon - 16);
        box(b, PAL.ink, 38, horizon - 30, 1, 8);
        box(b, PAL.red, 39, horizon - 30, 3, 2);
        box(b, PAL.night2, 0, horizon + 1, SCENE_W, SCENE_H - horizon - 1);
        s.water = waterPaths(rand, horizon + 1, SCENE_H, 0, SCENE_W, 156);

        // Boathouse, with a lean-to roof, a lit window, a door and a lifebuoy.
        for (let x = 0; x < 56; x += 6) {
            box(f, (x / 6) % 2 ? PAL.wood1 : PAL.wood2, x, 56, 6, 78);
            box(f, PAL.wood0, x, 56, 1, 78);
        }
        for (let x = 0; x < 62; x++) {
            const top = 38 + Math.round(x * 16 / 60);
            box(f, PAL.ink, x, top, 1, 60 - top);
            box(f, PAL.greyDark, x, top, 1, 1);
            for (let y = top + 2; y < 60; y += 3) box(f, PAL.wood0, x, y, 1, 1);

    // A red lifebuoy with white bands.
    function lifebuoy(c, x, y, r = 6, inner = 3) {
        c.fillStyle = PAL.red;

        box(c, PAL.white, x - r, y - 1, 2, 3);
        box(c, PAL.white, x + r - 1, y - 1, 2, 3);
        box(c, PAL.white, x - 1, y - r, 3, 2);
        box(c, PAL.white, x - 1, y + r - 1, 3, 2);
        c.fillStyle = PAL.wood1;
        disc(c, x, y, inner);

    function sceneTavern(b, f, rand, s) {

        box(f, PAL.wood0, 110, 28, 100, 20);
        box(f, PAL.wood2, 111, 29, 98, 18);

        box(f, PAL.wood3, 254, 63, 17, 2);

        for (const { x, y } of STAGE.tavern.tables) {

    function sceneCliff(b, f, rand, s) {
        const horizon = 104;
        s.twinkle = nightSky(b, rand, horizon, { x: 236, y: 36, r: 15 });
        cloud(b, 200, 52, 50);
        cloud(b, 60, 26, 40);
        // A far islet with a lighthouse.
        for (let x = 270; x < SCENE_W; x++) {
            const h = Math.round(7 * Math.cos(((x - 302) / 32) * Math.PI / 2));
            box(b, PAL.ink, x, horizon - h, 1, h + 1);
        }
        for (let y = horizon - 24; y < horizon - 5; y++) box(b, Math.floor(y / 4) % 2 ? PAL.white : PAL.red, 300, y, 4, 1);
        box(b, PAL.ink, 299, horizon - 28, 6, 4);
        box(b, PAL.ink, 301, horizon - 30, 2, 2);
        s.flames.push([301, horizon - 27]);
        box(b, PAL.night2, 0, horizon + 1, SCENE_W, SCENE_H - horizon - 1);
        s.water = waterPaths(rand, horizon + 1, SCENE_H, 0, SCENE_W, 236);

        // The headland: rock face with strata, moonlit on the right; grass on top; foam at the foot.
        const L = (y) => 34 - Math.round((y - 140) * 0.12) + ((y * 7) % 3);
        const R = (y) => 286 + Math.round((y - 140) * 0.12) - ((y * 5) % 3);
        const ROCK = '#3a3e4c';
        for (let y = 138; y < SCENE_H; y++) box(f, ROCK, L(y), y, R(y) - L(y), 1);
        // Overlapping slabs, lit from the moon above, fading into spray-dark towards the sea.
        for (let k = 0; k < 70; k++) {
            const w = 8 + Math.floor(rand() * 24), h = 5 + Math.floor(rand() * 9);
            const x = 38 + Math.floor(rand() * (244 - w)), y = 140 + Math.floor(rand() * 40);
            box(f, rand() < 0.5 ? PAL.greyDark : ROCK, x, y, w, h);
            box(f, PAL.grey, x + 1, y, w - 2, 1);
            box(f, PAL.ink, x, y + h - 1, w, 1);
            box(f, PAL.ink, x + w - 1, y + 1, 1, h - 1);
        }
        for (let y = 138; y < SCENE_H; y++) {
            const l = L(y), r = R(y);
            for (let x = l; x < r; x++) {
                if (bayer(x, y) < Math.max(0, (y - 150) / 2.5)) box(f, PAL.night1, x, y);
                if (x > r - 5 && bayer(x, y) < 8) box(f, PAL.grey, x, y);
                if (x < l + 4) box(f, PAL.ink, x, y);
            }
        }
        for (const [cx, dir] of [[L(176), -1], [R(176), 1]]) {
            for (let k = 0; k < 24; k++) {
                box(f, rand() < 0.5 ? PAL.white : PAL.ice, cx + dir * Math.floor(rand() * 10), 168 + Math.floor(rand() * 12), 1 + Math.floor(rand() * 3), 1);
            }
        }
        for (let y = 124; y < 141; y++) {
            const inset = y < 128 ? (128 - y) * 2 + 2 : 0;
            const l = 34 + inset, r = 286 - inset;
            box(f, PAL.green, l, y, r - l, 1);
            for (let x = l; x < r; x++) {
                if (y < 130 && bayer(x, y) < 6) box(f, PAL.leaf, x, y);
                if (y > 137 && bayer(x, y) < 5) box(f, '#1c4a20', x, y);
            }
        }
        for (let x = 40; x < 282; x += 2 + Math.floor(rand() * 4)) {
            box(f, PAL.leaf, x, 123 - Math.floor(rand() * 2), 1, 2);
            if (rand() < 0.4) box(f, PAL.green, x, 141, 1, 1 + Math.floor(rand() * 4));
        }
        for (let x = 52; x < 270; x++) {
            for (let y = 131; y < 136; y++) if (bayer(x, y) < (y === 131 || y === 135 ? 5 : 12)) box(f, (x + y) % 5 ? PAL.wood2 : PAL.wood3, x, y);
        }
        // A wind-bent tree, boulders and lantern posts.
        stroke2(f, [[48, 126], [50, 112], [56, 98], [66, 86], [80, 80]], 3, PAL.ink);
        stroke2(f, [[56, 98], [52, 88], [54, 78]], 2, PAL.ink);
        stroke2(f, [[66, 86], [70, 74], [78, 70]], 2, PAL.ink);
        stroke2(f, [[80, 80], [92, 78], [98, 82]], 1, PAL.ink);
        stroke2(f, [[72, 82], [86, 70], [94, 70]], 1, PAL.ink);
        stroke2(f, [[48, 124], [51, 110]], 1, PAL.wood0);
        for (const [x, y, w, h] of [[264, 116, 10, 9], [272, 119, 8, 6], [38, 119, 7, 6]]) {
            box(f, PAL.greyDark, x, y, w, h);
            box(f, PAL.grey, x + 1, y, w - 2, 1);
            box(f, PAL.grey, x + w - 1, y + 1, 1, h - 2);
            box(f, PAL.ink, x, y + h - 1, w, 1);
        }
        for (const x of [96, 226]) {
            glow(f, x - 4, 104, 20, PAL.ember);
            box(f, PAL.wood0, x, 96, 2, 32);
            box(f, PAL.wood0, x - 6, 96, 8, 1);
            s.flames.push(lantern(f, x - 7, 98));
        }
    }

    // Thick polyline on a canvas.
    function stroke2(c, pts, w, colour) {
        for (let i = 1; i < pts.length; i++) {
            const [ax, ay] = pts[i - 1];
            const [bx, by] = pts[i];
            const n = Math.max(Math.abs(bx - ax), Math.abs(by - ay), 1);
            for (let k = 0; k <= n; k++) box(c, colour, Math.round(ax + (bx - ax) * k / n) - (w >> 1), Math.round(ay + (by - ay) * k / n) - (w >> 1), w, w);
        }
    }

    // One ship's inner side, drawn on the left; the right ship is the same art mirrored.
    function shipSide(rand, trim, flag, patched) {
        const [canvas, c] = makeLayer(SCENE_W, SCENE_H);
        const flames = [];
        const edge = (y) => 60 + Math.round(8 * Math.sin(Math.min(1, (y - 100) / 40) * Math.PI / 2)) - (y > 140 ? Math.round((y - 140) ** 2 / 40) : 0);
        // Rigging behind the masts.
        for (const [x0, y0, x1, y1] of [[46, 6, 64, 92], [46, 6, 58, 92], [21, 22, 50, 92], [21, 22, 40, 92], [46, 6, 21, 22]]) rope(c, PAL.ink, x0, y0, x1, y1);
        for (let y = 20; y < 90; y += 7) rope(c, PAL.ink, 46 + Math.round((y - 6) * 18 / 86) - 5, y, 46 + Math.round((y - 6) * 18 / 86), y);
        for (const [x, top] of [[20, 14], [44, 0]]) {
            box(c, PAL.wood1, x, top, 4, 94 - top);
            box(c, PAL.wood2, x + 3, top, 1, 94 - top);
            box(c, PAL.wood0, x, top, 1, 94 - top);
            for (let y = top + 16; y < 90; y += 22) box(c, PAL.greyDark, x, y, 4, 1);
        }
        box(c, PAL.wood1, 40, 8, 12, 3);
        box(c, PAL.wood0, 40, 11, 12, 1);
        for (const [cx, y, w] of [[46, 22, 34], [46, 50, 40], [22, 32, 28], [22, 60, 32]]) {
            box(c, PAL.wood0, cx - w / 2, y, w, 2);
            for (let x = cx - w / 2 + 2; x < cx + w / 2 - 2; x++) {
                const h = 2 + Math.round(1.5 * Math.sin((x - cx) / 2.2));
                box(c, PAL.moonShade, x, y + 2, 1, h);
                box(c, PAL.parchmentDark, x, y + 1 + h, 1, 1);
            }
        }
        box(c, flag, 48, 0, 10, 6);
        box(c, PAL.white, 51, 1, 3, 2);
        box(c, PAL.white, 51, 3, 1, 1);
        box(c, PAL.white, 53, 3, 1, 1);
        // Bulwark and rail.
        box(c, PAL.wood1, 0, 92, 62, 8);
        box(c, PAL.wood3, 0, 92, 62, 2);
        for (let x = 4; x < 60; x += 6) box(c, PAL.wood0, x, 94, 1, 6);
        // Hull planks, rim-lit by the moon on the inner edge.
        for (let y = 100; y < 159; y++) {
            const e = edge(y);
            box(c, Math.floor((y - 100) / 4) % 2 ? PAL.wood1 : PAL.wood0, 0, y, e, 1);
            if ((y - 100) % 4 === 3) box(c, PAL.ink, 0, y, e, 1);
            box(c, PAL.wood3, e - 2, y, 1, 1);
            box(c, y < 130 ? PAL.moonShade : PAL.wood2, e - 1, y, 1, 1);
        }
        for (let y = 100; y < 156; y += 4) {
            for (let x = 4 + Math.floor(rand() * 20); x < edge(y) - 4; x += 18 + Math.floor(rand() * 14)) box(c, PAL.ink, x, y, 1, 3);
        }
        if (patched) {
            for (let k = 0; k < 7; k++) {
                const y = 104 + Math.floor(rand() * 48), x = 2 + Math.floor(rand() * 40), w = 6 + Math.floor(rand() * 8);
                box(c, rand() < 0.5 ? PAL.wood3 : PAL.wood2, x, y, w, 3);
                box(c, PAL.greyDark, x, y + 1, 1, 1);
                box(c, PAL.greyDark, x + w - 1, y + 1, 1, 1);
            }
        }
        for (let x = 0; x < edge(117); x++) {
            box(c, trim, x, 117, 1, 2);
            box(c, PAL.ink, x, 119, 1, 1);
        }
        // Gunports, a blank name board and the gangway where the plank goes in.
        for (const x of [12, 34]) {
            box(c, PAL.ink, x, 124, 7, 6);
            box(c, PAL.wood2, x - 1, 120, 9, 2);
            box(c, PAL.lantern, x + 2, 127, 2, 1);
        }
        if (patched) {
            rope(c, PAL.wood3, 34, 124, 40, 129);
            rope(c, PAL.wood3, 40, 124, 34, 129);
        }
        box(c, PAL.wood0, 8, 134, 46, 10);
        frameRect(c, trim, 8, 134, 46, 10);
        box(c, PAL.ink, 50, 104, 12, 10);
        box(c, PAL.wood0, 50, 104, 12, 1);
        for (let x = 4; x < 60; x += 3) box(c, PAL.ice, x + Math.floor(rand() * 2), 158 + Math.floor(rand() * 2), 2, 1);
        // Stern lantern on a bracket.
        glow(c, 58, 86, 18, PAL.ember);
        box(c, PAL.wood0, 54, 78, 2, 14);
        box(c, PAL.wood0, 54, 78, 7, 1);
        flames.push(lantern(c, 56, 80));
        return { canvas, flames };
    }

    function scenePlank(b, f, rand, s) {
        const horizon = 128;
        s.twinkle = nightSky(b, rand, horizon, { x: 160, y: 48, r: 24 }, 90);
        cloud(b, 120, 70, 60);
        cloud(b, 168, 34, 36);
        box(b, PAL.night2, 0, horizon + 1, SCENE_W, SCENE_H - horizon - 1);
        s.water = waterPaths(rand, horizon + 1, SCENE_H, 0, SCENE_W, 160, 26);

        const legacy = shipSide(rand, PAL.gold, PAL.ink, false);
        const debt = shipSide(rand, PAL.red, PAL.red, true);
        f.drawImage(legacy.canvas, 0, 0);
        f.save();
        f.scale(-1, 1);
        f.drawImage(debt.canvas, -SCENE_W, 0);
        f.restore();
        s.flames.push(...legacy.flames, ...debt.flames.map(([x, y]) => [SCENE_W - 1 - x, y]));
        // The gangplank, lashed at both ends, on its own layer so the director can wobble it.
        const [plank, p] = makeLayer(SCENE_W, SCENE_H);
        box(p, PAL.wood3, 56, 109, 208, 1);
        box(p, PAL.wood2, 56, 110, 208, 2);
        box(p, PAL.wood1, 56, 112, 208, 1);
        box(p, PAL.wood0, 56, 113, 208, 1);
        for (let x = 80; x < 250; x += 34) box(p, PAL.wood1, x, 110, 1, 2);
        for (const x of [62, 255]) {
            box(p, ROPE, x, 108, 3, 7);
            box(p, PAL.wood1, x, 110, 3, 1);
        }
        s.plank = plank;
    }

    // The winner's scene: the quarterdeck of the Legacy Monolith under the moon. The back layer is sky and
    // sea; the front is the whole ship (it rocks as one), with the wheel's pedestal but not the wheel itself.
    function sceneDeck(b, f, rand, s) {
        const { floorY, wheel, qdL, qdR, mainY, masts } = STAGE.deck;
        const horizon = 92;
        s.twinkle = nightSky(b, rand, horizon, STAGE.deck.moon, 100);
        cloud(b, 196, 64, 46);
        cloud(b, 40, 74, 34);
        box(b, PAL.night2, 0, horizon + 1, SCENE_W, SCENE_H - horizon - 1);
        s.water = waterPaths(rand, horizon + 1, 106, 0, SCENE_W, STAGE.deck.moon.x, 12);

        // Masts with bellied sails on their yards, black flags at the tops, shrouds with ratlines.
        for (const mx of masts) {
            const inward = mx < SCENE_W / 2 ? 1 : -1;
            const flagX = inward > 0 ? mx + 3 : mx - 13;
            for (const [dx, y1] of [[-24, 104], [-12, 104], [12, 104], [24, 104]]) rope(f, PAL.ink, mx, 8, mx + dx, y1);
            for (let y = 22; y < 102; y += 6) {
                const k = (y - 8) / 96;
                rope(f, PAL.ink, Math.round(mx - 24 * k), y, Math.round(mx - 12 * k), y);
                rope(f, PAL.ink, Math.round(mx + 12 * k), y, Math.round(mx + 24 * k), y);
            }
            box(f, PAL.wood1, mx - 2, 0, 5, mainY - 2);
            box(f, PAL.wood2, mx + 2, 0, 1, mainY - 2);
            box(f, PAL.wood0, mx - 2, 0, 1, mainY - 2);
            for (let y = 20; y < mainY - 4; y += 24) box(f, PAL.greyDark, mx - 2, y, 5, 1);
            box(f, PAL.wood1, mx - 7, 6, 15, 3);
            box(f, PAL.wood0, mx - 7, 9, 15, 1);
            box(f, PAL.ink, flagX, 0, 10, 6);
            box(f, PAL.white, flagX + 3, 1, 3, 2);
            box(f, PAL.white, flagX + 3, 3, 1, 1);
            box(f, PAL.white, flagX + 5, 3, 1, 1);
            for (const [y, w, h] of [[16, 44, 14], [42, 54, 18]]) {
                box(f, PAL.wood0, mx - w / 2 - 2, y - 1, w + 4, 2);
                for (let k = 0; k < w; k++) {
                    const x = mx - w / 2 + k;
                    const belly = Math.round(3 * Math.sin(Math.PI * (k + 0.5) / w));
                    const lit = inward > 0 ? k > w * 0.6 : k < w * 0.4;
                    box(f, lit ? PAL.moon : k % 9 === 4 ? PAL.parchmentDark : PAL.moonShade, x, y + 1, 1, h + belly);
                    box(f, PAL.parchmentDark, x, y + 1 + h + belly, 1, 1);
                    box(f, PAL.ink, x, y + 2 + h + belly, 1, 1);
                }
                box(f, PAL.parchmentDark, mx - w / 2, y + 1 + (h >> 1), w, 1);
            }
        }
        // A garland of signal flags strung between the mastheads, for the occasion.
        const [m0, m1] = masts;
        const FLAGS = [PAL.red, PAL.gold, PAL.blue, PAL.white, PAL.green];
        for (let k = 0, x = m0 + 4; x < m1 - 4; x++, k++) {
            const u = (x - m0) / (m1 - m0), y = Math.round(10 + 22 * 4 * u * (1 - u));
            box(f, PAL.ink, x, y, 1, 1);
            // A pennant every 10 px: a small downward triangle.
            if (k % 10 === 3) {
                const colour = FLAGS[Math.floor(k / 10) % FLAGS.length];
                [[-2, 5], [-1, 3], [-1, 2], [0, 1]].forEach(([dx, w], r) => box(f, colour, x + dx, y + 1 + r, w, 1));
            }
        }

        // The far bulwark along the waist, with its rail and posts, and the main deck in front of it.
        box(f, PAL.wood1, 0, 98, SCENE_W, mainY - 98);
        box(f, PAL.wood3, 0, 98, SCENE_W, 2);
        for (let x = 3; x < SCENE_W; x += 7) box(f, PAL.wood0, x, 100, 1, mainY - 100);
        box(f, PAL.wood0, 0, mainY - 2, SCENE_W, 2);
        const rows = [mainY, mainY + 4, mainY + 9, mainY + 15, mainY + 22, mainY + 30, mainY + 39, mainY + 49, SCENE_H];
        rows.slice(0, -1).forEach((y, k) => {
            const h = Math.min(rows[k + 1], SCENE_H) - y;
            box(f, k % 2 ? PAL.wood1 : PAL.wood2, 0, y, SCENE_W, h);
            box(f, PAL.wood0, 0, y, SCENE_W, 1);
            for (let x = (k * 41) % 70; x < SCENE_W; x += 70 + k * 6) box(f, PAL.wood0, x, y, 1, h);
        });
        // Cannons at the rail, and a barrel by each mast.
        for (const [x, dir] of [[6, 1], [SCENE_W - 6, -1]]) {
            box(f, PAL.ink, Math.min(x, x + dir * 22), 104, 23, 6);
            box(f, PAL.greyDark, Math.min(x, x + dir * 22) + 1, 105, 21, 2);
            box(f, PAL.ink, x + dir * 22 - (dir < 0 ? 2 : 0), 103, 3, 8);
            box(f, PAL.wood0, Math.min(x + dir * 4, x + dir * 16), 110, 13, 5);
            f.fillStyle = PAL.ink;
            disc(f, x + dir * 6, 114, 3);
            disc(f, x + dir * 16, 114, 3);
            box(f, PAL.wood2, x + dir * 6, 114, 1, 1);
            box(f, PAL.wood2, x + dir * 16, 114, 1, 1);
        }
        for (const mx of masts) barrel(f, mx + (mx < SCENE_W / 2 ? 9 : -20), 102, 11, 15);
        for (const mx of masts) {
            box(f, PAL.wood0, mx - 4, mainY - 3, 9, 3);
            box(f, PAL.wood3, mx - 4, mainY - 3, 9, 1);
        }

        // The quarterdeck: a raised stage across the middle, its stern rail against the sky behind the helm.
        const top = floorY - 6;
        for (let x = qdL; x <= qdR; x += 4) {
            box(f, PAL.wood2, x, top - 12, 2, 12);
            box(f, PAL.wood3, x, top - 12, 1, 12);
        }
        box(f, PAL.wood3, qdL - 1, top - 14, qdR - qdL + 4, 2);
        box(f, PAL.wood0, qdL - 1, top - 12, qdR - qdL + 4, 1);
        box(f, PAL.wood2, qdL - 2, top, qdR - qdL + 6, floorY - top);
        for (let y = top + 2; y < floorY; y += 2) box(f, PAL.wood1, qdL - 2, y, qdR - qdL + 6, 1);
        box(f, PAL.wood3, qdL - 2, top, qdR - qdL + 6, 1);
        // Its front wall, panelled, with gilt trim.
        box(f, PAL.wood1, qdL - 2, floorY, qdR - qdL + 6, mainY - floorY);
        box(f, PAL.gold, qdL - 2, floorY, qdR - qdL + 6, 1);
        box(f, PAL.goldDark, qdL - 2, floorY + 1, qdR - qdL + 6, 1);
        for (let x = qdL + 1; x < qdR - 8; x += 15) {
            frameRect(f, PAL.wood0, x, floorY + 5, 12, mainY - floorY - 9);
            box(f, PAL.wood2, x + 1, floorY + 6, 1, mainY - floorY - 11);
        }
        // Steps down to the main deck on both sides.
        for (const [x0, dir] of [[qdL - 3, -1], [qdR + 3, 1]]) {
            for (let k = 0; k < 4; k++) {
                const y = floorY + k * 6, x = dir < 0 ? x0 - (k + 1) * 5 : x0 + k * 5;
                box(f, PAL.wood3, x, y, 5, 1);
                box(f, PAL.wood2, x, y + 1, 5, mainY - y - 1);
                box(f, PAL.wood0, x + (dir < 0 ? 0 : 4), y + 1, 1, mainY - y - 1);
            }
        }
        // Stern lanterns on posts at the quarterdeck's corners.
        for (const x of [qdL + 2, qdR - 2]) {
            glow(f, x, top - 24, 18, PAL.ember);
            box(f, PAL.wood0, x, top - 20, 2, 20);
            s.flames.push(lantern(f, x - 1, top - 28));
        }
        // Lantern light pooling on the stern rail behind the helm.
        glow(f, STAGE.deck.helmX + 10, top - 16, 30, PAL.goldDark, (x, y) => y < top);
        // The wheel's pedestal; the turning wheel itself is drawn by the director.
        box(f, PAL.wood0, wheel.x - 1, wheel.y, 4, floorY - wheel.y);
        box(f, PAL.wood2, wheel.x, wheel.y, 1, floorY - wheel.y);
        box(f, PAL.wood0, wheel.x - 4, floorY - 3, 10, 3);
        box(f, PAL.wood3, wheel.x - 4, floorY - 3, 10, 1);
    }

    const SCENE_ART = {
        dock: sceneDock, tavern: sceneTavern, cliff: sceneCliff, plank: scenePlank, sea: sceneSea, cabin: sceneCabin, deck: sceneDeck,
    };

    // Twinkling stars and palette-cycled water (the scene's back half).
    function paintBack(c, s, t) {
        s.twinkle.forEach(([x, y], n) => box(c, Math.sin(t * 2.4 + n * 1.7) > 0.3 ? PAL.star : PAL.sky, x, y));
        s.water.forEach((paths, r) => paths.forEach((path, i) => {
            c.fillStyle = waterColour(i, t, RAMPS[r]);
            c.fill(path);
        }));
    }

    // The foreground over the water, then flickering flames; dy shifts both (a rocking ship).
    function paintFront(c, s, t, dy = 0) {
        c.drawImage(s.front, 0, dy);
        s.flames.forEach(([x, y], n) => {
            const k = (Math.floor(t * 9) + n) % 3;
            box(c, k === 1 ? PAL.lantern : PAL.flame, x, y + dy + (k === 1 ? 1 : 0), 1, k === 1 ? 1 : 2);
            if (k === 2) box(c, PAL.white, x, y + dy + 1);
        });
    }

    function paintScene(c, s, t) {
        paintBack(c, s, t);
        paintFront(c, s, t);
    }

    function sceneOf(key) {
        if (SCENES[key]) return SCENES[key];
        if (!SCENE_ART[key]) throw new Error(`Unknown scene: ${key}`);
        const [back, b] = makeLayer(SCENE_W, SCENE_H);
        const [front, f] = makeLayer(SCENE_W, SCENE_H);
        const s = { back, front, water: [], twinkle: [], flames: [] };
        SCENE_ART[key](b, f, seeded(SCENE_SEEDS[key]), s);
        const [full, c] = makeLayer(SCENE_W, SCENE_H);
        c.drawImage(back, 0, 0);
        paintScene(c, s, 0);
        s.full = full;
        return SCENES[key] = s;
    }

    // Static 320x180 backdrop for 'dock' | 'tavern' | 'cliff' | 'plank' | 'deck' (the gangplank itself is
    // sceneOf('plank').plank, drawn separately so it can wobble).
    const backdrop = (location) => sceneOf(location).full;
    // Static 320x180 intro scene for 'sea' | 'cabin'.
    const introBackdrop = (which) => sceneOf(which).full;
    // Per-frame overlay onto `sx`, after blitting the backdrop: animated water, foreground, flames.
    const drawWater = (key, t) => paintScene(sx, sceneOf(key), t);

    // Extra frames the knockout gags need: [pose, look change]. Hatless to run off, unarmed once the sword has flown.
    const GAG_FRAMES = {
        bare: ['stagger', { hat: 'none' }], run0: ['lunge', { hat: 'none' }], run1: ['idle1', { hat: 'none' }],
        unarmed: ['stagger', { unarmed: true }], flail: ['wobble', { unarmed: true }],
    };
    // hats[nameIdx] = { right, left, w, h, x, y }: the hat alone, and its top-left cell on a right-facing stagger frame.
    const hats = [];

    function buildHat(look) {
        const hat = PIRATE_MAPS.hat[look.hat];
        const w = Math.max(...hat.rows.map(row => row.length)) + 2, h = hat.rows.length + 2;
        const g = grid(w, h);
        stampMap(g, hat.rows, 1, 1, pirateLegend(look));
        const right = paintGrid(inkOutline(g));
        const [hx, hy] = POSES.stagger.head;
        return { right, left: mirrored(right), w, h, x: hx + hat.dx - 1, y: hy + hat.dy - 1 };
    }

    // The ship's wheel, face-on: a rim, a gilt hub and eight spokes running out to turned handles. Its
    // spokes repeat every 45 degrees, so WHEEL_STEPS frames across 45 degrees cover any angle.
    const WHEEL_SIZE = 33;
    const WHEEL_C = 16;
    const WHEEL_STEPS = 12;
    let wheelCanvases = null;

    function wheelFrames() {
        if (wheelCanvases) return wheelCanvases;
        wheelCanvases = Array.from({ length: WHEEL_STEPS }, (_, f) => {
            const g = grid(WHEEL_SIZE, WHEEL_SIZE);
            const a0 = f / WHEEL_STEPS * Math.PI / 4;
            const c = WHEEL_C + 0.5;
            for (let k = 0; k < 8; k++) {
                const a = a0 + k * Math.PI / 4, dx = Math.cos(a), dy = Math.sin(a);
                for (let r = 2; r <= 15; r += 0.5) cell(g, c + dx * r - 0.5, c + dy * r - 0.5, r > 12 ? (r > 14 ? PAL.wood3 : PAL.wood2) : PAL.wood2);
                cell(g, c + dx * 14 - 0.5 + dy * 0.7, c + dy * 14 - 0.5 - dx * 0.7, PAL.wood3);
                cell(g, c + dx * 14 - 0.5 - dy * 0.7, c + dy * 14 - 0.5 + dx * 0.7, PAL.wood3);
            }
            for (let y = 0; y < WHEEL_SIZE; y++) {
                for (let x = 0; x < WHEEL_SIZE; x++) {
                    const d = Math.hypot(x + 0.5 - c, y + 0.5 - c);
                    if (d >= 8.6 && d < 11.4) cell(g, x, y, d < 9.6 ? PAL.wood1 : (x + y < 2 * WHEEL_C ? PAL.wood3 : PAL.wood2));
                    if (d < 3.2) cell(g, x, y, d < 1.5 ? PAL.goldDark : PAL.gold);
                }
            }
            return paintGrid(inkOutline(g));
        });
        return wheelCanvases;
    }

    // Builds every pirate frame (both facings) for this game's looks, all scenes and the ship, before the first beat.
    function prewarm(plan) {
        pirates.length = 0;
        hats.length = 0;
        plan.looks.forEach((look, i) => {
            const right = buildPirate(look);
            const legend = pirateLegend(look);
            for (const [frame, [pose, change]] of Object.entries(GAG_FRAMES)) {
                right[frame] = paintGrid(inkOutline(poseGrid({ ...look, ...change }, pose, legend).g));
            }
            pirates[i] = { right, left: Object.fromEntries(Object.entries(right).map(([frame, canvas]) => [frame, mirrored(canvas)])) };
            hats[i] = buildHat(look);
        });
        Object.keys(SCENE_ART).forEach(sceneOf);
        shipSprite();
        wheelFrames();
    }

    // --- Director ---
    // A game is a list of beats laid end to end on the run clock: Beat = { kind, dur, data, events }.
    // A beat draws purely from its local time u in [0, dur]. Anything with a side effect (a sound, a roster
    // strike-out, a status line) is an event { at, kind, ... } at a local time; advanceRun fires every event
    // the clock has passed, in order, so draw() never has side effects and a long step never drops one.
    // Seconds. Typed lines run at perChar, clamped to [minType, maxType] so every duel lands in about 8-9 s
    // whatever its line lengths; the menu's cursor steps share at most hoverMax between them.
    const TIMING = Object.freeze({
        notice: 3.0, noticeUpdate: 2.0, walkin: 0.8,
        insult: Object.freeze({ perChar: 0.035, minType: 1.1, maxType: 1.5, hold: 0.7 }),
        menu: Object.freeze({ slide: 0.5, hover: 0.45, hoverMax: 1.2, pick: 0.4 }),
        comeback: Object.freeze({ perChar: 0.035, minType: 0.6, maxType: 1.1, hold: 0.6 }),
        clash: 1.0, gag: 1.6,
        // The opening story (first Start after the page loads only), one entry per beat. The first four run
        // on the theme's bars (7 bars in all), so the title smash starts on the brass hit in bar 8.
        intro: Object.freeze({ sea: 2 * BAR_S, cabin: 2 * BAR_S, parrot: BAR_S, tavern: 2 * BAR_S, title: 2.5 }),
        // The final: a slow walk out onto the plank, and a slower cursor that is never squeezed by hoverMax.
        finalWalk: 2.0, finalHover: 0.7,
        // The winner's scene runs this long, then holds (looping gently) until Play again. The final's result
        // line stays readable for winnerStatus seconds before the winner's line replaces it.
        winner: 8.0, winnerStatus: 2.0,
    });

    const statusEl = document.getElementById('status');
    const motionQuery = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
    const reducedMotion = () => Boolean(motionQuery && motionQuery.matches);

    // The game being played: the plan and the names it was planned for (the roster is locked meanwhile).
    const game = { plan: null, names: [], playing: false };

    function setStatus(text) {
        statusEl.textContent = text;
    }

    const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
    const lerp = (a, b, k) => a + (b - a) * k;
    const easeOut = (k) => 1 - (1 - k) ** 2;
    const span = (u, from, to) => clamp((u - from) / (to - from), 0, 1);

    // Indexed by rounds from the end, like DuelCore.LOCATIONS.
    const ROUND_NAMES = ['Final', 'Semi-final', 'Quarter-final', 'Round 1'];
    const NOTICE_HEADINGS = ['The Final', 'Semi-finals', 'Quarter-finals', 'Round 1'];
    const fromEnd = (plan, r) => plan.rounds.length - 1 - r;

    // Small pixel maps, built once.
    const pixelMap = (rows, legend) => {
