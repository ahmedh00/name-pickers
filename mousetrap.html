        return { state: 'tub' };
    }

    function poleShake(T) {
        const f = phase(T, ...STAGE.shake);
        return f > 0 && f < 1 ? Math.sin(f * 40) * 2.5 * (1 - f) : 0;
    }

    function cageTop(T) {
        const f = phase(T, CAGE_DROP, CAGE_LAND);
        let y = lerp(CAGE.upTop, CAGE.downTop, easeIn(f));
        y -= Math.sin(phase(T, CAGE_LAND, CAGE_LAND + 0.22) * Math.PI) * 7;
        return y;
    }

    // --- Drawing the contraption ---
    function groundShadow(x, y, rx, ry = rx * 0.28) {
        ctx.fillStyle = 'rgba(20, 50, 10, 0.28)';
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
        ctx.fill();
    }

    function outlined(fill, stroke = 'rgba(0, 0, 0, 0.55)', width = 2) {
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.strokeStyle = stroke;
        ctx.lineWidth = width;
        ctx.stroke();
    }

    function drawGear(g, angle) {
        const { x, y, r, teeth, color, dark } = g;
        const w = TAU / teeth;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.beginPath();
        for (let k = 0; k < teeth; k++) {
            const a = k * w;
            for (const [da, rr] of [[-0.5, r - 1], [-0.28, r], [-0.16, r + 6], [0.16, r + 6], [0.28, r]]) {
                ctx.lineTo(Math.cos(a + da * w) * rr, Math.sin(a + da * w) * rr);
            }
        }
        ctx.closePath();
        const face = ctx.createRadialGradient(-r * 0.3, -r * 0.3, 2, 0, 0, r + 6);
        face.addColorStop(0, '#ffffff');
        face.addColorStop(0.25, color);
        face.addColorStop(1, color);
        outlined(face, dark, 2);
        ctx.fillStyle = dark;
        for (let k = 0; k < 4; k++) {
            ctx.beginPath();
            ctx.arc(Math.cos(k * TAU / 4) * r * 0.58, Math.sin(k * TAU / 4) * r * 0.58, r * 0.16, 0, TAU);
            ctx.fill();
        }
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.28, 0, TAU);
        outlined('#e9e9ee', dark, 2);
        ctx.restore();
    }

    function drawGears(T) {
        const a = crankAngle(T);
        groundShadow(784, GEAR_FLOOR, 78);
        // Stand
        ctx.beginPath();
        ctx.roundRect(706, GEAR_FLOOR - 10, 152, 12, 4);
        outlined('#43b047', '#2a7a2d');
        for (const g of [GEAR_A, GEAR_B]) {
            ctx.beginPath();
            ctx.roundRect(g.x - 6, g.y, 12, GEAR_FLOOR - 8 - g.y, 3);
            outlined('#43b047', '#2a7a2d');
        }
        drawGear(GEAR_B, MESH + Math.PI + Math.PI / GEAR_B.teeth - a * RATIO);
        drawGear(GEAR_A, MESH + a);

        // Lever on gear B
        const la = leverAngle(T);
        const lx = GEAR_B.x + Math.cos(la) * LEVER.len, ly = GEAR_B.y + Math.sin(la) * LEVER.len;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#7a1910';
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.moveTo(GEAR_B.x, GEAR_B.y);
        ctx.lineTo(lx, ly);
        ctx.stroke();
        ctx.strokeStyle = '#e63b2e';
        ctx.lineWidth = 6;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(lx, ly, 6, 0, TAU);
        outlined('#ffc93c', '#7a1910');

        // Crank handle on gear A
        const ca = a - Math.PI / 2;
        const hx = GEAR_A.x + Math.cos(ca) * 30, hy = GEAR_A.y + Math.sin(ca) * 30;
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(GEAR_A.x, GEAR_A.y);
        ctx.lineTo(hx, hy);
        ctx.stroke();
        ctx.strokeStyle = '#c9ccd6';
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(hx, hy - 4, 7, 10, 0, 0, TAU);
        outlined('#e63b2e', '#7a1910');
        ctx.lineCap = 'butt';
        ctx.beginPath();
        ctx.arc(GEAR_A.x, GEAR_A.y, 5, 0, TAU);
        outlined('#ffffff', '#555');
    }

    function drawStopSign(T) {
        groundShadow(SIGN.x, SIGN.y, 14);
        ctx.save();
        ctx.translate(SIGN.x, SIGN.y);
        ctx.beginPath();
        ctx.roundRect(-9, -6, 18, 8, 3);
        outlined('#ffc93c', '#a8770f');
        ctx.rotate(signAngle(T));
        ctx.beginPath();
        ctx.rect(-2.5, -SIGN.len, 5, SIGN.len);
        outlined('#c9ccd6', '#555', 1);
        ctx.translate(0, -SIGN.len);
        ctx.beginPath();
        for (let k = 0; k < 8; k++) {
            const a = (k + 0.5) * TAU / 8;
            ctx.lineTo(Math.cos(a) * 16, Math.sin(a) * 16);
        }
        ctx.closePath();
        outlined('#e63b2e', '#ffffff', 2.5);
        ctx.fillStyle = '#fff';
        ctx.font = `900 8px ${LOGO_FONT}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('STOP', 0, 0.5);
        ctx.restore();
    }

    function drawBoot(T) {
        // Gallows post
        groundShadow(BOOT.post, BOOT.floor, 14);
        ctx.beginPath();
        ctx.roundRect(BOOT.post - 5, BOOT.y - 10, 10, BOOT.floor - BOOT.y + 10, 3);
        outlined('#ff8a1f', '#a8520a');
        ctx.beginPath();
        ctx.roundRect(BOOT.x - 6, BOOT.y - 12, BOOT.post - BOOT.x + 11, 9, 3);
        outlined('#ff8a1f', '#a8520a');

        ctx.save();
        ctx.translate(BOOT.x, BOOT.y);
        ctx.rotate(bootAngle(T));
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, BOOT.len);
        ctx.stroke();
        // The boot: shaft, then the foot with its toe pointing left.
        ctx.translate(0, BOOT.len);
        ctx.beginPath();
        ctx.moveTo(-9, 0);
        ctx.lineTo(10, 0);
        ctx.lineTo(13, 26);
        ctx.quadraticCurveTo(14, 34, 6, 34);
        ctx.lineTo(-28, 34);
        ctx.quadraticCurveTo(-34, 33, -32, 26);
        ctx.quadraticCurveTo(-28, 18, -10, 17);
        ctx.closePath();
        const leather = ctx.createLinearGradient(-30, 0, 14, 34);
        leather.addColorStop(0, '#a8662e');
        leather.addColorStop(1, '#6a3a16');
        outlined(leather, '#3a1d08');
        ctx.fillStyle = '#2a1405';
        ctx.fillRect(-32, 31, 46, 4);
        ctx.strokeStyle = '#f6e7c8';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (const ly of [6, 11, 16]) {
            ctx.moveTo(-6, ly);
            ctx.lineTo(4, ly + 3);
        }
        ctx.stroke();
        ctx.restore();
    }

    function drawSteelBall(b) {
        if (b.sinking > 0.6) return; // gone down the funnel
        const g = ctx.createRadialGradient(b.x - 2.5, b.y - 2.5, 1, b.x, b.y, BALL_R);
        g.addColorStop(0, '#ffffff');
        g.addColorStop(0.5, '#b8bfcc');
        g.addColorStop(1, '#5d6472');
        ctx.beginPath();
        ctx.arc(b.x, b.y, BALL_R, 0, TAU);
        outlined(g, '#3d434f', 1);
    }

    function drawBucket(T, ball) {
        groundShadow(BUCKET.x + 20, BUCKET.floor, 16);
        ctx.beginPath();
        ctx.roundRect(BUCKET.x + 16, BUCKET.y, 8, BUCKET.floor - BUCKET.y, 2);
        outlined('#43b047', '#2a7a2d');
        ctx.beginPath();
        ctx.roundRect(BUCKET.x - 6, BUCKET.y, 52, 6, 2);
        outlined('#43b047', '#2a7a2d');

        ctx.save();
        ctx.translate(BUCKET.x, BUCKET.y);
        ctx.rotate(bucketAngle(T));
        // Inside, then the ball sitting in it, then the front.
        ctx.beginPath();
        ctx.ellipse(15, -26, 17, 5, 0, 0, TAU);
        outlined('#123a73', '#0c2a55', 1);
        ctx.restore();
        if (ball.inBucket) drawSteelBall(ball);
        ctx.save();
        ctx.translate(BUCKET.x, BUCKET.y);
        ctx.rotate(bucketAngle(T));
        ctx.beginPath();
        ctx.moveTo(-2, -26);
        ctx.lineTo(2, 0);
        ctx.quadraticCurveTo(15, 4, 28, 0);
        ctx.lineTo(32, -26);
        ctx.quadraticCurveTo(15, -21, -2, -26);
        const pail = ctx.createLinearGradient(-2, 0, 32, 0);
        pail.addColorStop(0, '#1b4f99');
        pail.addColorStop(0.4, '#5aa0ff');
        pail.addColorStop(1, '#1b4f99');
        outlined(pail, '#0c2a55');
        ctx.strokeStyle = '#c9ccd6';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(15, -26, 15, Math.PI * 1.05, Math.PI * 1.95);
        ctx.stroke();
        ctx.restore();
    }

    const STEP_COLORS = ['#ffc93c', '#ff8a1f', '#e63b2e', '#2f7de1', '#43b047', '#ffc93c'];
    function drawStairs() {
        const { x, y, w, h, n, floor } = STAIRS;
        groundShadow(x - (n * w) / 2, floor, (n * w) / 2 + 10, 7);
        for (const k of [0, 3, 5]) {
            const sx = x - w * (k + 0.5);
            ctx.beginPath();
            ctx.roundRect(sx - 3, y + h * k + 10, 6, floor - (y + h * k + 10), 2);
            outlined('#c9ccd6', '#666', 1);
        }
        for (let k = 0; k < n; k++) {
            const sx = x - w * (k + 1), sy = y + h * k;
            ctx.save();
            ctx.translate(sx + w / 2, sy + h / 2);
            ctx.rotate(k % 2 ? 0.07 : -0.05); // a crooked staircase
            ctx.beginPath();
            ctx.roundRect(-w / 2, -h / 2, w, h + 4, 3);
            outlined(STEP_COLORS[k], 'rgba(0, 0, 0, 0.5)');
            ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.fillRect(-w / 2 + 2, -h / 2 + 2, w - 4, 3);
            ctx.restore();
        }
    }

    function drawPipe(T) {
        groundShadow(PIPE.x + 20, PIPE.floor, 30, 6);
        ctx.lineCap = 'butt';
        ctx.lineJoin = 'round';
        const path = () => {
            ctx.beginPath();
            ctx.moveTo(PIPE.x, PIPE.top + 8);
            ctx.lineTo(PIPE.x, PIPE.bottom);
            ctx.quadraticCurveTo(PIPE.x, PIPE.exitY, PIPE.x + 20, PIPE.exitY);
            ctx.lineTo(PIPE.exitX - 2, PIPE.exitY);
        };
        path();
        ctx.strokeStyle = '#0c2a55';
        ctx.lineWidth = 22;
        ctx.stroke();
        path();
        ctx.strokeStyle = '#2f7de1';
        ctx.lineWidth = 18;
        ctx.stroke();
        path();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = 4;
        ctx.stroke();
        // While the ball is inside, a bulge travels down the pipe.
        const f = phase(T, ...STAGE.pipe);
        if (f > 0 && f < 1) {
            const p = f < 0.7
                ? { x: PIPE.x, y: lerp(PIPE.top + 10, PIPE.bottom, f / 0.7) }
                : { x: lerp(PIPE.x + 6, PIPE.exitX - 4, (f - 0.7) / 0.3), y: PIPE.exitY - 2 };
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, 12, 12, 0, 0, TAU);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.fill();
        }
        ctx.beginPath();
        ctx.ellipse(PIPE.exitX, PIPE.exitY, 4, 10, 0, 0, TAU);
        outlined('#0b1a33', '#0c2a55');
        // Funnel on top
        ctx.beginPath();
        ctx.moveTo(PIPE.x - 18, PIPE.top - 8);
        ctx.lineTo(PIPE.x + 18, PIPE.top - 8);
        ctx.lineTo(PIPE.x + 10, PIPE.top + 10);
        ctx.lineTo(PIPE.x - 10, PIPE.top + 10);
        ctx.closePath();
        outlined('#ffc93c', '#a8770f');
        ctx.beginPath();
        ctx.ellipse(PIPE.x, PIPE.top - 8, 18, 5, 0, 0, TAU);
        outlined('#5a3d06', '#a8770f');
    }

    function drawPost(T) {
        groundShadow(POST.x, POST.y, 16);
        ctx.beginPath();
        ctx.roundRect(POST.x - 10, POST.y - 8, 20, 10, 3);
        outlined('#ffc93c', '#a8770f');
        ctx.save();
        ctx.translate(POST.x, POST.y - 4);
        ctx.rotate(postAngle(T));
        ctx.beginPath();
        ctx.roundRect(-4, -POST.len, 8, POST.len, 3);
        outlined('#e63b2e', '#7a1910');
        // The helping hand: a cartoon glove at the top, pointing right.
        ctx.translate(0, -POST.len + 6);
        ctx.beginPath();
        ctx.roundRect(-7, -6, 10, 14, 3);
        outlined('#e63b2e', '#7a1910');
        ctx.beginPath();
        ctx.ellipse(10, 0, 10, 9, 0, 0, TAU);
        outlined('#ffffff', '#555');
        for (const [fy, len] of [[-6, 10], [-2, 12], [2, 11], [6, 8]]) {
            ctx.beginPath();
            ctx.roundRect(14, fy - 2, len, 4.5, 2.2);
            outlined('#ffffff', '#555', 1.2);
        }
        ctx.beginPath();
        ctx.ellipse(8, -9, 4, 6, -0.6, 0, TAU);
        outlined('#ffffff', '#555', 1.2);
        ctx.restore();
    }

    function drawRamp() {
        // Perch the bowling ball waits on
        ctx.beginPath();
        ctx.roundRect(PERCH.x - 3, PERCH.y + BOWL_R, 6, RAMP_FLOOR - PERCH.y - BOWL_R, 2);
        outlined('#c9ccd6', '#666', 1);
        groundShadow(480, RAMP_FLOOR, 90, 8);
        for (let k = 0; k + 1 < RAMP_POINTS.length; k += 2) {
            const a = RAMP_POINTS[k], b = RAMP_POINTS[k + 1];
            const low = a.y > b.y ? a : b;
            ctx.beginPath();
            ctx.roundRect(low.x - 3, low.y + BOWL_R, 6, RAMP_FLOOR - low.y - BOWL_R, 2);
            outlined('#c9ccd6', '#666', 1);
            const off = BOWL_R + 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(a.x, a.y + off);
            ctx.lineTo(b.x, b.y + off);
            ctx.strokeStyle = '#7a1910';
            ctx.lineWidth = 11;
            ctx.stroke();
            ctx.strokeStyle = k === 2 ? '#2f7de1' : '#e63b2e';
            ctx.lineWidth = 7;
            ctx.stroke();
            ctx.strokeStyle = '#ffc93c';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y + off - 4);
            ctx.lineTo(b.x, b.y + off - 4);
            ctx.stroke();
            ctx.lineCap = 'butt';
        }
        ctx.beginPath();
        ctx.ellipse(PERCH.x, PERCH.y + BOWL_R, 9, 4, 0, 0, TAU);
        outlined('#ffc93c', '#a8770f');
    }

    function drawBowlingBall(b) {
        ctx.save();
        ctx.translate(b.x, b.y);
        const g = ctx.createRadialGradient(-4, -5, 1, 0, 0, BOWL_R);
        g.addColorStop(0, '#6b6f80');
        g.addColorStop(1, '#14151c');
        ctx.beginPath();
        ctx.arc(0, 0, BOWL_R, 0, TAU);
        outlined(g, '#000', 1);
        ctx.rotate(b.spin);
        ctx.fillStyle = '#000';
        for (const [hx, hy] of [[3, -5], [-2, -6], [0, 2]]) {
            ctx.beginPath();
            ctx.arc(hx, hy, 1.8, 0, TAU);
            ctx.fill();
        }
        ctx.restore();
    }

    function drawTub(T, ball) {
        const { x, y, rx } = TUB;
        groundShadow(x, TUB.floor, rx + 6, 7);
        for (const px of [x - 26, x + 26]) {
            ctx.beginPath();
            ctx.roundRect(px - 3, y + 16, 6, TUB.floor - y - 16, 2);
            outlined('#c9ccd6', '#666', 1);
        }
        ctx.beginPath();
        ctx.roundRect(x - rx + 6, y + 14, rx * 2 - 12, 6, 2);
        outlined('#ff8a1f', '#a8520a');
        // Inside of the tub, then the ball sinking into it, then the outside.
        ctx.beginPath();
        ctx.ellipse(x, y - 12, rx, 8, 0, 0, TAU);
        outlined('#cfe9ff', '#7a8a9a', 1.5);
        if (ball.inTub) drawBowlingBall(ball);
        ctx.beginPath();
        ctx.moveTo(x - rx, y - 12);
        ctx.ellipse(x, y - 12, rx, 8, 0, Math.PI, 0, true);
        ctx.lineTo(x + rx - 2, y + 2);
        ctx.quadraticCurveTo(x + rx - 6, y + 14, x + rx - 18, y + 14);
        ctx.lineTo(x - rx + 18, y + 14);
        ctx.quadraticCurveTo(x - rx + 6, y + 14, x - rx + 2, y + 2);
        ctx.closePath();
        const enamel = ctx.createLinearGradient(0, y - 12, 0, y + 14);
        enamel.addColorStop(0, '#ffffff');
        enamel.addColorStop(1, '#c9d2dd');
        outlined(enamel, '#5d6b7a');
        ctx.fillStyle = '#ffc93c';
        for (const fx of [x - rx + 10, x + rx - 10]) {
            ctx.beginPath();
            ctx.ellipse(fx, y + 15, 4, 3, 0, 0, TAU);
            ctx.fill();
        }
    }

    function drawDiver(d) {
        ctx.save();
        ctx.translate(d.x, d.y);
        if (d.state === 'fly') {
            ctx.translate(0, -16);
            ctx.rotate(d.rot);
            ctx.translate(0, 16);
        } else {
            ctx.rotate(d.rot);
        }
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#e8b48a';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(-2.5, -12);
        ctx.lineTo(-3, 0);
        ctx.moveTo(2.5, -12);
        ctx.lineTo(3, 0);
        // Arms up, ready to dive
        ctx.moveTo(-4, -24);
        ctx.lineTo(-6, -36);
        ctx.moveTo(4, -24);
        ctx.lineTo(6, -36);
        ctx.stroke();
        ctx.beginPath();
        ctx.roundRect(-5.5, -26, 11, 15, 4);
        outlined('#ffffff', '#7a1910', 1.2);
        ctx.fillStyle = '#e63b2e';
        for (const sy of [-23, -18, -13.5]) ctx.fillRect(-5, sy, 10, 2.2);
        ctx.beginPath();
        ctx.arc(0, -31, 5.5, 0, TAU);
        outlined('#f2c9a0', '#8a5a3a', 1.2);
        ctx.beginPath();
        ctx.arc(0, -32, 5.8, Math.PI * 1.05, Math.PI * 1.95);
        ctx.fillStyle = '#e63b2e';
        ctx.fill();
        ctx.restore();
        ctx.lineCap = 'butt';
    }

    // Head first in the water: just the legs kick above the surface.
    function drawDiverLegs(x, waterY, time) {
        const kick = Math.sin(time * 12) * 4;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#e8b48a';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(x - 3, waterY + 2);
        ctx.lineTo(x - 5 - kick, waterY - 17);
        ctx.moveTo(x + 3, waterY + 2);
        ctx.lineTo(x + 5 + kick, waterY - 17);
        ctx.stroke();
        ctx.lineCap = 'butt';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(x, waterY + 2, 11, 3, 0, 0, TAU);
        ctx.stroke();
    }

    function drawSeesaw(T, dv) {
        groundShadow(SEESAW.x, SEESAW.floor, SEESAW.half, 6);
        ctx.beginPath();
        ctx.moveTo(SEESAW.x, SEESAW.y);
        ctx.lineTo(SEESAW.x - 13, SEESAW.floor);
        ctx.lineTo(SEESAW.x + 13, SEESAW.floor);
        ctx.closePath();
        outlined('#ffc93c', '#a8770f');
        ctx.save();
        ctx.translate(SEESAW.x, SEESAW.y);
        ctx.rotate(seesawAngle(T));
        ctx.beginPath();
        ctx.roundRect(-SEESAW.half, -7, SEESAW.half * 2, 7, 3);
        outlined('#2f7de1', '#0c2a55');
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.fillRect(-SEESAW.half + 3, -6, SEESAW.half * 2 - 6, 2);
        ctx.restore();
        if (dv.state === 'stand') drawDiver(dv);
    }

    function drawWashtub(T, dv, time) {
        const shake = T > STAGE.dive[1] && T < STAGE.dive[1] + 0.35 ? Math.sin(T * 90) * 2 : 0;
        const x = WASHTUB.x + shake, y = WASHTUB.y, rx = WASHTUB.rx;
        groundShadow(WASHTUB.x, WASHTUB.floor, rx + 6, 7);
        ctx.beginPath();
        ctx.ellipse(x, y - 14, rx, 9, 0, 0, TAU);
        outlined('#7ec8ff', '#a8520a', 1.5);
        if (dv.state === 'tub') drawDiverLegs(x, y - 14, time);
        ctx.beginPath();
        ctx.moveTo(x - rx, y - 14);
        ctx.ellipse(x, y - 14, rx, 9, 0, Math.PI, 0, true);
        ctx.lineTo(x + rx - 6, y + 10);
        ctx.ellipse(x, y + 10, rx - 6, 6, 0, 0, Math.PI);
        ctx.closePath();
        const metal = ctx.createLinearGradient(x - rx, 0, x + rx, 0);
        metal.addColorStop(0, '#c95f0a');
        metal.addColorStop(0.35, '#ffa64d');
        metal.addColorStop(1, '#b8520a');
        outlined(metal, '#6a2f05');
        ctx.strokeStyle = 'rgba(80, 30, 0, 0.45)';
        ctx.lineWidth = 2;
        for (const ry of [-4, 4]) {
            ctx.beginPath();
            ctx.ellipse(x, y + ry, rx - 3, 7, 0, 0.15, Math.PI - 0.15);
            ctx.stroke();
        }
    }

    // Water thrown up when the diver lands.
    function drawSplash(T) {
        const s = T - STAGE.dive[1];
        if (s <= 0 || s >= STAGE.splash[1] - STAGE.splash[0]) return;
        const fade = 1 - s / (STAGE.splash[1] - STAGE.splash[0]);
        ctx.save();
        ctx.globalAlpha = fade;
        ctx.fillStyle = '#7ec8ff';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        for (let k = 0; k < 16; k++) {
            const a = -Math.PI / 2 + (k / 15 - 0.5) * 2.4;
            const v = 110 + ((k * 37) % 60);
            const px = WASHTUB.x + Math.cos(a) * v * s;
            const py = WASHTUB.y - 16 + Math.sin(a) * v * s + 0.5 * 700 * s * s;
            ctx.beginPath();
            ctx.ellipse(px, py, 3.2, 4.5, a + Math.PI / 2, 0, TAU);
            ctx.fill();
            ctx.stroke();
        }
        ctx.beginPath();
        ctx.ellipse(WASHTUB.x, WASHTUB.y - 14, WASHTUB.rx * (0.6 + s), 9 * (0.6 + s), 0, 0, TAU);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
    }

    // The washtub sits on a lever that jolts the pole when the diver lands.
    function drawTrigger(T) {
        const jolt = Math.sin(phase(T, STAGE.dive[1], STAGE.dive[1] + 0.3) * Math.PI) * 6;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#a8770f';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(WASHTUB.x - WASHTUB.rx + 6, WASHTUB.y + 4);
        ctx.lineTo(POLE.x + 8 + poleShake(T), POLE.base - 40 - jolt);
        ctx.stroke();
        ctx.strokeStyle = '#ffc93c';
        ctx.lineWidth = 5;
        ctx.stroke();
        ctx.lineCap = 'butt';
    }

    function drawPole(T) {
        const x = POLE.x + poleShake(T);
        // A notched post: the notches make the cage shimmy on the way down.
        ctx.beginPath();
        ctx.moveTo(x - 5, POLE.base);
        for (let y = POLE.base; y > POLE.top; y -= 10) {
            ctx.lineTo(x - 5, y - 5);
            ctx.lineTo(x - 7.5, y - 8);
            ctx.lineTo(x - 5, y - 10);
        }
        ctx.lineTo(x + 5, POLE.top);
        for (let y = POLE.top; y < POLE.base; y += 10) {
            ctx.lineTo(x + 5, y + 5);
            ctx.lineTo(x + 7.5, y + 8);
            ctx.lineTo(x + 5, y + 10);
        }
        ctx.closePath();
        const red = ctx.createLinearGradient(x - 6, 0, x + 6, 0);
        red.addColorStop(0, '#9e2116');
        red.addColorStop(0.4, '#ff6a5e');
        red.addColorStop(1, '#9e2116');
        outlined(red, '#5a120b', 1.2);
        ctx.beginPath();
        ctx.arc(x, POLE.top - 4, 8, 0, TAU);
        outlined('#ffc93c', '#a8770f');
        // Latch that holds the cage up
        const open = easeOut(phase(T, ...STAGE.latch));
        ctx.save();
        ctx.translate(x + 5, CAGE.upTop + 2);
        ctx.rotate(-0.25 - 1.2 * open);
        ctx.beginPath();
        ctx.roundRect(0, -3, 20, 6, 3);
        outlined('#ffc93c', '#a8770f');
        ctx.restore();
    }

    // The cage is drawn in two halves so a caught mouse sits inside it.
    function drawCageHalf(T, front) {
        const top = cageTop(T);
        const drop = phase(T, CAGE_DROP, CAGE_LAND);
        const x = POLE.x + poleShake(T) + (drop > 0 && drop < 1 ? Math.sin(T * 55) * 2.5 : 0);
        const bottom = top + CAGE.h;
        const rt = CAGE.rx * 0.82, rb = CAGE.rx;
        ctx.save();
        ctx.lineCap = 'round';
        const bars = 14;
        for (let k = 0; k < bars; k++) {
            const a = (k / bars) * TAU;
            if ((Math.sin(a) >= 0) !== front) continue;
            ctx.beginPath();
            ctx.moveTo(x + Math.cos(a) * rt, top + Math.sin(a) * CAGE.ry * 0.8);
            ctx.lineTo(x + Math.cos(a) * rb, bottom + Math.sin(a) * CAGE.ry);
            ctx.strokeStyle = front ? '#2f7de1' : '#1b4f99';
            ctx.lineWidth = front ? 3.2 : 2.4;
            ctx.stroke();
        }
        const ring = (cy, rx, ry, w) => {
            ctx.beginPath();
            if (front) ctx.ellipse(x, cy, rx, ry, 0, 0, Math.PI);
            else ctx.ellipse(x, cy, rx, ry, 0, Math.PI, TAU);
            ctx.strokeStyle = front ? '#2f7de1' : '#1b4f99';
            ctx.lineWidth = w;
            ctx.stroke();
        };
        ring(top, rt, CAGE.ry * 0.8, 4);
        ring((top + bottom) / 2, (rt + rb) / 2, CAGE.ry * 0.9, 2.5);
        ring(bottom, rb, CAGE.ry, 5);
        if (front) {
            // Lid and the collar that slides on the pole
            ctx.beginPath();
            ctx.ellipse(x, top, rt * 0.55, CAGE.ry * 0.45, 0, 0, TAU);
            outlined('rgba(47, 125, 225, 0.85)', '#0c2a55', 1.5);
            ctx.beginPath();
            ctx.roundRect(x - 9, top - 9, 18, 12, 4);
            outlined('#ffc93c', '#a8770f');
        }
        ctx.restore();
    }

    // Puffs of dust when the cage slams down.
    function drawDust(T) {
        const f = phase(T, CAGE_LAND, CAGE_LAND + 0.7);
        if (f <= 0 || f >= 1) return;
        ctx.save();
        ctx.globalAlpha = (1 - f) * 0.8;
        ctx.fillStyle = '#f6ecd2';
        for (let k = 0; k < 10; k++) {
            const a = (k / 10) * TAU;
            const d = CAGE.rx + 6 + f * 34;
            ctx.beginPath();
            ctx.arc(POLE.x + Math.cos(a) * d, CHEESE_SQ.y + 4 + Math.sin(a) * d * 0.35, 6 + f * 8, 0, TAU);
            ctx.fill();
        }
        ctx.restore();
    }

    function contraptionItems(T, time) {
        const sb = steelBall(T), bb = bowlingBall(T), dv = diver(T);
        const cageDown = T >= CAGE_DROP;
        const items = [
            { y: BOOT.floor, draw: () => drawBoot(T) },
            { y: BUCKET.floor, draw: () => drawBucket(T, sb) },
            { y: SIGN.y, draw: () => drawStopSign(T) },
            { y: GEAR_FLOOR, draw: () => drawGears(T) },
            { y: STAIRS.floor, draw: () => drawStairs() },
            { y: PIPE.floor, draw: () => drawPipe(T) },
            { y: POST.y, draw: () => drawPost(T) },
            { y: RAMP_FLOOR, draw: () => drawRamp() },
            { y: TUB.floor, draw: () => drawTub(T, bb) },
            { y: SEESAW.floor, draw: () => drawSeesaw(T, dv) },
            { y: WASHTUB.floor, draw: () => drawWashtub(T, dv, time) },
            { y: WASHTUB.floor + 1, draw: () => drawSplash(T) },
            { y: WASHTUB.floor + 2, draw: () => drawTrigger(T) },
            { y: POLE.base, draw: () => drawPole(T) },
            // Up on the pole the cage is drawn round the pole; once it falls, round the cheese.
            { y: cageDown ? CHEESE_SQ.y - 30 : POLE.base - 0.1, draw: () => drawCageHalf(T, false) },
            { y: cageDown ? CHEESE_SQ.y + 40 : POLE.base + 0.1, draw: () => drawCageHalf(T, true) },
            { y: CHEESE_SQ.y + 41, draw: () => drawDust(T) },
        ];
        if (sb.layer !== null) items.push({ y: sb.layer, draw: () => drawSteelBall(sb) });
        if (bb.layer !== null) items.push({ y: bb.layer, draw: () => drawBowlingBall(bb) });
        if (dv.state === 'fly') items.push({ y: WASHTUB.floor - 1, draw: () => drawDiver(dv) });
        return items;
    }

    // --- Self-test view (?selftest) ---
    function showSelfTest() {
        document.getElementById('gameView').hidden = true;
        document.getElementById('selftestPanel').hidden = false;
        document.getElementById('backLink').href = location.pathname;
        const out = document.getElementById('selftestResults');
        const test = MouseCore.startSelfTest();
        const tick = () => {
            if (!test.step(400)) {
                const { done, total } = test.progress();
                out.textContent = `Planning games… ${done.toLocaleString()} of ${total.toLocaleString()}`;
                setTimeout(tick, 0);
                return;
            }
            const result = test.result();
            out.innerHTML = '';
            const summary = document.createElement('div');
            summary.className = `summary ${result.passed ? 'pass' : 'fail'}`;
            summary.textContent = result.passed ? 'ALL CHECKS PASSED' : 'CHECK FAILED';
            out.appendChild(summary);
            const intro = document.createElement('p');
            intro.textContent = `Planned ${result.plans.toLocaleString()} games without playing them, using the same code as the real game. ` +
                'Each check compares the results with what perfect fairness would give.';
            out.appendChild(intro);
            for (const c of result.checks) {
                const row = document.createElement('div');
                row.className = `check ${c.passed ? 'pass' : 'fail'}`;
                const title = document.createElement('div');
                title.className = 'title';
                title.textContent = c.name;
                const detail = document.createElement('div');
                detail.className = 'detail';
                detail.textContent = c.detail;
                row.append(title, detail);
                out.appendChild(row);
            }
        };
        out.textContent = 'Planning games…';
        setTimeout(tick, 50);
    }

    // --- Start up ---
    if (new URLSearchParams(location.search).has('selftest')) {
        showSelfTest();
    } else {
        participants = loadNames();
        resetBoard();
        updateList();
        requestAnimationFrame(frame);
    }
</script>
</body>
